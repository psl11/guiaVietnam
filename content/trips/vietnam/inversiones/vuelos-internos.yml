title: Los cinco vuelos de dentro
verdict: imprescindible
verdictLabel: Los cinco, comprados ✓
lede: >-
  Sin vuelos internos este itinerario no existe: ni Camboya en tres días, ni Hoi An en dos, ni el
  regreso desde Saigón. Son **cinco billetes y ya están los cinco**. Lo que queda no es comprar: es
  saber **cuál de ellos es intocable y cuál se puede sacrificar**, porque no valen lo mismo.
ledger:
  - label: Lo cerrado · el bloque de Camboya
    body: >-
      **VJ913** — mar **22 sep**, Hanói **16:20 → Siem Reap 18:05** (1 h 45, directo). **K6 828** — jue
      **24 sep**, Siem Reap **19:40 → Saigón 21:10** (Air Cambodia; reubicados tras cancelarse el 824). **VJ142** — sáb **26 sep**, Saigón
      **13:25 → Hanói 15:35**, enlazando con el vuelo largo a casa. Los tres, solo cabina. Ojo con el
      aeropuerto: **SAI** es el **nuevo** de Siem Reap (abierto en 2023), a unos 45 km del centro.
  - label: Lo cerrado · Hoi An
    body: >-
      **VJ501** — dom **20 sep**, Hanói **05:40 → Đà Nẵng 07:00**. **VJ1504** — mar **22 sep**, Đà Nẵng
      **12:40 → Hanói 14:00**. Tarifa **Deluxe**, **148,46 € los dos**. La ida os pone en el casco viejo
      **a las ocho de la mañana**, antes que los autobuses de excursión; la vuelta deja la última mañana
      de Hoi An entera.
  - label: Por qué la tarifa flexible vale lo que cuesta
    body: >-
      Porque los dos horarios son ajustados y **la flexibilidad es lo que los vuelve razonables**. De
      ida, si el bus cama llegara tarde, perder el VJ501 cuesta un cambio y dos horas — hay salidas cada
      media hora. De vuelta, el enlace con el VJ913 son **cuarenta y cinco minutos reales**, así que la
      regla es mirar el panel **en Đà Nẵng a las 11:15** y, ante cualquier retraso anunciado, **cambiar
      al vuelo anterior allí mismo**. Usada a tiempo, la flexibilidad resuelve; usada al aterrizar en
      Hanói, ya no sirve.
  - label: La jerarquía, por si hay que elegir
    body: >-
      **El VJ913 del martes es intocable** — detrás va Angkor, el hotel de Siem Reap, el guía del día 23
      y el K6 del jueves. Los dos de Đà Nẵng son **sacrificables**: si un temporal complica el centro,
      se dejan caer y el domingo y el lunes vuelven a ser Hanói. Tenerlo claro de antemano es lo que
      permite decidir rápido en un mostrador.
  - label: Por qué encajan
    body: >-
      El **K6 828 del jueves 24** ya no deja tarde en Saigón —se aterriza a las 21:10— pero **devuelve
      media jornada en Camboya**, y con ella el Tonlé Sap. El Trung Thu del viernes 25 en Lương Nhữ Học,
      que era el motivo de volar ese día, no se toca. Y el
      **VJ142** llega a las 15:35 en **T1**, con más de cinco horas antes del vuelo largo desde **T2**
      — margen suficiente para los 38 minutos de retraso medio que acumula esa ruta.
  - label: El veredicto
    body: >-
      **Comprad los de Đà Nẵng ya.** Los tres de Camboya eran el punto sin retorno y están cerrados; los
      dos que quedan son baratos hoy y caros en agosto, y sin ellos el domingo y el lunes vuelven a ser
      dos días de Hanói.
