kicker: Reservar · vuelos internos
title: Los cinco vuelos de dentro
verdict: imprescindible
verdictLabel: Tres comprados, dos por comprar
lede: >-
  Sin vuelos internos este itinerario no existe: ni Camboya en tres días, ni Hoi An en dos, ni el
  regreso desde Saigón. Son **cinco billetes**, tres ya cerrados y dos pendientes — y el orden en que
  se compran importa.
ledger:
  - label: Lo cerrado · el bloque de Camboya
    body: >-
      **VJ913** — mar **22 sep**, Hanói **16:20 → Siem Reap 18:05** (1 h 45, directo). **K6 824** — jue
      **24 sep**, Siem Reap **15:00 → Saigón 15:50** (Air Cambodia). **VJ142** — sáb **26 sep**, Saigón
      **13:25 → Hanói 15:35**, enlazando con el vuelo largo a casa. Los tres, solo cabina. Ojo con el
      aeropuerto: **SAI** es el **nuevo** de Siem Reap (abierto en 2023), a unos 45 km del centro.
  - label: Lo pendiente · Hoi An
    body: >-
      **Hanói → Đà Nẵng** el domingo **20** entre las 08:00 y las 09:00, y **Đà Nẵng → Hanói** el lunes
      **21** entre las 16:00 y las 17:00. Unos **120-200 € los dos, ida y vuelta**, en una de las rutas
      más frecuentadas del país. Es **lo único de la logística que falta por comprar** y lo único cuyo
      precio sube solo por esperar.
  - label: La regla que no se salta
    body: >-
      **La vuelta de Hoi An es el lunes 21, no el martes 22.** Es tentador volar el mismo día del
      VJ913 —sale a las 16:20 y llega al mismo aeropuerto—, pero son **billetes separados sin
      protección de conexión**: un retraso de dos horas de VietJet no os cuesta un vuelo interno, os
      cuesta **Angkor**. El colchón del viaje se gasta en un temporal en la montaña, no en ahorrarse
      una noche de hotel.
  - label: Por qué encajan
    body: >-
      El **K6 824 del jueves 24** aterriza en Saigón a las 15:50 y deja **la primera tarde entera** en
      el sur, con el Trung Thu del viernes 25 en la calle de los farolillos de Lương Nhữ Học. Y el
      **VJ142** llega a las 15:35 en **T1**, con más de cinco horas antes del vuelo largo desde **T2**
      — margen suficiente para los 38 minutos de retraso medio que acumula esa ruta.
  - label: El veredicto
    body: >-
      **Comprad los de Đà Nẵng ya.** Los tres de Camboya eran el punto sin retorno y están cerrados; los
      dos que quedan son baratos hoy y caros en agosto, y sin ellos el domingo y el lunes vuelven a ser
      dos días de Hanói.
