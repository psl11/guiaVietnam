navLabel: "Dormir en Hanói"
trip: vietnam
order: 3
kicker: Dónde dormir · Hanói
title: El martini del *Metropole*, sin la habitación
verdict: imprescindible
verdictLabel: La jugada lista · ya reservado
lede: >-
  Dormir a cinco minutos del **Metropole** y beberse allí el martini de Graham Greene (**~15 €**) — en
  vez de pagar **300-500 €** por dormir dentro. Es la regla que gobierna todos los hoteles de esta
  guía, y en Hanói es donde se ve más clara.
ledger:
  - label: Cuesta
    body: >-
      **~60-80 €/noche** el hotel del barrio francés, **dos noches** (12 y 13). El martini, **~15 €**
      una vez.
  - label: Qué compra
    body: >-
      La ubicación exacta: entre el barrio francés y el casco viejo, con Hoàn Kiếm a 600 m, la Ópera a
      500 y la **ca trù de Hàng Bạc** a un kilómetro. Los dos días de Hanói se hacen andando. Y el
      **Bamboo Bar del Metropole a cinco minutos**, que es donde de verdad se compra el relato.
  - label: La alternativa
    body: >-
      La habitación del **Metropole** (300-500 €) compra un colchón y el búnker antiaéreo «solo para
      huéspedes» — una sala de hormigón de 40 m². **El relato lo tienes desde la barra por 15 €.**
      Prescindible, y con diferencia la más cara de las prescindibles del viaje.
  - label: El veredicto
    body: >-
      **Cerrado: [De Syloia](#de-syloia)**, edificio de 1936 reformado, en el 17A de Trần Hưng Đạo.
      Esta ficha defendía el **Hòa Bình** —palacete de 1926, más carácter y más cansado— y se eligió
      el otro por una razón defendible: **son solo dos noches**, se aterriza a las 06:40 sin haber
      dormido, y en ese caldo dormir bien pesa más que la escalera de madera. Lo que no se ha
      movido es lo de arriba: **la copa se paga en el icono, la cama no**.
curiosidades:
  - >-
    Bajo el patio del **Metropole** apareció, sellado desde los años setenta, el **búnker antiaéreo**
    del hotel — donde se refugiaron Jane Fonda y Joan Baez durante los bombardeos de 1972. Se
    redescubrió en 2011 al excavar para un bar.
