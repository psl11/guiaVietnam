kicker: La tentación · el arroz dorado
title: El desvío a Hoàng Su Phì
verdict: prescindible
verdictLabel: Prescindible — por tiempo
lede: >-
  Ban Phung, la joya del arroz en terrazas, madura **exactamente en vuestras fechas**. Sobre el papel
  es vuestro sitio. Y aun así, no — y el motivo no es el dinero.
ledger:
  - label: Cuesta
    body: >-
      No dinero. **Dos días.** Son 2-3 h de carretera lenta al oeste de Hà Giang ciudad, mínimo una
      noche, y otras 2-3 h de vuelta.
  - label: El problema
    body: >-
      En 16 días no hay dos días libres, **y ya se gastó la carta que había**: comprimir el loop de
      cinco días a cuatro liberó justo dos jornadas — y se fueron a **Hoi An**, no aquí. Lo que queda
      como donante posible cobra todavía más caro: **Ninh Bình** (que no es redundante — es karst
      emergiendo de arrozales inundados, no el karst seco de Đồng Văn) o el propio **Hoi An**.

      Y hay un consuelo real: al girar el loop, la primera noche cae en **Du Già**, que es el único
      valle de la ruta con **arroz en terraza** — y a finales de septiembre, en plena siega. No es
      Hoàng Su Phì, pero ya no os vais del norte sin ver una sola terraza dorada.
  - label: El veredicto
    body: >-
      **No forzarlo.** No es tacañería, es aritmética: ninguna ficha de inversión arregla un
      calendario. La restricción de este viaje no es el dinero, son **16 días**. Disfrutad el oro por
      bolsas de Du Già, Nậm Đăm y Lũng Tám — y guardad Hoàng Su Phì para la próxima.
