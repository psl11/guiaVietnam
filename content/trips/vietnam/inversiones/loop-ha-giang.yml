kicker: Elegido · Hà Giang
title: El loop, easy rider — *no* jeep
verdict: imprescindible
verdictLabel: Easy rider, 4 días
lede: >-
  Con los precios reales de BiBi delante: **las dos motos con conductor salen por 11.840.000 ₫ (408 €)
  y el SUV arranca en 15.850.000 ₫ (546 €)**. El 4x4 es **prescindible, y además peor**. Donde sí va el
  dinero es en la habitación privada y en el formato del grupo.
ledger:
  - label: El jeep · prescindible
    body: >-
      **Unos 138 € más por pareja para no mojarse.** Y la propia tabla del operador lo dice: cómodo si
      llueve, **mismas vistas**. Mã Pí Lèng desde una ventanilla es una postal; en la moto, con el vacío
      a un palmo y el viento del cañón, es la experiencia — y ese paso es el motivo mismo de venir. El
      riesgo real de septiembre tampoco es la lluvia: es **un talud que corta la carretera**, y de eso
      un 4x4 no salva a nadie. El seguro es la política de cambio de fecha.
  - label: La habitación privada · merece la pena
    body: >-
      **1.950.000 ₫ las tres noches** (67 €, unos 22 € por noche los dos). Después de un día de moto y
      lluvia, con equipo fotográfico que secar y ropa que tender, es de los suplementos que se pagan
      solos. La autenticidad del homestay es la cena con la familia, no el colchón del altillo comunal.
      Y añadid los **550.000 ₫** de la habitación privada de la noche previa: bajáis del bus cama a las
      tres de la madrugada.
  - label: El matiz que casi nadie mira
    body: >-
      **«Easy rider» no significa «tour privado».** El easy rider es vuestro conductor —una plaza cada
      uno, sí— pero BiBi vende **grupos de hasta ocho personas**, así que podéis acabar rodando en
      convoy con otros seis y parando donde decida el grupo. Con un fotógrafo a bordo eso no es un
      matiz, es el viaje. **Preguntad explícitamente por una salida privada** y qué cuesta.
  - label: Innegociable
    body: >-
      Por escrito al reservar: la **barca del Nho Quế** (que no va incluida), las paradas de **Sủng Là y
      Sà Phìn**, la **noche 3 en Nậm Đăm** y no en Yên Minh, **política de cambio de fecha flexible** —
      el seguro antitifón real— y que la póliza **cubra al pasajero de moto**, que la mayoría lo excluye
      si el piloto no tiene licencia. La lista entera, en [la reserva](#loop-reserva).
