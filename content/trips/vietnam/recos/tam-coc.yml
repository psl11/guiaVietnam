note: "Una noche · lo que manda es el amanecer de Hang Múa, a las 06:30"
body: >-
  Aquí no hay palacetes coloniales, así que el criterio cambia: lo que se busca es **dormir entre los
  farallones y no en la ciudad**, y sobre todo **la ubicación**, porque esta única noche tiene una cita
  con hora.


  **Lo que manda es el día siguiente a las seis y media de la mañana.** Los quinientos escalones de
  [Hang Múa](#hang-mua) hay que subirlos con la primera luz, y a esa hora no hay taxis rondando: la
  diferencia entre salir de la cama y andar diez minutos, o negociar un coche a las seis menos cuarto,
  es la diferencia entre hacerlo y no hacerlo. Todo lo demás del bloque —el embarcadero de
  [Tràng An](#trang-an), [Hoa Lư](#ninh-binh-historia), [Vân Long](#van-long)— es un trayecto en coche
  desde cualquier sitio.


  **La opción de ubicación pura: Mua Caves Ecolodge.** Bungalós alrededor de una piscina **al pie
  mismo del cerro de Hang Múa**, con la pared de caliza encima. El amanecer del día 5 se hace saliendo
  por la puerta. Gama media, y la piscina se agradece después de la tarde de bici.


  **La opción con carácter: Tam Coc Garden.** Un jardín amurallado en la aldea de Hải Nham con casas
  tradicionales restauradas, piedra vista, muy poca habitación y silencio absoluto. Es lo más parecido
  a la filosofía del [Hòa Bình](#hoa-binh) que hay por aquí: **arquitectura local de verdad en vez de
  hotel**. Está a unos tres kilómetros de Hang Múa, así que habría que dejar el traslado hablado la
  víspera.


  **La opción del fotógrafo: Nguyen Shack.** Cabañas de bambú sobre el agua con el karst detrás,
  rústicas de verdad —mosquitos y tabiques finos incluidos— y por la mitad de precio. Visualmente es
  la más agradecida de las tres con diferencia; en comodidad, la última.


  **Y una cosa que hay que dejar cerrada la víspera, sea cual sea:** el **taxi hasta la estación de
  Đồng Giừng** para el bus de las 20:30 del día 15. Está en la ciudad de Ninh Bình, a siete u ocho
  kilómetros, y a las ocho de la tarde no se improvisa desde Tam Cốc — ver
  [los dos buses cama](#traslado-ha-giang).
