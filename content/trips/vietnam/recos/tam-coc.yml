body: >-
  **Reservado, la noche del lunes 14.** Y el aviso de nombre primero, que en este viaje ya van tres:
  **el sitio se llama ahora *Dragon Mountain Home in Ninh Binh — Center Of Heritage***; la reserva
  conserva el nombre viejo, *S' Homestay Hoa Lu*. Llevad la dirección apuntada: **Hang Múa, xã Ninh
  Nhất, thành phố Hoa Lư**.


  **Y está exactamente donde había que estar: al pie del cerro de [Hang Múa](#hang-mua).** Esta única
  noche tenía una sola cita con hora —**los quinientos escalones a las 06:30 de la mañana siguiente**—
  y a esa hora no hay taxis rondando por aquí. Durmiendo a los pies de la escalera, el amanecer del día
  5 se hace **saliendo por la puerta**: es la diferencia entre hacerlo y no hacerlo.


  Trae además **piscina exterior**, que después de la barca de Tràng An y una tarde de bici con treinta
  y tantos grados no es un adorno, y desayuno bien valorado. Sale por **55-75 €** la noche.


  **Lo que cuesta, y conviene saberlo antes de subirse a la bici:** [**Bích Động**](#bich-dong) queda a
  **unos cinco kilómetros**, así que el paseo del atardecer del día 4 pasa de ser un rodeo corto a ser
  una salida de diez kilómetros ida y vuelta. Hay dos maneras de resolverlo y las dos son buenas —
  están en [el día 4](#dia-4-tam-coc).


  **Y lo único que hay que dejar hablado con ellos:** el **taxi hasta la estación de Đồng Gừng** para
  el bus cama de las 20:30 del día 15. Está a **seis o siete kilómetros**, en la ciudad de Ninh Bình, y
  a las ocho de la tarde no se improvisa desde aquí. Pedidlo la víspera — ver
  [los buses cama](#traslado-ha-giang).
