note: "VJ913 (21 sep) + VN836 (24 sep) · ojo: cambian los dos"
body: >-
  **Los dos billetes cambian, y hay que rehacerlos.** El plan original (VJ913 el 22 + VJ914 el 24) se
  cayó por un motivo que conviene saber: **el VJ914 no vuela los jueves** —opera lunes, martes,
  miércoles, viernes y sábado—, así que VietJet canceló la vuelta y ofreció adelantarla al miércoles
  23, lo que se llevaba por delante un día entero de Angkor.


  **La combinación nueva:**


  - **Ida · VJ913, lunes 21 sep**, HAN 16:20 → SAI 18:05. Un día antes de lo previsto: es lo que
    convierte Angkor de día y medio en tres días. Vuela **a diario**. **Cómpralo en tarifa
    modificable** — entre el final del loop y este despegue no queda margen, y esa diferencia de
    precio es el único seguro que queda.
  - **Vuelta · VN836, jueves 24 sep**, SAI 18:05 → HAN ~19:50. **Vietnam Airlines**, que sí cubre la
    ruta todos los días. Más cara que VietJet, pero incluye maleta y salva el itinerario.


  **Y exigid a VietJet el reembolso íntegro de la vuelta**, no un bono: fue una cancelación suya, no
  un cambio vuestro. Confirmad el horario del VN836 para esa fecha **antes** de aceptar nada.
