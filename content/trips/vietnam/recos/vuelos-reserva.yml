note: "Los tres comprados · VJ913 (22) + K6 824 (24) + VJ142 (26)"
body: >-
  **Cerrado.** El final del viaje se sostiene sobre tres vuelos y los tres están comprados.


  - **VJ913 · martes 22 sep** — HAN **16:20 → Siem Reap 18:05** (VietJet, 1 h 45, directo).
  - **K6 824 · jueves 24 sep** — Siem Reap **18:30 → Saigón 19:50** (Air Cambodia, 1 h 25). Vuela lunes,
    martes, miércoles, jueves y sábado; el 24 es jueves, así que entra.
  - **VJ142 · sábado 26 sep** — Saigón **13:25 → Hanói 15:35** (VietJet, 2 h 10, diario).


  **Lo que hay que saber de cada uno, más allá de la hora:**


  **El K6 sale tarde, y eso es bueno y malo a la vez.** Bueno porque os deja **el jueves entero en
  Angkor** —hay que salir del hotel sobre las 15:45, no a mediodía—. Malo porque llegáis al hotel de
  Saigón hacia las **21:00**: esa noche no da para nada más que cenar. Todo lo de Saigón se concentra
  en el viernes y el sábado por la mañana.


  **El VJ142 es el que sostiene el regreso**, y va holgado: aterriza a las 15:35 en **T1** y el vuelo a
  casa sale a las **20:40 desde T2**. Como voláis solo con cabina, no hay maletas que recoger; la
  **lanzadera entre terminales es gratuita, cada quince minutos y tarda cuatro**. En T2 sobre las
  16:20, con **más de cuatro horas de margen**.


  Dos avisos sobre ese último tramo: son **billetes separados** del vuelo de casa, así que un retraso
  no lo cubre nadie — y el VJ142 acumula **retrasos frecuentes, de unos 38 minutos de media**. Con el
  margen que hay, incluso un retraso de dos horas os deja llegar; pero si en Saigón veis que se va de
  las manos, **cambiad al siguiente en el mostrador**: la ruta tiene salidas cada media hora.
