note: "VJ913 ✓ comprado · faltan SAI-SGN (24) y SGN-HAN (26)"
body: >-
  El final del viaje se sostiene sobre tres vuelos, y **solo uno está comprado**.


  **1 · Ida a Camboya — VJ913, martes 22 sep** `[✓ comprado]`. HAN **16:20 → SAI 18:05**, directo,
  hora y media. Esta fecha es fija y todo lo demás se ordena a partir de ella.


  **2 · Camboya → Saigón, jueves 24 sep** `[pendiente]`. **Cogedlo entre las 15:00 y las 16:30**: antes
  os come la mañana de Banteay Srei, y mucho más tarde llegáis de noche cerrada. Hay **cuatro diarios**
  entre **Vietnam Airlines** y **Air Cambodia**, hora y media de vuelo — pero **el primero no sale hasta
  las 10:00**, así que las opciones de tarde son pocas y conviene mirarlo pronto.


  **3 · Saigón → Hanói, sábado 26 sep** `[pendiente]`. **A las 13:00, no más tarde.** Aterrizáis sobre
  las 15:15 y el vuelo a casa sale a las 20:40: más de cuatro horas de margen. Es el tramo del que
  depende todo el regreso, así que **Vietnam Airlines antes que las low-cost**, y ojo con la trampa: en
  septiembre **Tân Sơn Nhất acumula retrasos por la tarde** —hay días de 45 minutos a dos horas en la
  ruta de Hanói— y los retrasos crecen según avanza la jornada.


  **Y lo que hay que tener claro de este último:** son **billetes separados** del vuelo de casa. Si se
  retrasa, la aerolínea larga no responde. La ruta tiene salidas **cada media hora**, así que saliendo a
  las 13:00 os quedan doce o quince vuelos por detrás; saliendo a las 17:00, tres. Ahí está toda la
  diferencia.


  *(El VJ914 de vuelta que se canceló ya no hace falta: **el VJ914 no vuela los jueves** —opera lunes,
  martes, miércoles, viernes y sábado—, y por eso VietJet tumbó la reserva original. Exigidles el
  **reembolso íntegro**, que fue cancelación suya y no cambio vuestro.)*
