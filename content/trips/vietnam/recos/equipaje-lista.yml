title: La lista de equipaje, cosa por cosa
area: Dos mochilas de cabina · 7 kg cada una · 16 días
note: "Ropa para 5-6 días y dos lavados · lo demás es lo que no se compra allí"
body: >-
  **La regla que lo ordena todo: ropa para cinco o seis días, no para dieciséis.** El resto lo hace la
  lavandería —1 a 1,5 € el kilo en Hanói, ~1 US$ en Siem Reap— y [ahí está el porqué](#equipaje).
  Todo lo de abajo cabe en 7 kg si se respeta esa cuenta; si no, no cabe nada.


  **Ropa**


  - **5-6 camisetas** técnicas o de lino. Nada de algodón grueso: con 80-90 % de humedad no seca.
  - **Un pantalón largo ligero** cada uno. No es por el frío: es el que sirve para **templos y
    mosquitos**, y en Angkor la planta alta de Angkor Wat exige **hombros y rodillas cubiertos**.
  - **Un pantalón corto o falda** y ropa de andar por el hotel.
  - **Un forro fino o midlayer + cortavientos**, solo para Hà Giang. Las noches a 20 °C **en moto** se
    sienten frías, y esto es lo único del equipaje que existe por cuatro días de dieciséis.
  - **Chubasquero fino.** El poncho de moto lo suele prestar [el tour](#el-loop) y en cualquier tienda
    cuesta 20.000 ₫; **paraguas no**.
  - **Un pañuelo o pareo grande** para ella: cubre hombros en templos, hace de manta en el bus nocturno
    y de toalla de playa en An Bàng. Es la prenda con más usos por gramo del equipaje.
  - **Bañador.** Hay piscina en Hoi An, en Siem Reap y en Tam Cốc.


  **Calzado y calcetines**


  - **Las sandalias impermeables** y **una zapatilla baja de trail, de malla y sin Gore-Tex**. El
    razonamiento entero —por qué impermeable no, y por qué goma pegajosa antes que taqueada— está
    [en la ficha de equipaje](#equipaje).
  - **Tres pares de calcetines de merino o sintéticos. Ni uno de algodón.** Cuatro días en moto con
    el pie húmedo son ampollas seguras, y esto pesa treinta gramos.


  **Los cuatro días de moto**


  - **Guantes finos.** No por la caída: por el sol en el dorso de la mano, que en cuatro días de
    estribera quema de verdad.
  - **Gafas de sol** que agarren, y **buff o braga de cuello** para el polvo de las pistas.
  - **Crema solar alta.** Llevadla de casa: allí casi toda lleva blanqueante.
  - **Una bolsa estanca o un par de zip grandes** para el móvil y la cámara. En el loop llueve de
    lado.


  **Los dos buses nocturnos**


  Son dos —Ninh Bình a Hà Giang el día 5, y la vuelta a Nội Bài el día 9— y de ellos depende llegar
  descansados a Hoi An y al loop:


  - **Antifaz y tapones.** No es lujo: es la diferencia entre dormir siete horas y no dormir.
  - **Un candado pequeño** para la mochila mientras dormís.
  - **El midlayer a mano**, que el aire acondicionado de las cabinas VIP va fuerte.
  - **Power bank** cargado — y por norma de aviación **siempre en cabina**, nunca facturado.


  **La cámara**


  - **Dos baterías de repuesto como mínimo.** La X100VI da unas trescientas fotos por carga y aquí hay
    amaneceres de 04:45 y días de doce horas. Se cargan por USB-C desde el propio power bank.
  - **Tarjetas de sobra** y **gel de sílice** en la bolsa, por el moho en las lentes — el porqué,
    [aquí](#equipaje).
  - **Un paño de microfibra**, que el objetivo se empaña cada vez que se sale del aire acondicionado.


  **El botiquín, que este viaje pesa más de lo normal**


  **Vais sin vacunar por decisión** —[ver el detalle](#seguro-vacunas)—, así que esto deja de ser una
  formalidad:


  - **Sobres de suero oral (SRO).** Si solo cabe una cosa, esta. Se rehidrata en horas lo que de otro
    modo arruina dos días.
  - **Gel hidroalcohólico**, y usarlo antes de comer con las manos, que aquí se come con las manos a
    menudo.
  - **Loperamida, paracetamol/ibuprofeno**, y **antiséptico + apósitos** — la rozadura de la moto es
    la herida más probable del viaje.
  - **Repelente con DEET o icaridina.** Septiembre es temporada de dengue y no hay vacuna que valga:
    la única defensa es no ser picado. Más en [la ficha de salud](#salud).
  - **Y el número de la central de asistencia 24 h y el de póliza, en papel.** No en un correo.


  **Papeles y lo que tiene que estar offline**


  - **Pasaportes con dos páginas en blanco** y **seis meses de validez** desde la entrada en Camboya.
  - **Los QR de las tres tarjetas de llegada**, descargados — no basta con el correo.
  - **Tarjetas de embarque, reservas y el mapa de la zona**, guardados para verlos sin datos. La guía
    funciona offline, pero lo demás no.
  - **Algo de efectivo en dólares** para Camboya y para el loop; el reparto está en
    [Dinero](#dinero).


  **Lo que NO hay que llevar**


  - **Paraguas** y **toalla grande**: los ponchos se compran por céntimos y los alojamientos dan
    toalla. Una **microfibra pequeña** sí, para el loop.
  - **Torre de adaptadores universales.** La clavija europea de dos patas redondas entra casi
    siempre; un adaptador pequeño basta.
  - **Purificador de agua.** El agua embotellada es universal y cuesta céntimos — y es justo lo que
    hay que beber sin la vacuna de la hepatitis A.
  - **Zapatos de vestir.** No hay una sola mesa de este viaje que los pida, ni la de la estrella.
  - **Medio botiquín de farmacia.** Lo que falte se compra allí, más barato y sin receta.
  - **Ropa para dieciséis días.** Es el error que revienta los 7 kg, y la lavandería está a la vuelta
    de la esquina.
