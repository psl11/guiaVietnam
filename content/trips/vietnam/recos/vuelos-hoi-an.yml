title: Los dos vuelos a Hoi An
area: Hanói ↔ Đà Nẵng · 20 y 21 sep
status: pendiente
note: "Lo único del viaje que falta por comprar · ~120-200 € los dos, ida y vuelta"
body: >-
  Es **lo último que queda por comprar** de toda la logística, y lo que convierte el domingo y el lunes
  en Hoi An en vez de en dos días más de Hanói. La ruta **Hanói-Đà Nẵng es de las más transitadas del
  país**: cuatro compañías —**Vietnam Airlines, VietJet, Bamboo y Vietravel**— y salidas casi cada media
  hora desde las seis de la mañana. Hora y veinte de vuelo.


  **La ida · domingo 20.** La ventana buena es **entre las 08:00 y las 09:00**. Antes os quita el phở de
  Hanói y os mete en la terminal de madrugada recién bajados del bus cama; después llegáis a Hoi An con
  el día ya perdido. Con uno a las ocho y media estáis comiendo cao lầu en el casco viejo.


  **La vuelta · lunes 21.** La ventana es **entre las 16:00 y las 17:00**. Eso deja la mañana entera en
  Hoi An —el amanecer en el casco viejo y los arrozales en bici— y os pone en el hotel de Hanói sobre
  las siete, con la última noche todavía por delante.


  **Y aquí va el aviso que de verdad importa: la vuelta es el lunes 21, no el martes 22.** Es tentador
  arañar una mañana más de Hoi An y volar el mismo día del vuelo a Camboya, porque el VJ913 no sale
  hasta las 16:20 y el avión de Đà Nẵng aterriza en el mismo aeropuerto. **No lo hagáis.** Son dos
  billetes separados y sin protección de conexión: si VietJet se retrasa dos horas —que es cosa de todas
  las semanas— no perdéis un vuelo interno, **perdéis Angkor**. El colchón de esta guía se gasta en un
  temporal en la montaña, no en ahorrarse una noche de hotel.


  **Precio y equipaje.** Entre **700.000 y 1.500.000 ₫ por trayecto y persona** (25-52 €) según
  antelación y compañía: **unos 120-200 € los dos, ida y vuelta**. Y el detalle que dispara la factura de
  las low cost: **VietJet incluye 7 kg de cabina y cobra cualquier cosa por encima**; Vietnam Airlines
  lleva 12 kg. Vosotros voláis solo con equipaje de mano todo el viaje, así que **pesad las mochilas
  antes de decidir compañía** — si vais justos, la diferencia de precio se la come el suplemento.


  **Comprar cuanto antes.** Es la única reserva del viaje cuyo precio sube solo por esperar, y septiembre
  es temporada baja en el centro precisamente porque llueve — lo que juega a favor del bolsillo.


  **Y de Đà Nẵng a Hoi An**, en los dos sentidos: **30 km, unos 45 minutos** por la carretera de la
  costa. Taxi o Grab, alrededor de **400.000 ₫**. Casi todos los hoteles de Hoi An lo organizan por un
  precio parecido, y con un vuelo que llega a media mañana merece la pena tenerlo cerrado.
