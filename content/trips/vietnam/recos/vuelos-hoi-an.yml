title: Los dos vuelos a Hoi An
area: Hanói ⇄ Đà Nẵng · 20 y 22 sep
status: reservado
note: "VJ501 (20) + VJ1504 (22) · 148,46 € los dos · tarifa Deluxe flexible"
body: >-
  **Comprados, y con eso se cierra la logística entera del viaje.** *Ida:* **VJ501, domingo 20, Hanói
  05:40 → Đà Nẵng 07:00**. *Vuelta:* **VJ1504, martes 22, Đà Nẵng 12:40 → Hanói 14:00**. Tarifa
  **Deluxe**, **148,46 € los dos** ida y vuelta — buen precio para una de las rutas más transitadas del
  país.


  **Y lo importante de la tarifa: son flexibles.** Se pueden cambiar o cancelar, y eso cambia por
  completo el análisis de riesgo de los dos vuelos. Sin esa flexibilidad, los horarios de estos dos
  billetes serían apretados; con ella, son manejables. Conviene saber exactamente cómo se usa en cada
  caso, porque **no es la misma jugada de ida que de vuelta**.


  **La ida · el riesgo es de sobra asumible.** El bus cama de BiBi deja en Nội Bài **entre las tres y
  las cuatro** —lo dicen ellos por escrito— y el vuelo sale a las 05:40: aun con la llegada más
  tardía, queda **una hora hasta el cierre de facturación** y hora y media hasta la puerta. Y no
  dependéis de ningún traslado, porque ya estáis dentro del aeropuerto.


  Dos cosas lo blindan del todo. La primera: **facturad por internet la noche del sábado**, con el wifi
  del hotel de Hà Giang, antes de subir al autobús — con las tarjetas de embarque en el móvil el
  mostrador deja de contar y solo importa la puerta, a las **05:25**. La segunda, la de fondo: si el
  autobús llegara tardísimo, **perder este vuelo cuesta un cambio de tarifa y un par de horas**, no el
  viaje: hay salidas a Đà Nẵng casi cada media hora toda la mañana. **Ese es el motivo por el que este
  riesgo sí se puede correr y el del martes no.**


  **La vuelta · aquí la flexibilidad hay que usarla a tiempo.** El VJ913 a Camboya sale a las **16:20**
  de la terminal internacional y el VJ1504 llega a la nacional a las **14:00**. Descontados el
  desembarque y la lanzadera entre terminales, estáis en el mostrador de T2 sobre las **14:45**, y
  VietJet cierra la facturación internacional a las **15:30**: **cuarenta y cinco minutos reales**. Son
  billetes separados, así que si se pierde el enlace no responde nadie — y lo que se pierde no es un
  vuelo interno, **es Angkor**.


  **La regla, y se aplica en Đà Nẵng y no en Hanói:** mirad el panel de salidas **al llegar al
  aeropuerto, sobre las 11:15**. Si el VJ1504 anuncia **cualquier retraso**, id al mostrador y
  **cambiadlo al vuelo anterior en ese mismo momento** — con la tarifa flexible es gratis o casi, y hay
  salidas cada media hora. Lo que no se puede hacer es embarcar con retraso y confiar en recuperarlo en
  el aire, porque entonces la flexibilidad ya no sirve de nada.


  **Y el detalle que dispara la factura de las low cost:** VietJet incluye **7 kg de cabina** y cobra
  cualquier cosa por encima. Vosotros ya voláis con el límite de 7 kg de Etihad, así que no hay
  problema — pero pesad las mochilas antes de salir de Hà Giang, que después de cuatro días de moto se
  acumulan cosas.


  **De Đà Nẵng a Hoi An**, en los dos sentidos: **30 km y unos 45 minutos** por la carretera de la
  costa, alrededor de **400.000 ₫** en taxi o Grab. Merece la pena tenerlo cerrado con el hotel para
  las dos puntas, sobre todo la del domingo a las siete de la mañana.
