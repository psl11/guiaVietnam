title: Los dos vuelos a Hoi An
area: Hanói ⇄ Đà Nẵng · 20 y 22 sep
status: pendiente
note: "Lo único del viaje que falta por comprar · ~67 €/persona ida y vuelta"
body: >-
  Es **lo último que queda de toda la logística**, y lo que convierte tres días muertos en Hanói en dos
  noches en Hoi An. La ruta **Hanói-Đà Nẵng es de las más transitadas del país**: cuatro compañías
  —Vietnam Airlines, VietJet, Bamboo y Vietravel— con salidas casi cada media hora desde las seis de la
  mañana, y hora y veinte de vuelo. **Unos 67 € por persona ida y vuelta**, que es un precio bueno.


  **La ida · domingo 20, a las 07:30.** Está bien elegida y encaja mejor de lo que parece: el bus cama
  de Hà Giang llega sobre las cinco, así que hay **dos horas y media de margen**, y aterrizáis en Đà
  Nẵng a las 08:50 — en Hoi An a las diez, con el día **entero** por delante.


  **Pero eso obliga a un cambio: coged el bus de BiBi hasta Nội Bài, no hasta el casco viejo.** Cuesta
  lo mismo. Con la variante del casco viejo tendríais que salir de Hanói a las 05:15 en Grab para llegar
  a facturación, o sea nada de desayuno y todo el peso en que no haya tráfico ni retraso del autobús.
  Yendo directos al aeropuerto, un retraso de una hora del bus **no rompe nada**.


  **La vuelta · martes 22, y aquí está la única decisión delicada del viaje.**


  El vuelo a Camboya, el **VJ913, sale a las 16:20** de la terminal internacional de Nội Bài, y el de Đà
  Nẵng llega a la **nacional**. Son **billetes separados sin protección de conexión**: si el interno se
  retrasa, no perdéis un vuelo doméstico, **perdéis Angkor**, y no responde nadie.


  **Con el de las 12:40 el margen real es de tres cuartos de hora.** Aterrizáis a las 14:00, salir del
  avión son quince minutos, la lanzadera entre terminales otros treinta entre esperar y cruzar — estáis
  en el mostrador a las 14:45, y **VietJet cierra la facturación internacional a las 15:30**. Sale, pero
  sin nada detrás.


  **La recomendación es un vuelo entre las 09:00 y las 10:30**, y no cuesta casi nada: saliendo de Hoi
  An a las ocho, el amanecer en el casco viejo —que es lo mejor que da esa ciudad— queda intacto. Lo
  único que se pierde son **las tres horas de media mañana en Hoi An, que son las peores del día**: es
  justo cuando descargan los autobuses de Đà Nẵng y el casco viejo se llena. A cambio aterrizáis sobre
  las once y cuarto con **cinco horas de colchón**, y encima da tiempo a un último mordisco de Hanói
  —el B-52 del lago y el memorial de McCain— que cae de camino al aeropuerto.


  Dicho de otro modo: **el de las 12:40 cambia el peor rato de Hoi An por todo el margen de seguridad
  del viaje.** Aunque el de la mañana costara veinte o treinta euros más, es el seguro más barato que
  vais a contratar.


  **Y el detalle que dispara la factura de las low cost:** VietJet incluye **7 kg de cabina** y cobra
  cualquier cosa por encima; Vietnam Airlines lleva 12. Vosotros ya voláis con el límite de 7 kg de
  Etihad, así que no hay problema — pero **pesad las mochilas antes de comprar**, porque un suplemento
  de equipaje se come la diferencia de precio entre compañías.


  **De Đà Nẵng a Hoi An**, en los dos sentidos: **30 km y unos 45 minutos** por la carretera de la
  costa, alrededor de **400.000 ₫** en taxi o Grab. Casi todos los hoteles de Hoi An lo organizan por
  un precio parecido y merece la pena tenerlo cerrado, sobre todo el del martes a las ocho de la mañana.
