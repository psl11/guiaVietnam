body: >-
  Agosto-octubre son **los** meses de tifones del golfo de Tonkín. En septiembre la trayectoria empieza
  a desplazarse hacia el centro del país, pero **el norte sigue expuesto**: Yagi tocó tierra cerca de
  Hanói un **7 de septiembre**. Y si uno entra, lo que pasa es concreto: **dos o tres días de vuelos
  cancelados en Hanói, carreteras de montaña cortadas, y riesgo de derrumbes en Hà Giang los dos o tres
  días siguientes** por saturación del terreno — el peligro no es la lluvia, es el talud.


  **Y aquí conviene saber exactamente dónde está el colchón, porque cambió de sitio.** Con el loop en
  cuatro días, entre que se baja de la montaña (sábado 19) y el vuelo a Camboya (martes 22) hay **dos
  días** — pero **no están libres: son Hoi An**, dos noches enteras. O sea que un retraso en la montaña
  ya no os hace perder el vuelo; os hace perder Hoi An. Es una posición mucho mejor que la anterior, y conviene
  tenerla clara para decidir rápido si llega el caso: **el orden de sacrificio es Hoi An primero, el
  vuelo a Camboya nunca**.


  **Y hay un segundo frente, nuevo.** Con Hoi An dentro, ahora también os afecta **el tiempo del
  centro**: un tifón que entre por Đà Nẵng cancela vuelos ahí igual que en el norte. La ventaja es que
  esos dos billetes son baratos y sacrificables — si el parte del centro viene feo cuatro días antes,
  se dejan caer y el domingo y el lunes vuelven a ser Hanói. **No los compréis en tarifa no
  reembolsable si podéis evitarlo.**


  El airbag del norte sigue siendo la **política de cambio de fecha del [loop](#loop-ha-giang)** y la
  **tarifa modificable del VJ913** — por eso esa tarifa no es opcional. Lo que faltaba es **cómo saber
  que hay que usarlo**, porque esa decisión se toma **una semana antes de volar**, no sobre el
  terreno.


  **Cómo monitorizar, desde ~7 días antes:** **nchmf.gov.vn** (la agencia meteorológica oficial
  vietnamita, con versión en inglés), **Windy.com** con la capa de ciclones activada, zoomearth.com, y
  los avisos del **JTWC**.


  **La regla, sin adornos: con un tifón anunciado, se adelanta o se retrasa Hà Giang y os quedáis en
  ciudad.** Con una carretera de montaña mojada no se negocia.
