note: "El ca trù solo canta miércoles, viernes y domingo — y caben cuarenta personas"
body: >-
  **Son las dos únicas reservas que quedan en Hanói, y la primera no admite plan B.**


  **El ca trù · domingo 13 a las 20:00.** El [**Ca Trù Hanói Club**](#ca-tru-hang-bac) canta **solo
  miércoles, viernes y domingo**, y de vuestras dos noches en la ciudad **la única que cae en día de
  función es el domingo**. Si se llena, no hay otra fecha: se acabó el ca trù del viaje.


  Y se llena con facilidad, porque **el aforo es de veinte a cuarenta personas**: se canta dentro del
  **Đình Kim Ngân** (42-44 Hàng Bạc), la casa comunal restaurada del gremio de plateros, con el público
  casi al alcance de la mano. Entrada, unos **200.000 ₫** (~6,5 €). **Confirmad el día al reservar**,
  que la programación rota de vez en cuando.


  **Las marionetas de agua · sábado 12.** El [**teatro Thăng Long**](#teatro-thang-long) (57 Đinh Tiên
  Hoàng) es el más conocido de la ciudad y **se agota con días de antelación**. Cincuenta minutos,
  orquesta en vivo con *đàn bầu*, y unos **100.000-200.000 ₫**.


  Esta segunda solo hay que reservarla **si os decidís por ella**: el día 2 ofrece dos finales y el otro
  es la [**Train Street**](#train-street), que no se reserva —se entra consumiendo en un café
  autorizado— pero cuyos horarios cambian y hay que verificar sobre el terreno. **Si queréis la
  seguridad de tener plan cerrado la primera noche, son las marionetas**; si preferís la foto, es el
  tren.


  **Y una tercera que no cabe, dicho para que sea una decisión y no un descuido.**
  [**Gia**](#gia) —la mesa de alta cocina vietnamita de Hanói— figura como reserva imprescindible en la
  guía, pero **las dos noches están ocupadas** por lo de arriba. Solo entra sacrificando una de las dos,
  y en ese caso hay que reservar con la misma antelación.
