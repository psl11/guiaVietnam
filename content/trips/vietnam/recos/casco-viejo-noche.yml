note: "Noche del 25 sep · La Siesta Classic o Maison d'Orient"
body: >-
  Es la única noche que no se duerme en el barrio francés, y el motivo es de calendario: **el 25 es
  Trung Thu**, y **Hàng Mã** —la calle de los farolillos— está pegada al casco viejo, a media hora
  andando del barrio francés. De Siem Reap volvéis la víspera (el VJ914 aterriza **el 24** a las
  20:50), así que el 25 lo tenéis entero: mañana sin agenda, atardecer en el Lago del Oeste y la
  calle encendida por la noche.


  Y la mañana del 26 es casco viejo puro: Hàng Mã ya vacía, egg coffee en el balcón del **Café
  Đinh**. Dormir aquí esa última noche no cuesta más, y ya son estancias separadas de todas formas.
