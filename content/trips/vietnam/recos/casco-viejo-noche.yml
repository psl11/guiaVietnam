title: El casco viejo, la última noche
area: Hanói · Old Quarter
status: pendiente
note: "Noche del 25 sep · La Siesta Classic o Maison d'Orient"
body: >-
  Es la única noche que no se duerme en el barrio francés, y el motivo es de calendario: **el 25 es
  Trung Thu**, y **Hàng Mã** —la calle de los farolillos— está pegada al casco viejo, a media hora
  andando del barrio francés. De Siem Reap volvéis la víspera (el VJ914 aterriza **el 24** a las
  20:50), así que el 25 lo tenéis entero: mañana sin agenda, atardecer en el Lago del Oeste y la
  calle encendida por la noche.


  Y la mañana del 26 es casco viejo puro: Hàng Mã ya vacía, egg coffee en el balcón del **Café
  Đinh**. Dormir aquí esa última noche no cuesta más, y ya son estancias separadas de todas formas.


  **La alternativa con más carácter: el callejón de la catedral.** Si La Siesta os parece demasiado
  hotel-de-cadena, a cinco minutos está **P Ấu Triệu / P Nhà Thờ**, la callejuela peatonal que rodea
  la **catedral de San José** — el rincón donde se concentran los hoteles pequeños de Hanói, con
  tráfico cero y el casco viejo y el lago a un paseo. Dos con historia propia: el **Church Boutique
  Hotel Nhà Thờ** (9 P Nhà Thờ), que era **la casa parroquial de la catedral** antes de convertirse en
  hotel, y el **Cinnamon Cathedral** (38 P Ấu Triệu), que conserva la herrería y las contraventanas
  del edificio original y da a la fachada neogótica. Ambos rondan los **50-70 US$** y tienen diez o
  quince habitaciones, no doscientas. Es el mismo criterio del Hòa Bình aplicado al casco viejo:
  dormir dentro de un edificio con relato, por precio de gama media.
