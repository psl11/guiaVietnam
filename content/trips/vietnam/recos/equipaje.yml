title: Por qué el solo-cabina funciona (y el moho en las lentes)
area: Antes de volar
note: "Lavandería 1-1,5 €/kg · gel de sílice para la cámara"
body: >-
  **Lo que hace viable las dos mochilas de cabina para dieciséis días es la lavandería**, y conviene
  saberlo antes de hacer el equipaje: en el casco viejo de Hanói son **30.000–50.000 ₫/kg (1-1,5 €)**
  con entrega en 4–24 h, y en Siem Reap **~1 USD/kg**. Con eso, **ropa para cinco o seis días y lavar
  dos veces** — no es una temeridad, es el plan.


  **Tres climas en una mochila.** Base de calor húmedo: camisetas técnicas o de lino, **pantalón
  ligero largo** (sirve para templos y para los mosquitos), sandalias y zapatillas. Para **Hà Giang**,
  añadid **un forro polar fino o midlayer** —las noches a 20 °C, en moto, se sienten frías— y un
  cortavientos. Lluvia: chubasquero fino sí, paraguas no (los ponchos cuestan 20.000 ₫ (~0,70 €) en cualquier
  tienda, y los tours del loop suelen prestar el de moto).


  **El calzado, que es la decisión con más trampa.** Con sandalias impermeables ya en la mochila, la
  segunda pieza **no debe ser impermeable también**: tiene que ser lo contrario. En septiembre os vais
  a mojar los pies sí o sí —chaparrón de tarde, charco por encima del tobillo, una barca—, y con
  **80-90 % de humedad una membrana no seca por la noche**: el agua entra por arriba y se queda
  dentro. Lo impermeable ya lo cubren las sandalias; lo otro tiene que **drenar y secarse**.


  Así que: **una zapatilla baja de trail, de malla, sin Gore-Tex, con suela de goma pegajosa**
  (Vibram Megagrip, Contagrip o equivalente). Y pegajosa **antes que taqueada**, porque lo que hay
  aquí no es barro de montaña: son los **quinientos escalones de piedra pulida de Hang Múa**, la
  arenisca gastada de Angkor a las seis de la mañana y las **aceras embaldosadas de Hanói mojadas**,
  que es donde de verdad se resbala. Baja, no de caña: en este viaje no se hace trekking, y una media
  caña solo añade calor. Y **oscura**, porque después del loop estará hecha un asco y con ella se
  cena.


  **Lo que solo puede hacer la zapatilla: los cuatro días de moto.** Sandalias en el loop no —el tubo
  de escape a la altura del pie es la quemadura clásica del viaje—, y la malla también se derrite si
  la roza, así que pie quieto en la estribera. Lo demás se reparte solo: sandalias para las ciudades,
  la barca de Tam Cốc, Trà Quế, An Bàng, Kampong Phluk y las pagodas donde hay que descalzarse;
  zapatilla para el loop, Hang Múa, los dos días de Angkor y los aviones, que es donde se lleva puesto
  lo que abulta.


  **Y dos cosas que importan más que la marca.** Los **calcetines: tres pares de merino o sintéticos,
  y ni uno de algodón** — el algodón mojado no seca con esta humedad y cuatro días en moto con el pie
  húmedo son ampollas seguras. Y **secarlas a conciencia**: al llegar al homestay, plantilla fuera y
  papel de periódico dentro. Ahí nada se seca solo.


  **Y el aviso para la cámara, que es de los que se agradecen tarde:** con **80-90 % de humedad** y
  entradas y salidas constantes del aire acondicionado, el objetivo se empaña y **el moho en las lentes
  es un riesgo real**, no una leyenda. Llevad **varias bolsas de gel de sílice** (regenerables) en la
  bolsa de la cámara, **aclimatad el equipo unos 10 minutos al salir del AC antes de abrirla**, y
  meted una bolsa estanca o un zip grande para los chaparrones de media tarde de Siem Reap.


  **Enchufes:** Vietnam a 220 V y Camboya a 230 V, con tomas donde la **clavija europea de dos patas
  redondas (tipo C) entra casi siempre** — un adaptador pequeño por si acaso, nada de torres
  universales.
