title: A qué hora llegáis a cada hotel
area: Seis alojamientos · tres llegan a deshora y hay que avisar
status: pendiente
urgencia: ya
note: "Los seis están reservados; lo que falta es decirles a qué hora aparecéis"
body: >-
  **Las camas están pagadas, pero ninguna sabe cuándo llegáis** — y tres de las seis caen fuera del
  horario normal de un mostrador. El check-in estándar es a las **14:00** en todas, así que la mitad de
  esta lista son llegadas a horas en las que no hay habitación, y la otra mitad a horas en las que
  quizá no haya nadie. Las horas salen de los tramos ya cerrados: son estimaciones buenas, no promesas.


  **1 · [De Syloia](#de-syloia) · sábado 12, hacia las 08:00.** Aterrizáis a las 06:40 y el Grab entra
  en el casco viejo sobre las 07:55. Son **seis horas antes del check-in**: escribid para que os
  guarden las dos mochilas desde primera hora, y preguntad si hay habitación temprana. La agenda ya
  cuenta con que no la haya —la siesta está puesta después de comer—, pero si la hay, cambia el día.


  **2 · [Dragon Mountain Home](#tam-coc) · lunes 14, hacia las 12:00.** La furgoneta sale de Hanói a
  media mañana y tarda dos horas y media. Es la única llegada normal del viaje. Lo que sí hay que
  hacer es **pedir la furgoneta la víspera** — va en [la lista de la víspera](#vispera-checklist).


  **3 · [El Numa Hotel](#ha-giang-ciudad) · miércoles 16, hacia las 04:00.** El bus cama sale de Đồng
  Gừng a las 20:30 y os deja en Hà Giang **de madrugada**, con el loop arrancando a las 09:30. O sea
  **cinco horas muertas a una hora imposible**. Va dentro del paquete de BiBi, así que la pregunta es
  para ellos y es concreta: **¿hay alguien en recepción a las cuatro de la mañana, y podemos usar la
  cama y la ducha antes de salir?** Sin esa respuesta, esas cinco horas se pasan en un vestíbulo.


  **4 · [Threeway Riverside Villa](#hoi-an-hotel) · domingo 20, hacia las 08:00.** Y **esta es en la
  que el check-in temprano vale de verdad**, porque no llegáis de una noche de hotel: llegáis de
  **siete horas de autobús y un vuelo al alba**. Pedidlo por escrito y con el motivo puesto —un
  *early check-in* se concede mucho más cuando se explica—. Si no hay habitación, al menos ducha y
  mochilas guardadas; el plan de ese día empieza igualmente a las ocho.


  **5 · [Prana Hotel](#siem-reap-hotel) · martes 22, hacia las 19:15.** El VJ913 aterriza a las 18:05
  y el hotel **incluye traslado del aeropuerto**: confirmadlo con el número de vuelo, que es lo que
  hace que el coche esté. Y avisad de que **salís enseguida**: el [circo Phare](#phare-reserva) es a
  las 20:00, así que ahí solo hay tiempo de soltar las mochilas.


  **6 · [Woody House](#saigon-hotel) · jueves 24, hacia las 22:15.** **La que de verdad puede
  estropearse.** Es un **apartamento**, no un hotel con recepción de veinticuatro horas, y llegáis
  pasadas las diez de la noche porque el K6 828 no aterriza hasta las 21:10. Hay que dejar cerrado
  **cómo se recogen las llaves a esa hora** —código, caja fuerte o persona— y tener el teléfono de
  contacto guardado **offline**, no en un correo. Si algo de esta lista hay que escribir hoy, es esto.
