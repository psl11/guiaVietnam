note: "Contratado · sin vacunas, por decisión: la higiene pasa a ser la única defensa"
body: >-
  **Contratado.** Lo que sigue ya no es para elegir póliza: es para usarla bien, y para no dejarse la
  parte que no se compra por internet.


  **Vais sin vacunar, y es una decisión tomada, no un olvido.** No daba tiempo: la cita del Centro de
  Vacunación Internacional se pide con semanas. Dicho eso, conviene saber qué cambia — porque cambia
  poco, pero cambia algo concreto.


  **Las dos que os faltan se cogen comiendo y bebiendo**: la **hepatitis A** y la **fiebre tifoidea**
  son de agua y alimentos, no del aire ni de los mosquitos. Sin ellas, la higiene deja de ser
  recomendación y pasa a ser **la única defensa**: agua embotellada precintada —también para lavarse
  los dientes—, nada de crudos lavados con agua del grifo, fruta que se pele, y **puestos de calle con
  mucha rotación**, que es donde la comida sale recién hecha y humeando. Un puesto lleno es más seguro
  que un bufé templado de hotel.


  **Y una que quizá ya tengáis sin saberlo: el tétanos.** La difteria-tétanos dura **diez años** y
  suele venir de la última revacunación de adulto. Ahí no hace falta cita: **mirad la cartilla**, y si
  el último recuerdo es posterior a 2016 estáis cubiertos. Importa porque el loop son **cuatro días en
  moto** por pistas de montaña, y una caída con rozadura es exactamente el escenario del tétanos.


  **La hepatitis A tarda de dos a seis semanas en dar la cara**, o sea que si aparece lo hará **ya en
  casa, en octubre**. Si alguno tiene cansancio raro, fiebre o color amarillento, **decid en la
  consulta que venís de Vietnam** — sin ese dato, nadie la busca. Y si estando allí sube una fiebre
  que crece día a día en vez de bajar, eso no es diarrea del viajero: es médico, no loperamida.


  El detalle de dengue, rabia y el resto está en [la ficha de salud](#salud).


  **La letra pequeña que arruina siniestros: llamar ANTES de pagar.** Estas pólizas excluyen *«las
  prestaciones que no hayan sido solicitadas a la central de asistencia 24 horas»*. Traducido: si
  acabáis en un hospital y lo pagáis por vuestra cuenta sin llamar primero, **pueden no reembolsaros
  nada**. Antes que el taxi al hospital, el teléfono de la central — **apuntado en papel y offline**,
  no en un correo que necesite datos para abrirse. Apuntad también el **número de póliza**, y guardad
  facturas e informes médicos originales.


  **Y una comprobación que sigue viva: que la póliza cubra al pasajero de moto.** Muchas excluyen los
  accidentes de motocicleta incluso yendo detrás, y algunas solo cubren si **el conductor tiene
  licencia** — que es justo la pregunta 6 del mensaje a los operadores del loop. Si el condicionado no
  lo dice claro, preguntadlo por escrito y guardad la respuesta.


  ---


  *Lo de abajo es el porqué de las fechas y las cifras, por si hay que discutir una cláusula.*


  **Las fechas: del 11 al 27 de septiembre. Diecisiete días, no dieciséis.**


  El error natural es contratar «del 11 al 26», que son las fechas del itinerario. Pero **el 26 no
  llegáis a casa: el 26 despegáis**. El vuelo largo sale de Hanói a las **20:40** y, con la escala de
  Abu Dabi, aterriza en Barcelona **la mañana del 27** — entre las siete y las diez, según cómo caiga
  el enlace.


  O sea que **toda la vuelta ocurre el día 27**: las quince o dieciséis horas de avión, la escala, la
  recogida de equipaje y el trayecto a casa. Una póliza que termine el 26 os deja **sin cobertura justo
  en el tramo donde se concentra el riesgo** — que es el único del viaje con **billetes separados**
  (VJ142 más el vuelo largo), cambio de terminal en Nội Bài y una escala de por medio. Si ahí hay una
  urgencia médica, un enlace perdido o una maleta que no aparece, pasa el 27.


  **Y el otro extremo también**: la cobertura empieza **el 11**, el día que salís de Barcelona, no el
  12, que es cuando aterrizáis en Hanói. Un día más de póliza cuesta unos pocos euros; el hueco cuesta
  la póliza entera.


  **Y aquí va el número que lo pone todo en su sitio.** Una agencia española que vende Vietnam +
  Camboya incluye «seguro de viaje básico» con **15.000 € de asistencia médica**, y cobra **110 € por
  subirlo a 1.000.000 €**. Quince mil euros suena a mucho hasta que se cuenta lo que cuesta salir de
  donde vais a estar: una **evacuación desde el altiplano de Hà Giang a Hanói** son **300 km y 6-7
  horas de carretera de montaña**, y en helicóptero o ambulancia medicalizada se va a **10.000-50.000
  dólares** — sin haber entrado todavía en un quirófano. El seguro «incluido» de un paquete no cubre
  cuatro días de moto en la frontera china.
