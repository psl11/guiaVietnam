note: "Del 11 al 27 sep (17 días) · evacuación + ≥100.000 € · cubrir al pasajero de moto"
body: >-
  **En agosto**, y esta es la reserva que más fácil se hace mal, porque casi nadie mira las cifras.


  **Antes que las cifras, las fechas: del 11 al 27 de septiembre. Diecisiete días, no dieciséis.**


  El error natural es contratar «del 11 al 26», que son las fechas del itinerario. Pero **el 26 no
  llegáis a casa: el 26 despegáis**. El vuelo largo sale de Hanói a las **20:40** y, con la escala de
  Abu Dabi, aterriza en Barcelona **la mañana del 27** — entre las siete y las diez, según cómo caiga
  el enlace.


  O sea que **toda la vuelta ocurre el día 27**: las quince o dieciséis horas de avión, la escala, la
  recogida de equipaje y el trayecto a casa. Una póliza que termine el 26 os deja **sin cobertura justo
  en el tramo donde se concentra el riesgo** — que es el único del viaje con **billetes separados**
  (VJ142 más el vuelo largo), cambio de terminal en Nội Bài y una escala de por medio. Si ahí hay una
  urgencia médica, un enlace perdido o una maleta que no aparece, pasa el 27.


  **Y el otro extremo también**: la cobertura empieza **el 11**, el día que salís de Barcelona, no el
  12, que es cuando aterrizáis en Hanói. Un día más de póliza cuesta unos pocos euros; el hueco cuesta
  la póliza entera.


  **Lo que hay que exigir, en este orden:**


  - **Cobertura médica de 100.000 € para arriba** y **evacuación sanitaria incluida y explícita**.
    (IATI, Heymondo.)
  - **Que la póliza cubra al pasajero de moto.** Muchas excluyen los accidentes de motocicleta
    incluso yendo detrás, y algunas solo cubren si **el conductor tiene licencia** — que es la
    pregunta 6 del mensaje a los operadores del loop. Hay que confirmarlo **antes** de contratar nada.


  **Y aquí va el número que lo pone todo en su sitio.** Una agencia española que vende Vietnam +
  Camboya incluye «seguro de viaje básico» con **15.000 € de asistencia médica**, y cobra **110 € por
  subirlo a 1.000.000 €**. Quince mil euros suena a mucho hasta que se cuenta lo que cuesta salir de
  donde vais a estar: una **evacuación desde el altiplano de Hà Giang a Hanói** son **300 km y 6-7
  horas de carretera de montaña**, y en helicóptero o ambulancia medicalizada se va a **10.000-50.000
  dólares** — sin haber entrado todavía en un quirófano. El seguro «incluido» de un paquete no cubre
  cuatro días de moto en la frontera china.


  **Y la letra pequeña que arruina siniestros: llamar ANTES de pagar.** Todas estas pólizas excluyen
  *«las prestaciones que no hayan sido solicitadas a la central de asistencia 24 horas»*. Traducido:
  si acabáis en un hospital y lo pagáis por vuestra cuenta sin llamar primero, **pueden no
  reembolsaros nada**. Así que lo primero, antes que el taxi al hospital, es el teléfono de la
  central — y hay que llevarlo **apuntado en papel y offline**, no en un correo que necesite datos
  para abrirse. Apuntad también el **número de póliza** y guardad las facturas y los informes médicos
  originales.


  **Vacunas:** **hepatitis A + tétanos-difteria** al día, y **fiebre tifoidea** recomendable en este
  viaje (mucha comida fuera y días en zona rural). Centro de Vacunación Internacional — en agosto
  todavía llegan a tiempo. El detalle de dengue, rabia y el resto está en [la ficha de
  salud](#salud).
