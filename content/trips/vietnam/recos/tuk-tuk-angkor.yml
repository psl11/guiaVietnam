note: "Guía contratado el 23 (08:30-16:30) · pase Angkor 62 US$/p aparte · tuk-tuk por vuestra cuenta"
urgencia: semanas
body: >-
  **El guía del día 13 ya está contratado**: recogida a las **08:30**, hasta las **16:30**, y cubre
  Angkor Wat, Angkor Thom, el Bayon, las dos terrazas reales y Ta Prohm. Es exactamente lo que hacía
  falta — la piedra de Angkor sin alguien que la lea es decoración —, pero deja tres cosas fuera que
  hay que resolver aparte.


  **Uno: la entrada no va incluida** (confirmadlo, pero casi nunca lo está). El pase de **Angkor
  Enterprise** es de **3 días y 62 US$ por persona** —necesitáis el de tres porque el jueves volvéis a
  entrar— y conviene **comprarlo online la noche del 22** en angkorenterprise.gov.kh: lleva foto, es
  **nominal** y se valida con **QR** en cada control.


  **Dos: el amanecer.** El guía empieza a las 08:30 y el equinoccio es a las 07:06, así que el amanecer
  de Angkor Wat lo hacéis **por vuestra cuenta con tuk-tuk**, saliendo del hotel a las 04:45. Pedid al
  hotel **desayuno de caja** la víspera y, sobre todo, **negociad con el guía que os recoja allí y no
  en el hotel**: ahorra cuarenta minutos de ida y vuelta en el mejor momento del día.


  **Y tres: el atardecer**, porque a las 16:30 el guía os deja y los templos del ocaso cierran a las
  19:00. Mismo tuk-tuk, avisado desde por la mañana.


  **El tuk-tuk**, entonces, sigue haciendo falta los dos días: el conductor os espera entre templo y
  templo y conoce los horarios de la luz. El hotel os lo organiza. Precio de referencia: un guía
  oficial con licencia son **~35 US$/día** en la oficina de turismo — buen ancla para comprobar que lo
  que habéis pagado es razonable.


  **Propinas habituales:** **1-2 US$/día al conductor**, **5-10 US$/día al guía**.


  **Horarios:** casi todos los templos abren **7:30-17:30**; **Angkor Wat abre a las 5:00** para el
  amanecer, y **Pre Rup y Phnom Bakheng** cierran a las **19:00**, que son los del atardecer.
