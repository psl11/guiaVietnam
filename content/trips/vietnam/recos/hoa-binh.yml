note: "El Atlanta de Hanói · palacete de 1926 · 3★, gama media"
body: >-
  **El Atlanta de Hanói**, y el patrón de todo lo demás. Palacete colonial de **1926** —el antiguo
  *Hôtel Splendide*, en el 27 de Lý Thường Kiệt—, con la escalera de madera original y la grandeza
  desvaída intacta. Duermes **dentro del capítulo colonial** por precio de gama media.


  **Y la ubicación es la mejor posible para lo que hacéis**, que no es casualidad: está justo en la
  bisagra entre el barrio francés y el casco viejo. **Hỏa Lò a 400 m**, el **Bamboo Bar del Metropole a
  550**, el **lago Hoàn Kiếm a 700**, la **ca trù de Hàng Bạc a un kilómetro**. Los dos días de Hanói se
  hacen andando desde la puerta.


  Ahí está el argumento de fondo de esta guía con los hoteles-icono: **el relato se compra con una
  consumición, no con una habitación**. El martini de Graham Greene cuesta 15 € a siete minutos
  andando; la habitación del Metropole, entre 300 y 500 €. Se duerme al lado y se bebe dentro.


  **Y la duda resuelta, porque estuvo abierta un tiempo: Hòa Bình por encima de De Syloia.** El De
  Syloia (17A Trần Hưng Đạo) es un boutique correcto, mejor mantenido y a cinco minutos de aquí — pero
  es un buen hotel **sin historia**, y con dos noches solas no hay sitio para probar los dos. Si lo
  que buscáis es el edificio, es este. Sabiendo lo que se paga: **las habitaciones están cansadas**, y
  eso es exactamente el trato del Atlanta.


  **Reservar ya, con cancelación gratuita, y recomprobar en agosto:** que siga clasificado como 3★
  significa que la reconversión en 5★ de lujo todavía no ha ocurrido. Es la última ventana.
