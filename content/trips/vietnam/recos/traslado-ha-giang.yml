note: "Los dos con BiBi, dentro del paquete del loop · 1.880.000 ₫ los cuatro billetes (65 €)"
body: >-
  El bloque norte entra y sale **de noche y durmiendo**, y eso es lo que le devuelve dos días enteros al
  viaje. Los dos trayectos van **contratados con BiBi dentro del mismo paquete del loop**, que ahorra el
  trámite y —más importante— **hace que el operador sea responsable de que los horarios encajen**.


  **La ida · noche del martes 15.** *Ninh Bình (estación de Đồng Giừng) → Hà Giang*, **recogida a las
  20:30**, cabina VIP, **1.040.000 ₫ los dos**, llegada **sobre las cuatro de la madrugada**. Y lo
  mejor: **es directo, sin volver a pasar por Hanói**. Al bajar hay **cama esperando** —la noche previa
  al tour va incluida—, así que la madrugada no se sufre.


  **Se eligió el de las 20:30 y no el de las 18:30 por una razón concreta**: llega casi a la misma
  hora —el temprano tarda nueve horas y este siete y media, porque sale con la carretera ya vacía— y
  en cambio **devuelve la última tarde de Ninh Bình entera**. Con el de las seis y media habría que
  volver de Vân Long a las cinco, ducharse y cenar de pie. Con este da tiempo a cenar el *dê núi* sin
  reloj, que es el plato de la provincia y la última oportunidad de probarlo.


  **Y ojo con dónde recogen, que es la trampa de este billete.** Vosotros dormís en **Tam Cốc**, y la
  estación de **Đồng Giừng está en la ciudad de Ninh Bình, a siete u ocho kilómetros**. Si el autobús
  no pasa por Tam Cốc, hay que llegarse hasta allí por vuestra cuenta a las ocho de la tarde con las
  mochilas — veinte minutos de taxi. **Preguntadles el punto exacto de recogida al reservar** y, si es
  la estación, dejad el taxi hablado con el alojamiento la víspera.


  **La vuelta · noche del sábado 19.** *Hà Giang → **Nội Bài***, **cabina VIP a las 22:00**,
  **840.000 ₫ los dos**, unas siete horas, llegada **sobre las cinco de la mañana**.


  **Y esa hora de salida es una decisión, no un descuido.** BiBi vende tres: 17:00, 19:30 y 22:00. La de
  las cinco es una trampa —el tour vuelve *a las cuatro*, o sea sesenta minutos de margen para una
  jornada que termina bajando un puerto de montaña—. La de las 19:30 deja en Hanói a las dos o las tres
  de la madrugada, la peor hora que existe. **La de las 22:00 da seis horas de colchón**, tiempo para
  ducha y colada, y convierte el traslado en sueño en vez de comerse media jornada. Con eso, el domingo
  empieza a las cinco de la mañana en Hanói y da para volar a Hoi An.


  **Y ojo con la variante, que aquí sí importa:** BiBi vende ese billete al casco viejo *o* a **Nội
  Bài**, al mismo precio. **Coged el del aeropuerto.** El domingo voláis a Đà Nẵng a las 07:30, y
  entrando por el casco viejo tendríais que cruzar Hanói en Grab a las cinco y cuarto de la mañana:
  cuarenta minutos largos que dependen del tráfico y de que el autobús no se haya retrasado. Yendo
  directos a la terminal, **una hora de retraso del bus no rompe nada**. Se pierde el desayuno decente
  y se gana el único margen que había.


  **Dos avisos.** Que **confirmen por escrito que el de las 22:00 recoge en el hotel** y no en una
  estación a las afueras: los otros dos horarios lo dicen explícitamente y este solo pone la hora. Y si
  alguno de los dos duerme francamente mal en movimiento, sigue existiendo el **coche privado de día**
  (7-8 h) — pero cuesta una jornada entera, y en la ida serían Hoa Lư y Vân Long.
