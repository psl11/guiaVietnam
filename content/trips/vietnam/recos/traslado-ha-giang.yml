title: El bus cama a Hà Giang
area: Ninh Bình → Hà Giang · noche del 15
note: "Directo, sin pasar por Hanói · ~7 h 30 · cabina ~450k ₫ (15,5 €)"
body: >-
  El salto al norte se hace **de noche y durmiendo**, y eso es lo que le devuelve un día entero a Ninh
  Bình. Y lo mejor: **hay bus directo, sin volver a Hanói**. La especialista de la ruta es **Bằng
  Phấn** (4,6-4,8 sobre 5 con más de mil quinientas reseñas, cabinas modernas); también la hacen
  **Quang Nghi** y **Toán Oanh**. Recogen en la estación de Ninh Bình y algunas en la zona de Tam Cốc.


  **Los números:** **370-440 km en 7 h 30** el servicio rápido, hasta 11 h los lentos. Salidas
  escalonadas **entre las 18:00 y las 21:15**. Precio **290.000-400.000 ₫** (~10-14 €) en litera; la
  **cabina VIP para dos, ~450.000 ₫** (~15,5 €).


  **Dos cosas al elegir servicio.** Primera: **coged uno de los últimos**. Saliendo a las 18:00 se
  llega hacia la una de la madrugada, que es la peor hora posible; saliendo sobre las 21:00 se amanece
  en Hà Giang, que es exactamente lo que queréis. Segunda: **pagad la cabina**. Son cinco euros de
  diferencia sobre la litera abierta, y esta noche tiene que hacer de hotel.


  **Y la letra pequeña que hace que todo esto funcione:** llegáis de madrugada, así que **pedid por
  escrito al operador del loop una habitación para ducha y siesta hasta media mañana** antes de salir.
  Es la práctica normal —casi todos la ofrecen—, pero es exactamente el detalle que nadie confirma y
  luego se paga con cinco horas sentado en una acera. Con eso resuelto, el loop arranca con su primera
  etapa corta y el plan no pierde nada.


  **Las alternativas.** Muchos operadores del loop **gestionan ellos el bus**: preguntadlo, ahorra el
  trámite. Y si alguno de los dos duerme francamente mal en movimiento, sigue existiendo el **coche
  privado de día** (~7-8 h) — pero cuesta la jornada entera del día 5: adiós a Hoa Lư y a Vân Long.
