note: "La guía ofrece varias candidatas por comida; aquí va elegida una, y por qué esa"
body: >-
  **Gastronomía propone; esto decide.** Cada hueco del viaje tiene dos, tres o cuatro candidatas —así
  debe ser, porque sobre el terreno cambian el hambre, el calor y las ganas—, pero para **pedir mesa
  hay que elegir una**. Van en orden de viaje, con la hora puesta y el motivo de que sea esa y no la
  de al lado.


  **1 · [Luk Lak](#luk-lak) — sábado 12, 12:30.** El almuerzo del día que aterrizáis. Es **Bib
  Gourmand**, es sábado y venís de una noche de aviones: el día del aterrizaje es justo cuando no se
  quiere buscar mesa. Trata sus platos veg como platos y no como guarnición, que en ese nivel es lo
  que suele fallar.


  **2 · [Cầu Gỗ](#cau-go) — sábado 12, 18:30. Pedid ventana.** De las tres candidatas a la cena del
  sábado es **la única con carta vegetariana propia** (Chả Cá es pescado y en Tầm Vị es «a petición»),
  y está en el **73 de Cầu Gỗ**, o sea a trescientos metros del [teatro de marionetas](#teatro-thang-long).
  Cena mirando el Hoàn Kiếm y función a las 20:00 sin cruzar la ciudad.


  **3 · [Cơm Chay Nàng Tấm](#com-chay-nang-tam) — domingo 13, 11:45.** Esta parece menor y no lo es:
  es **el almuerzo de ella** mientras él hace el [bún chả de Obama](#bun-cha-huong-lien) dos manzanas
  al sur. Si está llena, el apaño de los veinticinco minutos se cae y ella se queda sin comer. Es
  domingo, y la casa sirve **solo de 10:00 a 14:00**.


  **4 · [Ưu Đàm Chay](#uu-dam-chay) — domingo 13, 18:15.** Domingo por la noche, **Bib Gourmand**, y
  con hora de salida obligatoria: el [ca trù](#ca-tru-hang-bac) canta a las 20:00 y caben cuarenta
  personas. Sentarse tarde aquí es perder lo otro.


  **5 · [Morning Glory](#morning-glory) — domingo 20, 19:30.** Primera noche de farolillos en Hoi An
  y **domingo**: la mesa más disputada del pueblo, en la noche más disputada de la semana.


  **6 · [Cuisine Wat Damnak](#cuisine-wat-damnak-reserva) — miércoles 23, 19:30.** La cena-evento de
  Camboya. **Última comanda a las 21:00**, y el menú **vegetariano de 38 US$ hay que pedirlo al
  reservar**, no al sentarse. Tiene ficha propia con la letra pequeña, incluido el lío de las dos sedes.


  **7 · [Chay Garden](#chay-garden) — viernes 25, 12:15.** Y esta es la que más se paga por olvidar:
  el 25 de septiembre es **el quince de la octava luna**, el día en que media Saigón come vegetariano.
  **Todos los chay de la ciudad estarán a reventar.** Está en el 52 de Võ Văn Tần, a doscientos metros
  del museo de la mañana.


  **Las dos de segunda fila**, que pueden esperar unos días: [Bánlle](#banlle-vegetarian) el **jueves
  24 a las 12:00** —el almuerzo antes de salir hacia el lago— y [Soul Kitchen](#soul-kitchen) el
  **lunes 21 a las 17:30**, en An Bàng, que al ser lunes aprieta menos.


  **Y una que no es reserva, es decisión: [Gia](#gia).** La estrella Michelin necesita semanas y
  cuesta la función del sábado. A estas alturas ya no es «reservar o no»: es asumir que **este viaje
  no la lleva**, y que la cena larga de Hanói se cambió por dos noches de escenario.
