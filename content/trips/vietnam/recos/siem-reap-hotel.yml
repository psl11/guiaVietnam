body: >-
  **Reservado, entrada el martes 22 y salida el jueves 24.** Un aviso de nomenclatura antes de nada:
  **el hotel se llama ahora Prana Hotel**; el enlace de la reserva conserva el nombre viejo, *Na Ta Nha
  Boutique*. Si al llegar el conductor no reconoce uno, probad con el otro — y llevad la dirección
  apuntada: **#678B, Sala Kanseng Village, Svay Dangkum**.


  **Lo que trae, y da la casualidad de que es exactamente lo que este bloque pedía.** Tiene **piscina
  infinity**, que en la ficha original no era un lujo de folleto sino infraestructura: el día 13 os
  levantáis a las **04:15** para el equinoccio, el guía os deja a las **16:30** y el día 14 volvéis a
  madrugar para Banteay Srei. **Traslado del aeropuerto**, que era lo otro que había que pedir — y hace
  falta, porque el aeropuerto nuevo está a **casi 50 km**. Y desayuno con **opciones vegetarianas**, que
  con dos madrugones seguidos importa más de lo que parece.


  **Y sobre la zona, una corrección honesta a lo que decía antes esta ficha.** Recomendaba Wat Bo o Wat
  Damnak, al este del río; **Svay Dangkum está al oeste**, justo al norte del Old Market. Al medirlo
  contra vuestro plan sale mejor de lo que yo había supuesto:


  **A favor, dos cosas y son las dos apretadas.** El [circo Phare](#phare-circo) está en la Ring Road,
  al suroeste — **desde aquí queda más cerca que desde Wat Bo**, y esa noche es la que va justa
  (aterrizáis a las 18:05 y la función es a las 20:00). Y **Angkor entra por el norte**, así que el
  tuk-tuk de las **04:45** del día 13 sale más corto.


  **En contra, una.** [**Cuisine Wat Damnak**](#cuisine-wat-damnak-reserva), la cena del día 13, queda
  al otro lado del río: unos dos kilómetros, ocho minutos de tuk-tuk. No es un problema, pero conviene
  tenerlo hablado con el conductor y no salir a buscarlo a las ocho de la noche.


  **Lo que sigue haciendo falta**, y va en [el pase, el guía y el tuk-tuk](#tuk-tuk-angkor): el
  **tuk-tuk para los dos días**, el **pase de Angkor** —que casi nunca va incluido en nada— y, la
  víspera del día 13, el **desayuno de caja** para salir a las cinco menos cuarto.
