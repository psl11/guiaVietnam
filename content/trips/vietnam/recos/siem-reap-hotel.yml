note: "Dos noches · el lado tranquilo del río · con piscina, y hoy más que nunca"
body: >-
  **La zona es Wat Bo o Wat Damnak, al este y al sur del río**, y no es una preferencia estética: es
  donde cae vuestro plan. La cena del día 12 es ahí mismo, [**Cuisine Wat
  Damnak**](#cuisine-wat-damnak-reserva) está en ese barrio, el [circo **Phare**](#phare-circo) queda a
  diez minutos y Angkor entra por el norte sin cruzar el centro. Pub Street está a un paseo si alguna
  noche apetece, y a suficiente distancia como para no oírla.


  **Y la piscina, que en esta guía suele ser lujo de folleto, aquí es infraestructura.** El día 13 os
  levantáis a las **04:15**, el guía os deja a las **16:30** y el día 14 volvéis a madrugar para
  Banteay Srei. **No hay siesta el día grande** —ocho horas seguidas de guía se lo comen—, así que el
  único descanso real es al volver. Y el día 14 hay **cuarenta y cinco minutos de hotel entre el
  circuito norte y el aeropuerto**: ducha, mochilas y fuera. Un sitio que no invite a tumbarse esos
  ratos no está haciendo su trabajo.


  **La opción con carácter, y es la que más encaja con vosotros: Sala Lodges.** Once **casas jemeres de
  madera de verdad**, rescatadas cada una de una provincia distinta, desmontadas y vueltas a levantar
  en un jardín. No es decoración temática: son casas centenarias con su estructura y sus postigos. Es
  el equivalente camboyano de dormir en el edificio y no en el hotel — y para una cámara, lo mejor del
  bloque.


  **Con una pega de ubicación que hay que decir**: está al nordeste, fuera del barrio, y eso tiene dos
  caras. A favor, poca: los madrugones hacia los templos de los días 13 y 14 salen unos cinco minutos
  más cortos, que no es nada. En contra, algo más: **la noche de llegada va apretada** —aterrizáis a
  las 18:05, estáis en el hotel a las 19:15 y el [circo Phare](#phare-circo) empieza a las **20:00**,
  al otro lado de la ciudad—, y desde aquí ese trayecto son diez minutos más que desde Wat Bo. No lo
  rompe, pero se come el poco margen que había. **Se elige Sala Lodges por las casas, no por dónde
  está.**


  **La opción con historia moderna: Viroth's Hotel.** Boutique de **arquitectura jemer de los años
  sesenta**, el estilo del *Sangkum* de Sihanouk que los jemeres rojos casi borran del país: hormigón
  volado, celosías, líneas limpias y piscina en la azotea. Es la única manera de tocar el siglo XX
  camboyano en un viaje que va todo a la piedra del XII.


  **La opción de precio: Rambutan Resort.** Una villa de los sesenta de un antiguo embajador, en Wat
  Damnak, con piscina de sal y jardín. Por bastante menos que las dos anteriores, y con más personalidad
  que cualquier cadena de la zona.


  **Y el icono, que aquí también se bebe y no se duerme.** El **Raffles Grand Hotel d'Angkor** es de
  **1932**, tiene el ascensor de jaula original y por él pasaron Jackie Kennedy y Charlie Chaplin —
  pero está al norte, lejos de vuestro barrio, y cuesta lo que cuesta. La jugada es la de siempre y ya
  está escrita: una copa en su [**Elephant Bar**](#elephant-bar) y a dormir al otro lado del río.
