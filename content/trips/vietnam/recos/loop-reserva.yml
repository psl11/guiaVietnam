note: "BiBi · easy rider privado · 15.670.000 ₫ (540 €) los dos, buses incluidos · pago en efectivo"
body: >-
  **Operador elegido: BiBi Hà Giang Loop Tour**, el *04 Days – 03 Nights Ha Giang Loop Tour*, del
  **miércoles 16 al sábado 19 de septiembre**. Es el circular clásico —sale y vuelve a Hà Giang— y se
  eligió frente a las dos travesías a Cao Bằng del mismo operador por tres razones: **acaba en Hà Giang
  a las 16:00** y eso enlaza con el bus cama sin gastar una tarde, **es el único que junta Lũng Cú,
  Nậm Đăm y Du Già**, y **deja libres el domingo y el lunes**, que es lo que ha hecho posible meter Hoi
  An.


  **Lo que hay contratado, con los números exactos.** Easy rider para los dos, **11.840.000 ₫**;
  habitación privada las tres noches de ruta, **1.950.000 ₫**; cama de dormitorio la noche previa,
  **gratis**; el bus cama de ida desde **Ninh Bình (estación de Đồng Giừng)**, **1.040.000 ₫**; y el de
  vuelta a Hanói, **840.000 ₫**. **Total 15.670.000 ₫ — unos 540 €**, que salen a 68 € por persona y
  día con todo dentro. Incluye **4 desayunos, 4 comidas y 3 cenas**, alojamiento, gasolina, entradas,
  agua, casco y protecciones.


  **Y lo que no incluye, que hay que sumar aparte.** El **permiso de zona fronteriza, 260.000 ₫ por
  cabeza** (520.000 los dos), que se paga allí y sin el cual no se pasa el control de Lũng Cú. El
  **seguro**. Las **bebidas**. Y la **propina al easy rider**, que no es opcional en la práctica:
  **100.000-170.000 ₫ por día y viajero**, en đồng y en mano al terminar — para cuatro días y dos
  personas, **800.000-1.400.000 ₫ (28-48 €)**. Con todo, el bloque norte sale por **unos 590-605 €**.


  **Ojo con esto: BiBi cobra solo en efectivo** (₫, dólares o euros). No es una tarjeta que se pasa al
  llegar: hay que llevar el dinero encima. Sacadlo en Hanói o en Ninh Bình antes de subir al bus —en
  Hà Giang hay cajeros, pero con límites bajos por operación y comisión por cada una.


  **Las siete cosas que hay que cerrar por escrito, y algunas cambian el viaje.**


  **1. La barca del cañón del Nho Quế.** No viene en el programa —solo figura el Skywalk— y es, con el
  paso, lo mejor del norte. Son unos 4 € por cabeza más el traslado al embarcadero de Tà Làng. **Pedidla
  al reservar y recordadla el primer día**, y encajadla el jueves entre las once y las tres, que es
  cuando el sol llega al fondo del desfiladero.


  **2. Parar en Sủng Là y en Sà Phìn.** Tampoco los nombra el programa, y **están los dos en la
  carretera del viernes** entre Đồng Văn y Quản Bạ: el valle donde se rodó *Chuyện của Pao* y el palacio
  fortificado de los Vương, el «rey del opio». Parar cuesta media hora y no un desvío.


  **3. Que la noche 3 sea Nậm Đăm y no Yên Minh.** El programa admite las dos y no es indiferente:
  **el baño de hierbas dao está en Nậm Đăm**. Y encargadlo nada más llegar, que hervir las hierbas lleva
  dos horas.


  **4. Que la póliza cubra al pasajero de moto**, no solo al conductor. Es la condición que más se cae
  de estos contratos y la que más importa aquí.


  **5. Cambio de fecha flexible.** Vais en septiembre; es el seguro antitifón de verdad. Que digan por
  escrito qué pasa si un temporal corta la QL4C.


  **6. Que el bus de las 22:00 recoja en el hotel**, no en una estación a las afueras. Los otros dos
  horarios lo dicen explícitamente y este solo pone la hora.


  **7. Preguntad si la salida es privada o compartida.** «Easy rider» significa que cada uno tiene su
  conductor — **no** que el tour sea vuestro. BiBi vende **grupos de hasta ocho**, así que podéis
  acabar rodando en convoy y parando donde decida el grupo. Con una cámara encima eso no es un detalle.
  Preguntad qué cuesta una salida privada.


  **Y el aviso de siempre, que aquí también aplica.** Cuando una agencia de Hà Giang se gana fama,
  **abre otra al lado con un nombre casi idéntico**. Id por la web oficial y por la dirección —el
  **Numa Hotel, nº 71 de la calle 19/5**— y nunca por el rótulo ni por quien os aborde en la calle. Si
  hiciera falta un plan B, la que mejor aval tiene es **Ethnic Travel** (35 Hàng Giấy), la única que
  Lonely Planet y Rough Guide recomiendan por separado.
