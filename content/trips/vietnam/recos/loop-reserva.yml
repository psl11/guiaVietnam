note: "Easy rider privado · ~430-590 €/pareja · fijar la fecha de FIN · reservar YA"
body: >-
  **Reservar ya**, y es la reserva más urgente del viaje. Easy rider privado: ni jeep, ni grupo de diez
  motos. Innegociables, **por escrito**: (a) **permiso de zona fronteriza incluido y tramitado por
  ellos** —lo presentan con vuestros pasaportes antes de salir, y **os lo piden dos veces solo en Lũng
  Cú**, en la policía turística y en el control militar al pie de la torre—; (b) **política de cambio de
  fecha flexible**, que es el seguro antitifón de verdad; (c) que **reencaminen en tiempo real** si se
  corta una carretera; (d) **habitación para ducha y siesta la mañana del 16**, al bajar del bus cama; y
  (e) que la **póliza cubra al pasajero de moto**, no solo al conductor. A cotizar: Hà Giang Epic,
  Jasmine Tours, QT Motorbikes.


  **Lo que hay que fijar no es la duración: es el día de vuelta.** El mercado de Mèo Vạc es **los
  domingos** y solo los domingos, así que lo que no se negocia es **terminar el domingo 20**. Un
  4D/3N que corriera del 17 al 20 también lo pillaría. Decidlo en esos términos al operador —«queremos
  estar en Mèo Vạc la mañana del domingo 20»— y no en número de días, que es donde se producen los
  malentendidos.


  **Y aun así, pedid los cinco días.** Tres razones, y ninguna tiene que ver con el mercado. La
  primera: comprimir a cuatro significa **fundir las dos primeras etapas** (52 km + 36-53 km) en una
  sola de unos cien kilómetros de carretera de montaña con paradas — y sería **el primer día**, justo
  cuando menos hecho está el cuerpo a ir de paquete y justo el día que además absorbe la llegada de
  madrugada del bus cama. Las otras tres jornadas no tienen holgura donde meter nada: el 18 ya lleva
  Sủng Là, Sà Phìn, Lũng Cú y Đồng Văn, y el 20 termina con 155 km.


  La segunda: la noche que se cae al comprimir es la de **Nậm Đăm**, y esa es **la única del viaje con
  arroz en terraza dorado**. El altiplano de Đồng Văn es roca gris y maíz entre piedras, y Hoàng Su Phì
  quedó fuera por falta de días: si se pierde Nậm Đăm, se pierde la postal entera.


  La tercera, y es la de peso: **vais en septiembre**. Un loop de cinco días con una primera etapa
  corta tiene margen si un temporal corta una carretera; uno de cuatro, apretado de principio a fin,
  no tiene ninguno.


  **La propina, que nadie explica y es el momento incómodo del viaje:** al easy rider se le da
  **100.000–170.000 ₫ (~3,5–5,5 €) por día y viajero** (o un **5-10 % del precio del tour**), **en đồng y en mano, al
  final**. Para estos 5 días y dos viajeros, la horquilla razonable sale de **1 a 1,7 millones de ₫ (~33–57 €)**.
  No es obligatoria, pero es la norma — y con un conductor que os ha llevado cuatro noches por la
  montaña, llegar sin saberlo se nota.
