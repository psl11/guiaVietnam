body: >-
  **Reservado, y con la entrada el sábado 12 y la salida el lunes 14** — las dos únicas noches de
  Hanói de todo el viaje.

  Es un **boutique de treinta y tres habitaciones en un edificio de 1936**, reformado a fondo en 1998,
  en el **17A de Trần Hưng Đạo**. Y la ubicación es la buena para lo que hacéis, que es lo que
  importaba: está en la bisagra entre el **barrio francés** y el **casco viejo**, con **Hoàn Kiếm a
  600 m**, la **Ópera a 500**, el **Bamboo Bar del Metropole a 500** y la **ca trù de Hàng Bạc a un
  kilómetro**. Los dos días se hacen andando desde la puerta, y el amanecer del día 3 en
  [Long Biên](#long-bien) son ocho minutos en Grab a las cinco de la mañana.

  Tiene además el **Cây Cau**, restaurante vietnamita del propio hotel, que a la vuelta de un día
  largo resuelve una cena sin salir.

  **Y conviene decir en qué consiste la elección, porque esta guía recomendaba el otro.** La
  alternativa era el **Hòa Bình**, palacete colonial de **1926** en el 27 de Lý Thường Kiệt —a cinco
  minutos de aquí— con la escalera de madera original y la grandeza desvaída intacta. La guía tiraba
  por él aplicando su regla de siempre: el edificio por delante de la comodidad.

  Lo que se cambia es concreto y no es un mal cambio: **una década menos de edificio y una reforma
  reciente, a cambio de habitaciones que funcionan**. El Hòa Bình arrastra fama de cansado, y con solo
  dos noches —y llegando a las 06:40 sin haber dormido— dormir bien no es un capricho. La regla de la
  guía sigue en pie donde de verdad se cobra sola: el relato del Metropole se compra con **un martini
  de 15 € en el Bamboo Bar**, a cinco minutos andando, y no con una habitación de 300 a 500.
