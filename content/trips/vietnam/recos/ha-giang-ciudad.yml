note: "Tarde del 20 sep · habitación de día, no noche · ducha y lavandería"
body: >-
  **En Hà Giang no dormís ninguna noche, y eso es a propósito.** Las cuatro del loop (16, 17, 18 y 19)
  las pone el easy rider —el tour es 5D/4N e incluye los homestays de Nậm Đăm, Yên Minh, Đồng Văn y Mèo
  Vạc—, y **las dos que rodean la montaña las resuelven los buses cama**: la del 15 subiendo desde Ninh
  Bình y la del 20 bajando a Hanói. Si intentáis cuadrar las del loop por vuestra cuenta, pagáis dos
  veces.


  Lo que sí hay que reservar son **dos habitaciones de día**, que es un producto distinto y más barato
  que una noche:


  - **La mañana del 16**, al bajar del bus a las cinco de la madrugada: ducha y un par de horas de
    sueño antes de que arranque el loop. **La da el operador** — pedidlo por escrito al reservar (es la
    pregunta 8 del mensaje a las agencias).
  - **La tarde del 20**, entre que se llega de la montaña sobre las tres y sale el sleeper a las ocho.
    Bajáis con cinco días de polvo y humedad encima: aquí vale más el **agua caliente fiable y una
    lavandería exprés** que la ubicación. Sirven **Phoenix Hotel** o **Silk River**; los nombres que
    salen en todas las listas —Jasmine, Bong, Mamas— son **hostels de mochilero**, buen ambiente pero no
    es como estáis haciendo este viaje.


  **Y esa tarde del 20 es la segunda oportunidad del baño de hierbas.** Si no lo hicisteis en Nậm Đăm el
  día 6, el ***tắm lá thuốc*** dao —más de cien hierbas de monte hervidas, tina de madera a 38-42 °C,
  veinte minutos— es exactamente lo que pide un cuerpo que lleva cinco días de moto, y encima os deja
  presentables para el autobús. El **Truong Xuan Resort**, en bungalós junto al río Lô, lo tiene en
  carta con masaje y sauna. Cuadrarlo con la hora del bus es lo único que hay que vigilar.
