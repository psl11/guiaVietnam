note: "Noche del 20 sep · gama media 30-50 US$ · ducha y lavandería"
body: >-
  Es la única noche del bloque norte que tenéis que reservar vosotros, y se cuela fácil: **las cuatro
  del loop (16, 17, 18 y 19) las pone el easy rider** —el tour es 5D/4N e incluye los homestays de Nậm
  Đăm, Yên Minh, Đồng Văn y Mèo Vạc— y **la del 15 la resuelve el bus cama**, que hace de hotel
  rodante. Si intentáis cuadrar las del loop por vuestra cuenta, pagáis dos veces.


  **Lo que sí hay que pedir aparte, y no es una noche:** una **habitación de día el 16 por la mañana**,
  para ducharos y dormir un par de horas al bajar del bus antes de que arranque el loop. Casi todos los
  operadores la dan; pedidlo por escrito al reservar.


  **Para la del 20, priorizad el baño sobre la ubicación.** Bajáis de cinco días de moto con la ropa
  húmeda y el equipo lleno de polvo: aquí valen más el **agua caliente fiable y la lavandería** que
  estar céntricos. La gama que funciona es la media, **30-50 US$**: cama de verdad, consigna y
  desayuno. Sirven **Phoenix Hotel** o **Silk River Hotel**. Los nombres que salen en todas las listas
  —Jasmine, Bong, Mamas— son **hostels de mochilero** y punto de encuentro de los tours en grupo: buen
  ambiente, pero no es como estáis haciendo este viaje.
