note: "Noches 15 y 20 sep · gama media 30-50 US$"
body: >-
  Son las dos únicas noches del viaje sin ficha propia, y se cuelan fácil: **las cuatro del loop
  (16, 17, 18 y 19) las pone el easy rider** —el tour es 5D/4N e incluye los homestays de Nậm Đăm,
  Yên Minh, Đồng Văn y Mèo Vạc—, así que sobran justo estas dos. Si intentáis cuadrar las del loop
  por vuestra cuenta, pagáis dos veces.


  **Lo primero, antes de reservar nada: preguntad al operador si incluye o gestiona la noche
  previa.** Muchos lo hacen, y entonces la del 15 se resuelve sola.


  **Y las dos noches no piden lo mismo, aunque sean el mismo sitio.** El 15 llegáis en coche privado
  desde Ninh Bình, limpios y con la mochila hecha: solo hace falta dormir bien antes de que arranque
  la montaña. El 20 bajáis de cuatro días de moto con la ropa húmeda y el equipo lleno de polvo —
  para esa, la ducha buena y la lavandería valen más que la ubicación.


  La gama que da mejor resultado aquí es la media, **30-50 US$**: agua caliente fiable, cama de
  verdad, consigna y desayuno. Sirven **Phoenix Hotel** o **Silk River Hotel**. Los nombres que
  salen en todas las listas —Jasmine, Bong, Mamas— son **hostels de mochilero** y punto de encuentro
  de los tours en grupo: buen ambiente, pero no es como estáis haciendo este viaje.
