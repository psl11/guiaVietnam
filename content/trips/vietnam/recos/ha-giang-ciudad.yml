title: El Numa Hotel, principio y final del loop
area: Hà Giang · madrugada del 16 y tarde del 19
status: reservado
note: "Va dentro del paquete de BiBi · cama de dormitorio gratis · privada +550.000 ₫"
body: >-
  No hay ninguna noche de hotel que reservar en todo el bloque norte, y conviene decirlo porque se cuela
  fácil: **las tres noches del loop las pone el easy rider** —Du Già, Đồng Văn y Nậm Đăm—, **la del 15 la
  resuelve el bus cama** y **la del 19 también**, porque esa noche ya vais de vuelta a Hanói. Si
  intentáis cuadrar alguna por vuestra cuenta, pagáis dos veces.


  Lo único que hay es el **Numa Hotel** (nº 71, calle 19/5), la base de BiBi, y aparece dos veces.


  **La madrugada del miércoles 16.** El bus descarga entre las tres y las cuatro y **la noche previa al
  tour va incluida**, con *check-in* a cualquier hora. Son **camas de dormitorio**; la habitación
  privada son **550.000 ₫** más (~19 €) y, para cuatro horas de sueño antes de subirse a una moto cuatro
  días, es de los pocos suplementos del viaje que se pagan solos. **Pedidlo al reservar**, no al llegar.


  Y aquí se hace **el reparto del equipaje**: en la moto van solo cuatro días de ropa y el resto se queda
  en la consigna del hotel hasta el sábado. Ese reparto **hay que dejarlo hecho en Ninh Bình**, antes de
  subir al bus — a las cuatro de la mañana y con sueño es como se pierden las cosas.


  **La tarde del sábado 19.** Se vuelve sobre las cuatro y el bus no sale hasta las diez, y esas seis
  horas no sobran. En orden, porque el orden importa:


  **La colada, lo primero.** Es lo único que tiene reloj: lavan al peso, **30-40.000 ₫ el kilo**, y
  tardan tres o cuatro horas. Bajáis con cuatro días de ropa de montaña y **esta es la única ventana del
  viaje para lavarla**; si no, la arrastráis hasta Hoi An. Se entrega al llegar y se recoge a las ocho.


  **Después, ducha larga y siesta**, que es lo que convierte el bus de la noche en una cama de verdad y
  no en un castigo.


  **Y de siete a nueve, la cena de despedida con los pilotos**, parrilla y *bia hơi* en cualquier quán
  de la orilla del río Lô. Es donde se da la propina y es de lo que se recuerda del loop — y es
  exactamente lo que el bus de las cinco de la tarde hace imposible.


  Si sobra rato, el **paseo del río a la caída de la tarde** es la ciudad haciendo deporte —bádminton,
  *đá cầu*, grupos de gente mayor— sin un solo turista, y el **hito del Km 0**, el mojón que marca el
  arranque del loop, es la foto que lo cierra. Preguntad también si ese fin de semana hay **calle
  peatonal**, que Hà Giang la monta algunos viernes y sábados.
