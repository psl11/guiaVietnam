body: >-
  La cena de **alta cocina jemer** de temporada ([ver su ficha completa en
  Gastronomía](#cuisine-wat-damnak)). Abre **de lunes a sábado, cerrado los domingos**, de 18:30 a
  23:00 — pero **la última comanda es a las 21:00**, así que hay que entrar antes. El día 13 es
  miércoles y encaja.


  **Ojo al reservar, que hay dos sedes y es un error fácil:** la casa madre está en **Siem Reap**
  —Wat Damnak village, entre el mercado Psa Dey Hoy y el instituto Angkor— y desde 2021 hay **otra en
  Phnom Penh**, en la calle 228. **La vuestra es la de Siem Reap**; en TableCheck aparecen las dos.


  **Solo hay menú degustación, sin carta:** **45 US$** el normal y **38 US$ el vegetariano**, más un 5 %
  de servicio y un 10 % de impuestos. El vegetariano **hay que pedirlo al reservar**, no al sentarse.


  Reserva por **TableCheck con 24 h mínimo**; para el mismo día, por teléfono (+855 77 347 762).
