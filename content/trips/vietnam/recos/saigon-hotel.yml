note: "Dos noches · el hotel de Graham Greene, y aquí sí sale a cuenta dormir dentro"
body: >-
  **Y aquí, por una vez, la regla de esta guía se invierte: en Saigón sí se duerme dentro del icono.**


  El **Hotel Continental Saigon** es de **1880**, ocupa la esquina de Đồng Khởi con Lam Sơn frente a la
  Ópera, y es **donde Graham Greene escribió *El americano impasible***. Se alojó en la **habitación
  214**, y la terraza de la planta baja —la que él llamaba «el bar de la calle»— es literalmente el
  escenario del primer capítulo de la novela. Lo lleva Saigontourist, es estatal, y por eso pasa lo
  que no pasa en Hanói: **la habitación se mueve en gama media, no en gama de lujo**. El mismo relato
  que en el Metropole cuesta entre 300 y 500 € aquí cuesta lo que ya ibais a pagar.


  Sabiendo qué se compra, que es exactamente el trato del [De Syloia](#de-syloia): **las habitaciones
  están anticuadas**, el servicio es de hotel estatal y no hay diseño moderno por ningún lado. Se paga
  por el edificio, el patio de las frangipanes y la dirección. Si eso es lo que buscáis —y lo es—, no
  hay nada mejor en este viaje.


  **Y la ubicación cierra el argumento.** El [día 16](#dia-16-despedida) es un paseo por Đồng Khởi que
  **empieza en la terraza de este hotel**: Ópera enfrente, Correos de 1891 a cinco minutos, Majestic al
  final de la calle. El **Caravelle**, donde termina la noche del día 15, está **a doscientos metros**.
  El Museo de los Vestigios y el Palacio de la Reunificación, a diez y quince minutos andando.
  **Chợ Lớn es lo único que queda lejos** —veinte minutos en taxi— y solo se va una tarde.


  **Las alternativas, por si el Continental no cuadra de precio o de disponibilidad.** El **Majestic**
  (1925), art déco a la orilla del río, con el **M Bar** en la azotea desde donde los corresponsales
  veían los combates — mismo perfil, misma casa estatal, y el río en la ventana. El **Grand Saigon**
  (1930), con su ascensor de jaula original, algo más barato y en la misma calle. Y si preferís algo
  moderno y bien mantenido, la zona de **Nguyễn Huệ** tiene oferta de sobra en **60-90 €**, con el
  [**Cafe Apartments**](#dia-14-angkor-vuelta) enfrente.


  **Reservad pronto**: son fin de semana y caen en **Trung Thu**. Y al reservar, **pedid la 214** — no
  siempre la dan, pero preguntarlo es gratis.
