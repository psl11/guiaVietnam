note: "Reservado · apartamento con terraza y lavadora · 9,0, con un 9,7 en ubicación"
body: >-
  **Reservado, las noches del jueves 24 y el viernes 25.** No es un hotel: es un **apartamento** en el
  6/27 de Cách Mạng Tháng 8, en el barrio de **Bến Thành**, pleno Distrito 1. **9,0 con 605 comentarios
  y un 9,7 en ubicación**, que es la nota más alta de todo el viaje en ese apartado.


  **Y la ubicación aguanta el examen.** Todo el Distrito 1 cabe andando desde la puerta:


  - **Mercado de Bến Thành** — 400 m
  - **Palacio de la Reunificación** — 1 km
  - **Museo de los Vestigios de la Guerra** — 1,3 km, unos quince minutos
  - **Nguyễn Huệ y el [Cafe Apartments](#cafe-apartments)** — 1,1 km
  - **Đồng Khởi, el Continental y el Caravelle** — 1,2 km
  - **Tân Sơn Nhất** — 5 km


  **Lo que cambia respecto a lo que esta ficha recomendaba.** Defendía dormir en el **Continental**
  (1880), donde Greene escribió *El americano impasible* en la habitación 214, con el argumento de que
  al ser un hotel estatal la habitación va en gama media y no en gama Metropole. Se ha elegido otra
  cosa, y **con eso la regla general de la guía vuelve a su sitio**: como en
  [Hanói](#de-syloia), se duerme al lado y **el icono se compra con una consumición**. El café en la
  terraza del Continental —«Radio Catinat»— sigue en el plan del [día 16](#dia-16-despedida); lo que
  cambia es que ya no se sale a él por la puerta, sino que se llega andando en quince minutos.


  **Dos cosas que trae un apartamento y un hotel no**, y en el día 16 valen su peso: **lavadora** —o
  servicio de lavandería— para llegar a casa con la mochila limpia después de quince días, y **terraza
  propia**. Lo que no trae es **desayuno**, así que la mañana del día 15 —que arranca a las 07:30 en el
  museo— hay que resolverla fuera: [**Phở Minh**](#pho-minh) queda a diez minutos y en Võ Văn Tần, la
  calle del propio museo, hay tres Bib Gourmand incluido [**Chay Garden**](#chay-garden).


  **Y tampoco hay piscina**, así que la siesta obligatoria del día 15 —treinta y tantos grados con
  humedad alta— se hace en la habitación con el aire puesto. Es suficiente, pero conviene saberlo y no
  contar con un chapuzón.
