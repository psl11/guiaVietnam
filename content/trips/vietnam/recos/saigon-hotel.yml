body: >-
  Dos noches, y la ubicación es fácil porque **todo lo que vais a hacer cabe en el Distrito 1**: el
  Museo de los Vestigios y el Palacio de la Reunificación están a diez minutos andando el uno del otro,
  y Đồng Khởi —la vieja rue Catinat— baja desde ahí hasta el río. **Chợ Lớn es lo único que queda
  lejos**, veinte minutos en taxi, y solo se va una tarde.


  Así que el criterio es simple: **entre Bến Thành y el río**, sin alejarse. La zona de **Đồng Khởi /
  Nguyễn Huệ** es la más cómoda para el paseo del último día; la de **Bến Thành / Phạm Ngũ Lão** es más
  barata y ruidosa. Con la gama media de siempre —**60-90 €**— aquí se duerme muy bien, porque Saigón
  tiene mucha más oferta que Hanói.


  **Y una tentación que conviene mirar con calma.** Los tres hoteles con historia de la ciudad son el
  **Continental** (1880), el **Majestic** (1925) y el **Caravelle** (1959) — el triángulo de los
  corresponsales de guerra. Pero se aplica lo mismo que con el Metropole en Hanói: **la habitación
  cuesta lo que cuesta y el relato se compra con una consumición**. Dormid al lado y desayunad en la
  terraza del Continental, que es lo que está en [el día 16](#dia-16-despedida).


  **Reservad pronto**: cae en Trung Thu y es fin de semana.
