title: Hoi An, la noche del casco viejo
area: Hoi An · 2 noches · 20-22 sep
status: pendiente
note: "Dos noches · andando al casco viejo, no en la playa"
body: >-
  Dos noches, y el criterio es uno por encima de todos: **tiene que estar a pie del casco viejo**. La
  última mañana se sostiene sobre salir a andar **a las cinco y media**, con el pueblo cerrado y vacío,
  y eso solo funciona si se sale por la puerta y ya estáis dentro.


  **Por eso hay que descartar An Bàng como base**, aunque salga en todas las listas. La playa está a
  **cuatro kilómetros**: dormir allí significa depender de un taxi al amanecer, o renunciar a la mejor
  hora que da esta ciudad. A la playa se va **en bici la tarde del 11**, que es cuando toca, y se
  vuelve a dormir al casco viejo.


  **La opción con historia** es el **Vĩnh Hưng Heritage**, una casa de comerciante chino del siglo XIX
  en plena calle Trần Phú, con la estructura de madera original y apenas media docena de habitaciones. No
  es un hotel con decoración de época: es la casa. Es lo más cerca que vais a dormir de lo que fue este
  puerto.


  **La opción de comodidad**, y después de cuatro días de moto y una noche de bus no es un capricho, es
  el **Anantara Hoi An**: pabellones de estilo colonial a la orilla del Thu Bồn, jardín, piscina, y el
  puente japonés a diez minutos andando. Es de lo más caro del viaje y es la única noche en que
  probablemente lo compense.


  **La opción intermedia** son los hoteles de la orilla sur, en **An Hội**, cruzando el puente peatonal:
  piscina, precios de la mitad y el casco viejo a cinco minutos. El **Little Riverside** es el que mejor
  reputación mantiene.


  **Y el encargo del sastre, que ahora sí cabe bien.** Hoi An vive de la sastrería a medida y
  **funciona de verdad, en 24 horas**. Con dos noches el ciclo entra entero: **encargo el domingo por
  la tarde, prueba el lunes al mediodía y recogida el lunes por la noche o el martes a primera hora**.
  Es la diferencia entre una prenda que sienta y una que casi. Lo que no hay que aceptar nunca es un
  «os lo mandamos al hotel».
