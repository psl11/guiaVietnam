title: Hoi An, la noche del casco viejo
area: Hoi An · 1 noche · 20-21 sep
status: pendiente
note: "Una sola noche · andando al casco viejo, no en la playa"
body: >-
  Una noche sola, y por eso el criterio es más estrecho de lo normal: **tiene que estar a pie del casco
  viejo**. El plan del día 11 se sostiene sobre salir a andar **a las cinco y media de la mañana**, con
  el pueblo cerrado y vacío, y eso solo funciona si se sale por la puerta y ya estáis dentro.


  **Por eso hay que descartar An Bàng**, aunque salga en todas las listas. La playa está a **cuatro
  kilómetros** y con una sola noche significa depender de un taxi al amanecer o renunciar a la mejor
  hora que da esta ciudad. Con dos noches sería otra conversación; con una, no.


  **La opción con historia** es el **Vĩnh Hưng Heritage**, una casa de comerciante chino del siglo XIX
  en plena calle Trần Phú, con la estructura de madera original y apenas media docena de habitaciones. No
  es un hotel con decoración de época: es la casa. Es lo más cerca que vais a dormir de lo que fue este
  puerto.


  **La opción de comodidad**, y después de cuatro días de moto y una noche de bus no es un capricho, es
  el **Anantara Hoi An**: pabellones de estilo colonial a la orilla del Thu Bồn, jardín, piscina, y el
  puente japonés a diez minutos andando. Es de lo más caro del viaje y es la única noche en que
  probablemente lo compense.


  **La opción intermedia** son los hoteles de la orilla sur, en **An Hội**, cruzando el puente peatonal:
  piscina, precios de la mitad y el casco viejo a cinco minutos. El **Little Riverside** es el que mejor
  reputación mantiene.


  **Y el encargo del sastre, si os tienta.** Hoi An vive de la sastrería a medida y **funciona de
  verdad, en 24 horas**. Con una sola noche eso significa **encargar el domingo por la tarde y recoger
  el lunes antes de las doce** — no hay segunda pasada de pruebas y no aceptéis un «os lo mandamos al
  hotel». Si no encaja en esa ventana, mejor no empezar.
