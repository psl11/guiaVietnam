note: "Reservado · 9,4 con 1.124 comentarios · piscina exterior y spa · a 850 m del puente japonés"
body: >-
  **Reservado el Threeway Riverside Villa**, en el 74 de Nguyễn Du, barrio de **Cẩm Phô**. **9,4 con
  1.124 comentarios** —la mejor combinación de nota y respaldo de toda la búsqueda—, personal 9,8,
  **piscina exterior**, spa, baño de vapor y alquiler de bicicletas.


  **Y es el punto medio que se buscaba: buen hotel *y* a distancia de paseo.** Está a **unos 850 metros
  del puente japonés**, once minutos andando por una calle llana junto al río. Eso importa porque este
  plan **cruza el casco viejo cuatro veces** —las dos noches de farolillos, el amanecer del día 12 y la
  mañana de la salida— y a esta distancia no hay nada que decidir: se anda. Un huésped lo resume mejor
  que ninguna ficha: *«cerca de todo pero un pelín retirado del bullicio, en una zona tranquila»*.


  **Tres cosas que trae y que encajan con días concretos.** La **piscina exterior**, para la tarde del
  20, que llegáis de cuatro días de moto y una noche de autobús. El **alquiler de bicicletas**, que es
  justo lo que pide la tarde del [día 11](#dia-11-hoi-an) —Trà Quế y la playa de An Bàng— y desde Cẩm
  Phô se sale ya en esa dirección. Y **Cẩm Phô no tiene restricción de tráfico**, al contrario que el
  núcleo peatonal, así que **el taxi para en la puerta** las dos puntas: la llegada a las ocho de la
  mañana del domingo y la salida a las 10:30 del martes.


  **Lo único que hay que comprobar: que la reserva empiece el sábado 19.** El VJ501 os deja aquí **a las
  ocho de la mañana del domingo** y la entrada normal es **a las dos de la tarde**. Con la habitación
  pagada desde la víspera entráis a las ocho, os ducháis y dormís dos horas — y el domingo se convierte
  en un día entero de verdad. Sin esa noche llegáis con una noche de autobús encima y **seis horas por
  delante sin sitio donde tumbaros**. Si la reservasteis del 20 al 22, **añadid el 19**: es el medio día
  más barato de todo el viaje.


  **Y el encargo del sastre, que con tres noches cabe entero.** Hoi An trabaja **en 24 horas**: encargo
  el domingo por la tarde, prueba el lunes al mediodía, recogida el lunes por la noche o el martes a
  primera hora. Lo que no hay que aceptar nunca es un «os lo mandamos al hotel».


  **De cómo se llegó hasta aquí**, por si hiciera falta cambiar: se compararon seis, y las zonas de Hoi
  An funcionan así.


  **Las cinco zonas, y cuánto tardáis en el puente japonés desde cada una:**


  **1 · El núcleo peatonal** —Trần Phú, Nguyễn Thái Học, Bạch Đằng—, **0-5 min**. Dormís *dentro* del
  Patrimonio de la Humanidad. Son casas antiguas reconvertidas, con pocas habitaciones y casi nunca
  piscina. Ruido de calle hasta las diez de la noche.


  **2 · An Hội**, la lengua de tierra al otro lado del puente peatonal, **5 min**. Es donde está la
  oferta con piscina, a mitad de precio, y desde donde **se ve el casco viejo iluminado** en vez de
  estar dentro de él.


  **3 · Cẩm Phô**, al norte del casco, **10-15 min andando**. Residencial, tranquilo, barato, sin nada
  en contra salvo que no tiene nada especial a favor.


  **4 · Cẩm Thanh y Cẩm Châu**, entre el pueblo y el mar, **3-4 km**. Arrozales, cocoteros de agua y
  silencio — pero todo se hace en bici o taxi.


  **5 · An Bàng y Cửa Đại**, la playa, **4-5 km**.


  **La respuesta para vosotros es An Hội, y la decide un detalle que no sale en ninguna guía: el casco
  antiguo cierra al tráfico por franjas** —a grandes rasgos de 08:00 a 11:00 y de 14:00 a 21:30—. Y
  vuestras dos puntas caen **justo dentro**: llegáis en taxi desde Đà Nẵng **a las 08:00** del domingo
  y salís **a las 10:30** del martes. Durmiendo en el núcleo, eso son **doscientos o trescientos metros
  andando con las mochilas** en las dos puntas. En An Hội, el taxi para en la puerta.


  A eso se le suma que **la vista buena de los farolillos se tiene desde fuera**: las dos noches que
  pasáis aquí, la postal es el casco viejo encendido reflejado en el Thu Bồn, y eso se ve desde la
  orilla sur, no desde dentro. Y que por el mismo dinero hay **piscina**, que después de cuatro días de
  moto y una noche de autobús no es un adorno.


  **Y el amanecer del día 12 no sufre**: son **cinco minutos** cruzando el puente peatonal. La razón de
  descartar la playa era no depender de un taxi a las cinco y media de la mañana; desde An Hội se va
  andando igual que desde Trần Phú.


  **Un aviso al elegir habitación en An Hội:** la orilla que mira al casco viejo es la del **mercado
  nocturno**, animada hasta las diez y pico. **Pedid habitación que no dé a esa calle** —hacia el
  interior o al canal sur— y tenéis lo mejor de las dos cosas.


  **Y el caso en que sí compensa el núcleo.** Si lo que os apetece es dormir en el edificio y no en el
  hotel, la casa es el **Vĩnh Hưng Heritage**: una vivienda de comerciante chino del siglo XIX en plena
  Trần Phú, con la estructura de madera original y media docena de habitaciones. Es el
  [De Syloia](#de-syloia) de aquí — el edificio por delante de la comodidad. Con dos mochilas de cabina,
  los trescientos metros a pie de las dos puntas son un no-problema, así que **es una elección legítima
  y no un error**: solo hay que saber lo que se cambia.


  **La preselección, con los datos buenos.** Aviso: las notas y los precios que se leen sin sesión
  iniciada **no son los vuestros** —Booking aplica los descuentos Genius y muestra el precio tachado
  junto al real—, así que aquí van solo la nota real, el número de comentarios y la distancia, que es
  lo comparable. **Para el precio, mirad vuestra propia sesión.**


  **Los tres finalistas:**


  - **Threeway Riverside Villa** — *74 Nguyễn Du, Cẩm Phô* · **menos de 1 km** · **9,4 (1.124
    comentarios)**, personal 9,8, parejas 9,6 · **piscina exterior**, spa, baño de vapor, cocina
    compartida y alquiler de bicis · Genius 11 %.
  - **Gia Huy Riverside** *(antes The Corner Riverside Villa)* — *100 Nguyễn Du, Cẩm Phô* · 1,1 km ·
    **9,2 (680)**, personal 9,8 · **piscina exterior** con vistas, gimnasio, jardín, **bicis gratis** y
    restaurante con carta **vegetariana y vegana** · Genius 20 %.
  - **Hoianan Boutique** — *15A Nguyễn Hoàng, An Hội* · **4 minutos a pie del puente japonés**, el más
    cercano · **8,9 (830)**, y **parejas 9,7**, la nota de ubicación más alta de las tres · piscina
    **cubierta**, hidromasaje, **bicis gratis** · Genius 20 %.


  **Ganó el Threeway**, por ser la mejor nota con el mayor respaldo de comentarios de toda la lista y
  además **el tranquilo** — un huésped lo resume mejor que yo: *«cerca de todo pero un pelín retirado
  del bullicio, en una zona tranquila»*. Piscina exterior y spa después de cuatro días de moto y una
  noche de autobús no es un adorno.


  **Pero está reñido, y hay dos condiciones que lo pueden dar la vuelta.**


  **La primera es el precio.** Gia Huy y Hoianan tienen **20 % de Genius** y Threeway solo **11 %**, así
  que la diferencia real puede ser mayor de lo que parece. Si Threeway sale bastante más caro, los otros
  dos son elecciones legítimas.


  **La segunda es cuánto os pesa andar.** **Hoianan está a cuatro minutos del puente japonés** — y este
  plan cruza el casco viejo cuatro veces, contando el amanecer del día 12 a las 05:45. Su única pega es
  seria pero acotada: está en **Nguyễn Hoàng, la calle del mercado nocturno**, animada hasta las diez y
  pico. **Si vais por él, pedid habitación interior o al patio** y el problema desaparece.


  **Y los tres que se miraron antes y se quedan fuera**, con una advertencia: sus notas las leí sin
  sesión iniciada y **salieron mal** —el mismo fallo que con los precios—, así que si alguno os interesa,
  comprobadlo vosotros. Eran el **Chillax Old Town Villa** (An Hội, a una calle del mercado, piscina
  cubierta), el **Old Town Hotel** *(antes Thien Thanh)* en Cẩm Phô, y el **Nolia** *(antes Soluna
  D'Annam)*, que tiene la mejor nota de todas pero está a **1,7 km** — demasiado para las cuatro
  travesías de este plan, aunque preste bicis.


  **El que descartaría es Gia Huy.** Está en la misma calle que Threeway, cien metros más lejos, con
  menos nota y menos comentarios. Lo único que aporta de más es el gimnasio y la carta vegetariana del
  restaurante — y vais a cenar fuera las dos noches.


  **Descartad An Bàng como base**, aunque salga en todas las listas. A la playa se va **en bici la tarde
  del día 11**, que es cuando toca, y se vuelve a dormir al río.


  **Y ahora lo que más rendimiento da de todo el bloque: reservad desde la noche del sábado 19, aunque
  esa noche la paséis en el autobús.** El VJ501 os deja aquí **a las ocho de la mañana** y la entrada
  normal es **a las dos de la tarde**. Con la habitación pagada desde la víspera entráis a las ocho, os
  ducháis y dormís dos horas — y el domingo se convierte en un día entero. Sin eso llegáis con una noche
  de bus encima y **seis horas por delante sin sitio donde tumbaros**. Es el medio día más barato que
  vais a comprar en este viaje.


  **Y el encargo del sastre, que con tres noches cabe entero.** Hoi An trabaja **en 24 horas**: encargo
  el domingo por la tarde, prueba el lunes al mediodía, recogida el lunes por la noche o el martes a
  primera hora. Lo que no hay que aceptar nunca es un «os lo mandamos al hotel».
