title: Hoi An, la noche del casco viejo
area: Hoi An · 3 noches (19-22 sep) · llegáis a las 8 de la mañana
status: pendiente
note: "Pagad la noche del 19 aunque no durmáis: llegáis a las 08:00 y la entrada es a las 14:00"
body: >-
  **Antes que nada, la decisión que más rendimiento da de todo el bloque: reservad desde la noche del
  sábado 19, aunque esa noche la paséis en un autobús.** El VJ501 os deja en Hoi An **a las ocho de la
  mañana del domingo** y la entrada normal en cualquier hotel es **a las dos de la tarde**. Con la
  habitación pagada desde la víspera entráis a las ocho, os ducháis y dormís dos horas — y el domingo
  se convierte en un día entero de verdad. Sin eso llegáis con una noche de autobús encima y **seis
  horas por delante sin sitio donde tumbaros**, con las mochilas a cuestas. Una noche de hotel es el
  precio más barato al que vais a comprar medio día en todo el viaje.


  Dicho eso, el criterio es uno por encima de todos: **tiene que estar a pie del casco viejo**. La
  última mañana se sostiene sobre salir a andar **a las cinco y media**, con el pueblo cerrado y vacío,
  y eso solo funciona si se sale por la puerta y ya estáis dentro.


  **Por eso hay que descartar An Bàng como base**, aunque salga en todas las listas. La playa está a
  **cuatro kilómetros**: dormir allí significa depender de un taxi al amanecer, o renunciar a la mejor
  hora que da esta ciudad. A la playa se va **en bici la tarde del 11**, que es cuando toca, y se
  vuelve a dormir al casco viejo.


  **La opción con historia, y es el Atlanta de aquí:** el **Vĩnh Hưng Heritage**, una casa de
  comerciante chino del siglo XIX en plena calle Trần Phú, con la estructura de madera original y
  apenas media docena de habitaciones. No es un hotel con decoración de época: **es la casa**, una de
  las mil que se salvaron porque el río se cegó y nadie tuvo dinero para derribarla. Mismo trato que
  el [Hòa Bình](#hoa-binh) de Hanói —el edificio por delante de la comodidad— y en el centro exacto
  del casco viejo, con lo cual el amanecer del día 12 se hace saliendo por la puerta.


  **La opción de comodidad**, y después de cuatro días de moto y una noche de bus no es un capricho, es
  el **Anantara Hoi An**: pabellones de estilo colonial a la orilla del Thu Bồn, jardín, piscina, y el
  puente japonés a diez minutos andando. Es de lo más caro del viaje y es la única noche en que
  probablemente lo compense.


  **La opción intermedia** son los hoteles de la orilla sur, en **An Hội**, cruzando el puente peatonal:
  piscina, precios de la mitad y el casco viejo a cinco minutos. El **Little Riverside** es el que mejor
  reputación mantiene.


  **Y el encargo del sastre, que ahora sí cabe bien.** Hoi An vive de la sastrería a medida y
  **funciona de verdad, en 24 horas**. Con dos noches el ciclo entra entero: **encargo el domingo por
  la tarde, prueba el lunes al mediodía y recogida el lunes por la noche o el martes a primera hora**.
  Es la diferencia entre una prenda que sienta y una que casi. Lo que no hay que aceptar nunca es un
  «os lo mandamos al hotel».
