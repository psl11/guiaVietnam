note: "An Hội, cruzando el puente peatonal · y pagad la noche del 19 aunque durmáis en el bus"
body: >-
  **Hoi An se anda entero en veinte minutos, así que la pregunta no es «cerca de qué» sino «de qué
  lado del río».** Y con vuestro plan concreto hay respuesta.


  **Las cinco zonas, y cuánto tardáis en el puente japonés desde cada una:**


  **1 · El núcleo peatonal** —Trần Phú, Nguyễn Thái Học, Bạch Đằng—, **0-5 min**. Dormís *dentro* del
  Patrimonio de la Humanidad. Son casas antiguas reconvertidas, con pocas habitaciones y casi nunca
  piscina. Ruido de calle hasta las diez de la noche.


  **2 · An Hội**, la lengua de tierra al otro lado del puente peatonal, **5 min**. Es donde está la
  oferta con piscina, a mitad de precio, y desde donde **se ve el casco viejo iluminado** en vez de
  estar dentro de él.


  **3 · Cẩm Phô**, al norte del casco, **10-15 min andando**. Residencial, tranquilo, barato, sin nada
  en contra salvo que no tiene nada especial a favor.


  **4 · Cẩm Thanh y Cẩm Châu**, entre el pueblo y el mar, **3-4 km**. Arrozales, cocoteros de agua y
  silencio — pero todo se hace en bici o taxi.


  **5 · An Bàng y Cửa Đại**, la playa, **4-5 km**.


  **La respuesta para vosotros es An Hội, y la decide un detalle que no sale en ninguna guía: el casco
  antiguo cierra al tráfico por franjas** —a grandes rasgos de 08:00 a 11:00 y de 14:00 a 21:30—. Y
  vuestras dos puntas caen **justo dentro**: llegáis en taxi desde Đà Nẵng **a las 08:00** del domingo
  y salís **a las 10:30** del martes. Durmiendo en el núcleo, eso son **doscientos o trescientos metros
  andando con las mochilas** en las dos puntas. En An Hội, el taxi para en la puerta.


  A eso se le suma que **la vista buena de los farolillos se tiene desde fuera**: las dos noches que
  pasáis aquí, la postal es el casco viejo encendido reflejado en el Thu Bồn, y eso se ve desde la
  orilla sur, no desde dentro. Y que por el mismo dinero hay **piscina**, que después de cuatro días de
  moto y una noche de autobús no es un adorno.


  **Y el amanecer del día 12 no sufre**: son **cinco minutos** cruzando el puente peatonal. La razón de
  descartar la playa era no depender de un taxi a las cinco y media de la mañana; desde An Hội se va
  andando igual que desde Trần Phú.


  **Un aviso al elegir habitación en An Hội:** la orilla que mira al casco viejo es la del **mercado
  nocturno**, animada hasta las diez y pico. **Pedid habitación que no dé a esa calle** —hacia el
  interior o al canal sur— y tenéis lo mejor de las dos cosas.


  **Y el caso en que sí compensa el núcleo.** Si lo que os apetece es dormir en el edificio y no en el
  hotel, la casa es el **Vĩnh Hưng Heritage**: una vivienda de comerciante chino del siglo XIX en plena
  Trần Phú, con la estructura de madera original y media docena de habitaciones. Es el
  [De Syloia](#de-syloia) de aquí — el edificio por delante de la comodidad. Con dos mochilas de cabina,
  los trescientos metros a pie de las dos puntas son un no-problema, así que **es una elección legítima
  y no un error**: solo hay que saber lo que se cambia.


  **Y la preselección, medida contra todo lo anterior.** Los cuatro salen por lo mismo —**unos 100-150 €
  las dos noches**—, así que el precio no decide nada y decide la ubicación:


  - **Chillax Old Town Villa** — *18 Ngô Quyền, An Hội* · **450 m** del puente japonés · 8,0 (401). **Es
    exactamente lo que pide esta ficha**: An Hội, y **una calle por detrás del mercado nocturno**, o sea
    sin el ruido de la orilla. Todo andando, taxi a la puerta y el amanecer sin bici.
  - **Nolia Hoi An** *(antes Soluna D'Annam)* — **1,7 km** · **9,6** (315) · **dos piscinas, una en
    azotea**, spa y bicis gratis. Con diferencia el mejor hotel de los cuatro y por el mismo dinero. Lo
    que cuesta es el kilómetro y medio: el amanecer del día 12 pasa a ser **un trayecto en bici a
    oscuras**, y las dos noches de farolillos, dos vueltas más.
  - **Hoianan Boutique** — *15A Nguyễn Hoàng, An Hội* · 350 m · 8,0 (827). Buena zona pero **está en la
    calle del mercado nocturno**, justo la que esta ficha dice que hay que evitar para la habitación. Si
    fuera este, **exigid habitación al interior**.
  - **Old Town Hotel** *(antes Thien Thanh)* — *Bà Triệu, Cẩm Phô* · 700 m · 8,0 (1.063). Correcto y sin
    nada en contra, pero tampoco nada a favor frente al Chillax, que está más cerca y mejor situado.


  **El veredicto: Chillax**, por coherencia con todo lo de arriba. El Nolia es objetivamente mejor hotel
  y la tentación es real —9,6 contra 8,0, y piscina en azotea después de cuatro días de moto—, pero
  **este plan cruza el casco viejo cuatro veces: dos noches de farolillos, un amanecer y la mañana de la
  salida**. Convertir eso en cuatro trayectos de kilómetro y medio, uno de ellos a las cinco y media de
  la mañana, es la clase de fricción que acaba en «mejor lo dejamos» — y lo que se dejaría es el
  amanecer, que es lo mejor que da esta ciudad.


  *(Si aun así tiráis por el Nolia, es defendible con una condición: **usad sus bicis** y asumid el
  madrugón. Son siete minutos y Hoi An es completamente llana. Y de propina, el Nolia queda **en la
  dirección de Trà Quế**, así que la ruta en bici del día 11 empieza más cerca.)*


  **Y una cosa de la búsqueda que hay que corregir: las fechas son 20-22, o sea dos noches.** Vuelve a
  leer el párrafo de abajo — **la reserva tiene que empezar el 19**.


  **Descartad An Bàng como base**, aunque salga en todas las listas. A la playa se va **en bici la tarde
  del día 11**, que es cuando toca, y se vuelve a dormir al río.


  **Y ahora lo que más rendimiento da de todo el bloque: reservad desde la noche del sábado 19, aunque
  esa noche la paséis en el autobús.** El VJ501 os deja aquí **a las ocho de la mañana** y la entrada
  normal es **a las dos de la tarde**. Con la habitación pagada desde la víspera entráis a las ocho, os
  ducháis y dormís dos horas — y el domingo se convierte en un día entero. Sin eso llegáis con una noche
  de bus encima y **seis horas por delante sin sitio donde tumbaros**. Es el medio día más barato que
  vais a comprar en este viaje.


  **Y el encargo del sastre, que con tres noches cabe entero.** Hoi An trabaja **en 24 horas**: encargo
  el domingo por la tarde, prueba el lunes al mediodía, recogida el lunes por la noche o el martes a
  primera hora. Lo que no hay que aceptar nunca es un «os lo mandamos al hotel».
