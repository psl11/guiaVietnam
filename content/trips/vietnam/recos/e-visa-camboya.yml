note: "Camboya e-visa ~36 US$ · Vietnam: DOS tarjetas de llegada digitales (11 y 24 sep)"
body: >-
  **Vietnam:** **sin e-visa** (exención de 45 días para España; pasaporte válido hasta marzo 2027).
  **Pero desde el 15 de junio de 2026 es obligatoria la Tarjeta de Llegada Digital** —también para los
  exentos de visado—: es **gratis**, en la web **oficial** prearrival.immigration.gov.vn, se rellena en
  las **72 horas antes** de volar y genera un **QR** que se guarda para inmigración. Ojo con los clones
  de pago; la oficial es gratuita.


  **Y ojo, que con Saigón dentro entráis dos veces en Vietnam**: salís el 22 hacia Camboya y volvéis el
  24 aterrizando en Saigón. Está cubierto —la exención española es de **entradas múltiples y ya no
  exige intervalo mínimo** entre estancias; la vieja regla de los 30 días se eliminó, y la exención
  sigue vigente hasta **marzo de 2028**—, pero tiene dos consecuencias prácticas: hacen falta **dos
  tarjetas de llegada digitales, no una** (antes del vuelo del 11 y antes del **K6 828 del 24**), y el
  pasaporte necesita **dos páginas en blanco**.


  **Camboya:** **e-visa en agosto**, solo en la web **oficial** (evisa.gov.kh) —hay clones que cobran el
  doble—; cuesta **~36 US$** (30 de visado + ~6 de gestión). Y del **15 al 21 de septiembre**, la
  **e-Arrival Card** de Camboya (gratis, en arrival.gov.kh; otro QR que guardar). Comprobad además que
  los pasaportes valgan **6 meses** desde la entrada.
