note: "Seis cosas que no se reservan desde casa y son justo las que se olvidan"
body: >-
  Todo lo demás del tablero se cierra antes de salir. **Esto no**: son encargos de un día para otro que
  hay que hacer estando allí, y por eso son los que se caen. Van en orden cronológico.


  **1 · La furgoneta a Tam Cốc** *(la víspera del día 4)*. La *limousine van* que recoge en el hotel del
  casco viejo y deja en la puerta del alojamiento sale casi cada hora, pero **se reserva el día antes**.
  Lo hace el propio hotel. Ver [Ninh Bình](#tam-coc).


  **2 · El taxi hasta el autobús** *(la víspera del día 5)*. Dormís en Tam Cốc y el bus a Hà Giang sale
  de **Đồng Gừng, en la ciudad**, a siete u ocho kilómetros. A las ocho de la tarde no se improvisa un
  coche desde allí: **dejadlo hablado con el alojamiento**. Ver [los buses cama](#traslado-ha-giang).


  **3 · El baño de hierbas de Nậm Đăm** *(al llegar, el día 8)*. Hervir las cien y pico plantas del
  ***tắm lá thuốc*** lleva **dos horas**, así que se encarga **nada más entrar por la puerta del
  homestay**, no después de cenar. Si se pide con la cena, el agua no está hasta las once.


  **4 · Facturar el vuelo a Đà Nẵng** *(la noche del día 9)*. Con el wifi del hotel de Hà Giang, antes
  de subir al bus cama. El **VJ501 sale a las 05:40** y el autobús llega entre las tres y las cuatro:
  con las tarjetas de embarque ya en el móvil, el mostrador deja de importar. Ver
  [los vuelos a Hoi An](#vuelos-hoi-an).


  **5 · El desayuno de caja de Siem Reap** *(la víspera del día 13)*. Salís del hotel a las **04:45**
  hacia el amanecer del equinoccio, mucho antes de que abra el bufé. Casi todos los hoteles lo preparan
  si se avisa. Y de paso, **confirmad con el guía que os recoge en Angkor Wat y no en el hotel**.


  **6 · El sastre de Hoi An** *(la tarde del día 10, si os tienta)*. Trabajan **en 24 horas** y con dos
  noches el ciclo entra entero: encargo el domingo por la tarde, prueba el lunes al mediodía, recogida
  el lunes por la noche. Fuera de esa ventana, mejor no empezar. Ver
  [el hotel de Hoi An](#hoi-an-hotel).
