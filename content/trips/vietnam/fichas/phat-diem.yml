title: La catedral de Phát Diệm
epithet: >-
  Una catedral católica construida como una pagoda vietnamita — y el campanario desde el que
  **Graham Greene** miró la guerra antes de escribir *El americano impasible*.
sections:
  - heading: Una catedral que no parece una catedral
    body: |
      A **26 km al sureste de Ninh Bình** hay un complejo religioso que no se parece a nada más en
      Vietnam: **Phát Diệm** (1891), una catedral católica levantada deliberadamente **con la gramática
      de la arquitectura sinovietnamita**. Nada de nave gótica: madera, techumbre curvada, patios y un
      campanario exento de piedra —el **Phương Đình**— con las **columnas talladas imitando cañas de
      bambú**.

      Dentro, el interior es casi todo de madera, con la bóveda sostenida por columnas enormes. Sobre
      el altar revolotea un enjambre de **querubines de rasgos vietnamitas con alas doradas**, y por el
      techo azul cruzan **nubes de estilo chino**. Bajo ellas, los iconos de los **mártires ejecutados
      por el emperador Tự Đức** en las purgas de católicos de la década de 1850 — porque esta es una
      iglesia construida por una comunidad que acababa de ser perseguida.
  - heading: El campanario de Graham Greene
    body: |
      Phát Diệm es el motivo por el que esta esquina de Ninh Bình sale en la literatura. Durante la
      época colonial fue **el centro del catolicismo vietnamita**, y el obispo llegó a gobernar la
      región **con ejército propio** hasta que el ejército francés se hizo con la zona en **1951**.

      Ese mismo año **Graham Greene** estuvo aquí y **miró los combates entre franceses y Việt Minh
      desde el campanario**. Phát Diệm acabó siendo uno de los escenarios de [***El americano
      impasible***](https://www.goodreads.com/book/show/3698.The_Quiet_American), la novela que ya
      lleváis puesta desde el martini del [Metropole](#metropole) — así que aquí no se visita un
      monumento, se pisa una página.

      En la base del campanario hay **dos losas enormes**, puestas para que los mandarines pudieran
      sentarse a mirar los ritos de la misa católica. Ese detalle resume el sitio entero.
  - heading: Cómo encaja (y si compensa)
    body: |
      **Es una alternativa, no un imprescindible.** Son 26 km desde Ninh Bình (autobuses directos,
      ~1 h) y se lleva **media jornada**, así que en el [día 5](#dia-5-hang-mua) compite de tú a tú con
      **Hoa Lư + Vân Long** — y el bus cama solo ha liberado un día, no dos.

      El criterio: si lo que os tira es **el karst y la fauna**, quedaos con el plan de Vân Long. Si lo
      que os tira es **el icono con historia detrás** —y Greene ya está en el viaje—, Phát Diệm es la
      pieza que Ninh Bình no tiene en ningún otro sitio. Entre la catedral y el campanario está la
      tumba del **padre Six (Trần Lục)**, que lo mandó construir. Misas diarias a las **5:00 y 17:00**.
curiosidades:
  - >-
    En la base del campanario hay **dos losas de piedra puestas para que los mandarines se sentaran a
    observar la misa católica**. La catedral está construida, literalmente, para ser mirada desde el
    protocolo confuciano.
  - >-
    El obispo de Phát Diệm **gobernó la región con un ejército privado** hasta 1951 — un estado
    católico en miniatura dentro de la Indochina francesa.
  - >-
    Sobre el altar vuelan **querubines con cara vietnamita y alas de oro**, bajo un techo azul con
    **nubes chinas**. El catolicismo aquí no se importó: se tradujo.
