epithet: >-
  No es una excursión de un día: son **cuatro jornadas en moto** dando la vuelta al altiplano kárstico
  de *Đồng Văn*, en el extremo norte de Vietnam, pegados a la frontera china. No se viene a *ver* el
  karst — se viene a *atravesarlo*.
sections:
  - heading: Qué es, exactamente
    body: |
      El loop es una **ruta circular de unos 370 km** que sale y vuelve a la ciudad de **Hà Giang**,
      trepando desde el valle al altiplano de Đồng Văn y bajando por el gran cañón. Y una aclaración que
      lo cambia todo: **vosotros no conducís**. Vais detrás de un **easy rider**, el piloto local que
      hace de conductor *y* de guía durante los cuatro días — una plaza cada uno, a vuestro ritmo (el
      formato lo decide [la ficha de inversión](#loop-ha-giang): privado, no jeep, no grupo de diez
      motos). Estáis en la provincia más montañosa y remota del país, donde **los kinh —el 85 % de
      Vietnam— son minoría** y mandan las etnias de montaña. Como el trazado roza la frontera, hace
      falta un **permiso de zona fronteriza** que tramita el operador; el pasaporte, siempre encima.
  - heading: Por qué se hace
    body: |
      Por dos cosas, y ninguna es el arroz. La primera, **el paisaje más espectacular de Vietnam**:
      pináculos grises hasta el horizonte, el cañón del **Nho Quế** verde jade y, como plato fuerte, el
      paso de **Mã Pí Lèng** tallado en el flanco de la garganta con el río **800 metros más abajo**. La
      segunda, **las minorías viviendo su vida** —hmong, dao, lô lô, tày— en sus aldeas y sus mercados,
      no en un espectáculo montado para el visitante. Y todo converge en Mã Pí Lèng, que es **el motivo
      mismo del loop**: desde la ventanilla de un coche es una postal; en la moto, con el vacío a un
      palmo, es *la experiencia*. Por eso no se va a Hà Giang a ver el karst — se va a cruzarlo.
  - heading: El arco de los cuatro días
    body: |
      Y aquí una decisión que conviene entender, porque va contra el catálogo: **este loop se hace al
      revés**. La mayoría sube por la QL4C hacia Đồng Văn el primer día y baja por el este el último;
      vosotros hacéis lo contrario. El orden queda así: **Du Già** (el único valle con arroz en terraza)
      → **Mèo Vạc**, **Mã Pí Lèng** y el cañón del **Nho Quế**, para dormir en **Đồng Văn** → la torre
      de **Lũng Cú** en el extremo norte, la aldea lô lô y el índigo de **Lũng Tám**, con noche en
      **Nậm Đăm** → y la bajada por la **Puerta del Cielo** de Quản Bạ y el paso de **Bắc Sum**.

      **Girarlo tiene tres premios reales.** El primero: os cruzáis con el grueso de los grupos **de
      frente** en vez de ir en su cola, y en Mã Pí Lèng eso se nota. El segundo: el paso cae **a última
      hora de la tarde** del segundo día, con luz rasante en el cañón, y no a media mañana con el sol
      plano. El tercero, y el que más se agradece: **el baño de hierbas dao de Nậm Đăm cae la tercera
      noche** y no la primera — o sea, cuando el cuerpo lleva tres días de moto y de verdad lo necesita.

      **Y lo que cuesta, dicho sin rodeos: el mercado dominical de Mèo Vạc.** El
      [gran chợ phiên](#mercado-meo-vac) del altiplano es **solo los domingos** y este loop cruza Mèo Vạc
      **en jueves**. No es un descuido: con el vuelo a Camboya cerrado el martes 22, no existía ninguna
      combinación de cuatro días que lo pillara. Se cambió esa mañana por **dos días enteros de viaje**,
      que son los que han hecho posible Hoi An.
curiosidades:
  - >-
    La **«carretera de la Felicidad»** —los 200 km de la QL4C que vertebran el loop— se abrió a mano
    entre **1959 y 1965**: miles de trabajadores de las minorías del norte picando la caliza con mazo y
    cincel, descolgados con cuerdas sobre el vacío. Los seis kilómetros del tramo de Mã Pí Lèng se
    llevaron **once meses** ellos solos.
  - >-
    El loop se elige por el **karst y el cañón, no por el arroz**: la meseta de Đồng Văn es paisaje
    kárstico *mineral* —roca gris, maíz entre piedras—, no las terrazas doradas de postal (esas están en
    Hoàng Su Phì, fuera del loop, y no caben sin sacrificar Ninh Bình).
  - >-
    En temporada alta entran unos **3.000 motoristas extranjeros a la semana**, pero septiembre no es
    pico: entre semana el altiplano está razonablemente calmado. Los puntos que sí se masifican son
    contados — el Skywalk de Mã Pí Lèng, la torre de Lũng Cú y la Puerta del Cielo a la hora dorada.
