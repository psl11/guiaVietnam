title: Vietnam en vivo — marionetas, ca trù y trance
epithet: >-
  Tres artes vivas del delta del río Rojo que no están en ningún museo: se ven de noche, en salas
  pequeñas, y son lo más parecido a viajar mil años sin salir de Hanói.
sections:
  - heading: Las marionetas de agua
    body: |
      El *múa rối nước* nació hace un milenio en los arrozales inundados del delta: los titiriteros,
      ocultos tras una cortina y metidos hasta la cintura en el agua, manejan con varas largas unas
      marionetas de madera lacada que **bailan sobre la superficie de una piscina**, entre dragones
      que escupen fuego y campesinos que plantan arroz. Nació como diversión de aldea inundada y hoy se
      representa en sala, con orquesta en vivo y el **đàn bầu** —la cítara de una sola cuerda, capaz de
      imitar la voz humana— llevando la melodía. Dónde verlo y cómo sentarse, en el
      [**Teatro Thăng Long**](#teatro-thang-long).
  - heading: El ca trù — la gema
    body: |
      El canto de cámara de la corte y las casas de té, hoy en la lista de la UNESCO de patrimonio que
      **necesita salvaguarda urgente**: una cantante que marca el compás con unas castañuelas de bambú
      (*phách*), un laúd de tres cuerdas y un tambor de elogio que **toca el público** para aprobar un
      verso. Es lo contrario del espectáculo para autobuses: veinte o cuarenta personas en una casa
      comunal. **Esta es la gema de las tres** — y se escucha en [**Hàng Bạc**](#ca-tru-hang-bac).
  - heading: El trance — hầu đồng / Đạo Mẫu
    body: |
      La tercera no se programa: es un rito. El **hầu đồng** del culto a las Diosas Madres —explicado en
      [*el tam giáo*](#tam-giao)— ocurre en templos como el [Phủ Tây Hồ](#phu-tay-ho) sin calendario
      público, así que verlo es cuestión de suerte y de estar en el sitio correcto. Para quien no la
      tenga, hay una versión escénica solvente, **«Tứ Phủ» (Cuatro Palacios)**: conviene comprobar si
      sigue en cartel.
curiosidades:
  - >-
    Los titiriteros de las marionetas de agua manejan las figuras **metidos hasta la cintura en el
    agua**, ocultos tras una cortina, con varas largas por debajo de la superficie.
  - >-
    El **đàn bầu**, la cítara de **una sola cuerda** que acompaña a las marionetas, se toca doblando una
    varilla flexible para estirar la nota: es el instrumento que más se parece a una voz humana.
  - >-
    En el ca trù, el público toca un **tambor de elogio** para aprobar un verso en directo: la crítica
    se hace con las manos, en tiempo real.
