title: Vietnam en vivo — marionetas, ca trù y trance
epithet: >-
  Tres artes vivas del delta del río Rojo que no están en ningún museo: se ven de noche, en salas
  pequeñas, y son lo más parecido a viajar mil años sin salir de Hanói.
sections:
  - heading: Las marionetas de agua
    body: |
      La única de las tres que nació **del agua y no de la corte**: hace un milenio, en los arrozales
      inundados del delta, cuando la crecida convertía el campo en escenario y no había otra cosa que
      hacer. Es la más antigua y la más popular, y la que peor le sienta el prejuicio: suena a
      espectáculo infantil y es un oficio de mil años que todavía se transmite en talleres familiares.

      Hoy se representa en sala, con orquesta en vivo y el **đàn bầu** —la cítara de una sola cuerda,
      capaz de imitar la voz humana— llevando la melodía. Y hay un detalle que cambia lo que se
      escucha: lo que canta esa orquesta es ***chèo***, **la ópera popular del delta del río Rojo**.
      Así que en la misma hora se ven dos artes, no una — las marionetas son el cuerpo y el chèo es la
      voz. **Cómo funciona por dentro, dónde sentarse y qué mirar**, en el [**Teatro Thăng
      Long**](#teatro-thang-long).
  - heading: El ca trù — la gema
    body: |
      El canto de cámara de la corte y de las casas de té, y **la única de las tres que la UNESCO ha
      metido en la lista de patrimonio en peligro**: llegó a quedar en un puñado de maestras vivas
      después de que el régimen lo asociara al lujo feudal y lo dejara morir cuarenta años.

      Es lo contrario del espectáculo para autobuses: veinte o cuarenta personas en una casa comunal,
      tres músicos y ninguna concesión. **Esta es la gema de las tres.** Qué se toca, qué hace el
      público y por qué es tan raro oírlo, en [**Hàng Bạc**](#ca-tru-hang-bac).
  - heading: El trance — hầu đồng / Đạo Mẫu
    body: |
      La tercera no se programa: es un rito. El **hầu đồng** del culto a las Diosas Madres —explicado en
      [*el tam giáo*](#tam-giao)— ocurre en templos como el [Phủ Tây Hồ](#phu-tay-ho) sin calendario
      público, así que verlo es cuestión de suerte y de estar en el sitio correcto. Para quien no la
      tenga, hay una versión escénica solvente, **«Tứ Phủ» (Cuatro Palacios)**: conviene comprobar si
      sigue en cartel.
curiosidades:
  - >-
    Los titiriteros de las marionetas de agua manejan las figuras **metidos hasta la cintura en el
    agua**, ocultos tras una cortina, con varas largas por debajo de la superficie.
  - >-
    El **đàn bầu**, la cítara de **una sola cuerda** que acompaña a las marionetas, se toca doblando una
    varilla flexible para estirar la nota: es el instrumento que más se parece a una voz humana.
  - >-
    En el ca trù, el público toca un **tambor de elogio** para aprobar un verso en directo: la crítica
    se hace con las manos, en tiempo real.
