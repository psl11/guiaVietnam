slug: vietnam
eyebrow: Vietnam y Camboya · 2026
title: Del *río Rojo* a los templos de Angkor
heroMeta: 11 — 26 de septiembre de 2026
lede: >-
  Dieciséis días de Hanói al altiplano del norte, un salto a los templos de Angkor y un final en
  Saigón. La guía va en dos tiempos: primero **el plan** —qué hacer cada día, dónde dormir, qué
  reservar—; después, **el porqué** —la cultura y la historia que dan sentido a cada parada.
rationale: |
  Vietnam mide mil seiscientos kilómetros de punta a punta: son casi tres países en uno, y dieciséis
  días —dos de ellos ya en Camboya— no alcanzan para verlo, sino para **elegir bien una rebanada**.
  Este itinerario renuncia al clásico «Hanói–Hoi An–Saigón» de los primerizos —amplio, plano y por los
  sitios más trillados— y apuesta por lo contrario: **casi todo el peso en un solo Vietnam**, el del
  norte hondo, cosido a los templos de [Angkor](#angkor), que son el techo de toda la civilización de
  la región. Y al final, **dos días en Saigón** — no para tachar la ciudad, sino porque hay dos cosas
  que solo se cierran allí, y se cuentan más abajo.

  Por eso el eje es el **norte**: la densidad de Hanói, el karst brotando de los arrozales de Ninh Bình
  y, sobre todo, las montañas de **[Hà Giang](#el-loop)** — que no son un premio de consolación por
  saltarse Sapa, sino su versión mejor. Sapa es hoy lo que Hà Giang todavía no: teleférico, hoteles de
  hormigón y autobuses de excursión. Ir allí sería cambiar a peor. Aquí se cruza el paso de Mã Pí Lèng
  sobre la moto y se madruga para el mercado de Mèo Vạc — la montaña del norte sin decorado.

  **Y falta responder a la pregunta que os van a hacer todos: ¿y la bahía de Hạ Long?** Queda fuera, y
  no por esnobismo. Son **dos de los dieciséis días** —tres horas y media de bus por sentido más un
  crucero de una noche— gastados en el sitio más masificado del país, con quinientos barcos casi
  idénticos vendiendo el mismo paquete. Pero el argumento que de verdad decide es el mismo que tumba
  a Hoi An: **en septiembre las autoridades de Quảng Ninh suspenden la navegación cada vez que entra
  un tifón**, y la bahía cierra. Reservarla en estas fechas es apostar dos días a que no haya
  temporal. Ninh Bình es **el mismo macizo kárstico** —la misma caliza, levantada del mismo mar— visto
  desde una barca de remos entre arrozales, y no se cancela por viento. Si alguien aun así quiere agua
  salada, la versión honesta no es Hạ Long sino **Lan Hạ, desde Cát Bà**: mismas rocas, una fracción
  de los barcos.


  **Y conviene decir en qué consiste exactamente el cambio, porque no es «no cabe»: cabe.** Un crucero
  de 2 días / 1 noche sale de Hanói a las ocho de la mañana y devuelve a media tarde del día
  siguiente, así que ocuparía **los días 4 y 5** — y desde Hanói se enlazaría esa misma noche con el
  bus cama a Hà Giang, sin tocar el loop ni Camboya. El precio es exacto y es **Ninh Bình entera**:
  Tràng An, Hang Múa, Bích Động, Hoa Lư y Vân Long, porque están en dirección contraria y no se pueden
  partir. Dos días de mar contra dos días y medio de tierra. La recomendación sigue siendo quedarse
  con Ninh Bình, y no solo por el riesgo de tifón: es que **sería la tercera ración del mismo karst**
  —después del de Ninh Bình y el de Đồng Văn— y la única que se puede cancelar por megafonía.

  **Y una decisión que se tomó tarde y cambió el final: Saigón entra.** Durante meses el plan lo
  descartaba —el sur es otro Vietnam y pide un viaje propio—, hasta que aparecieron dos argumentos que
  no se podían responder. El primero: en Hanói se visita [Hỏa Lò](#hoa-lo) y el
  [B-52 del lago](#lago-b52), que es **la guerra contada por quien la ganó**; el Museo de los Vestigios
  y el Palacio de la Reunificación son el otro lado del espejo, y sin ellos el viaje cuenta media
  guerra. El segundo: la guía lleva a **Graham Greene** cosido desde el primer día —el martini del
  [Metropole](#metropole), el campanario de [Phát Diệm](#phat-diem)— y *El americano impasible* **no
  transcurre en el norte: transcurre en la rue Catinat de Saigón**. Faltaba el tercer vértice.

  Se paga con **dos días de Hanói**, que baja a tres: el 12, el 13 y el 21. Es un precio real y está
  dicho en [el día 11](#dia-11-hanoi-vuelta). **Hoi An**, la única ausencia
  que de verdad escuece a un fotógrafo, cae de lleno en la **temporada de tifones e inundaciones del
  centro** justo en estas fechas: son las propias lluvias de septiembre las que la desaconsejan, antes
  aún que los setecientos kilómetros de por medio. Quedan también, en la lista del viaje siguiente y no en la de los
  descuidos: **Cao Bằng, la catarata de Bản Giốc y el lago de Ba Bể**, que son el otro loop del norte
  —el del nordeste— y piden sus propios cuatro días; **Phong Nha**, con las cuevas más grandes del planeta, que cae en el mismo
  centro inundable que Hoi An; y **el tercer día de Angkor** —Beng Mealea, Koh Ker, los templos de
  Roluos—, que existiría si Camboya fuese el viaje y no su remate.

  **Y hay una forma de comprobar todo esto con números, porque la pregunta va a llegar.** Si se coge
  la lista de «las 20 mejores experiencias» de la guía Lonely Planet de Vietnam y se cruza con este
  itinerario, salen **ocho de veinte** —Ciudad Ho Chi Minh entró al final— y suena a poco hasta que se
  mira dónde están las otras doce. **Seis siguen en el sur** (Mui Ne, Nha Trang, Dalat, Phu Quoc, Con
  Dao, Cat Tien), a mil y pico kilómetros. **Tres están en el centro** (Hoi An, Huế, Phong Nha), en plena
  temporada de inundaciones estas semanas. O sea que **nueve de los veinte quedan fuera del recorrido**: no se dejan de ver, es que están a la distancia que separa Madrid de
  Varsovia.

  De los **once que sí caen en el recorrido, el viaje hace ocho**: la comida, Angkor Wat, Ciudad Ho Chi
  Minh, el Barrio Antiguo de Hanói, la hora del café, la *bia hơi*, los mercados étnicos y el norte
  sobre ruedas. Los tres que faltan están argumentados aquí arriba — Sapa, Hạ Long y el lago de Ba Bể.

  Y conviene saber qué **no** contiene esa lista: ni el paso de **Mã Pí Lèng**, ni el cañón del **Nho
  Quế**, ni el mercado dominical de **Mèo Vạc**, ni **Tràng An** —patrimonio mixto de la UNESCO, una
  categoría rarísima—, ni el **Trung Thu**. Este viaje hace los cinco. Es una lista de lo *famoso*,
  no de lo bueno, y su propia guía se contradice: en el capítulo del norte llama a Hà Giang «la nueva
  frontera de los viajes por Vietnam» y le atribuye «algunos de los paisajes más espectaculares del
  Sudeste Asiático» — y aun así no la metió entre los veinte.

  Al final no importa cuánto Vietnam cabe en dieciséis
  días, sino cuánto se entiende de lo que se ve: **mejor un trozo hasta el tuétano que el país entero
  de pasada.**
