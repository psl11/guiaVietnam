slug: vietnam
eyebrow: Vietnam y Camboya · 2026
title: Del *río Rojo* a los templos de Angkor
heroMeta: 11 — 26 de septiembre de 2026
lede: >-
  Dieciséis días de Hanói al altiplano del norte, con parada en Hoi An, un salto a los templos de
  Angkor y un final en Saigón. La guía va en dos tiempos: primero **el plan** —qué hacer cada día, dónde dormir, qué
  reservar—; después, **el porqué** —la cultura y la historia que dan sentido a cada parada.
rationale: |
  Vietnam mide mil seiscientos kilómetros de punta a punta: son casi tres países en uno, y dieciséis
  días —cuatro de ellos ya en Camboya— no alcanzan para verlo, sino para **elegir bien**. Y conviene
  decir en qué consiste la elección, porque el itinerario cambió de forma sobre la marcha y acabó en un
  sitio distinto del que salió.

  **La tesis, ahora que está cerrado: se hace la ruta clásica en sus porciones mínimas, y con lo que se
  ahorra ahí se pagan las dos cosas que la ruta clásica nunca hace.** Hanói, Hoi An y Saigón están —los
  tres— pero medidos al centímetro: dos días de Hanói, dos de Hoi An, dos de Saigón. Lo que
  sobra se va entero a **[Hà Giang](#el-loop)**, cuatro días en moto por el altiplano de la frontera
  china, y a **[Angkor](#angkor)**, que es el techo de toda la civilización de la región. Un viaje que
  se limitara a lo primero sería el de cualquiera; uno que renunciara a lo primero por completo dejaría
  fuera el país donde se aterriza.

  El eje sigue siendo el **norte**: la densidad de Hanói, el karst brotando de los arrozales de Ninh
  Bình y, sobre todo, las montañas de Hà Giang — que no son un premio de consolación por saltarse Sapa,
  sino su versión mejor. Sapa es hoy lo que Hà Giang todavía no: teleférico, hoteles de hormigón y
  autobuses de excursión. Aquí se cruza el paso de Mã Pí Lèng sobre la moto — la montaña del norte sin
  decorado.

  **Y el loop se acortó a cuatro días, que es la decisión que hizo posible todo lo demás.** Durante
  meses fueron cinco, diseñados hacia atrás desde una sola mañana: **el mercado dominical de
  [Mèo Vạc](#mercado-meo-vac)**, el latido social del altiplano una vez por semana. Con el vuelo a
  Camboya cerrado el martes 22, mantenerlo obligaba a terminar en domingo — y eso dejaba **día y medio**
  para todo lo que viniera después. Se cambió esa mañana por **dos días enteros**, y con esos dos días
  entró Hoi An. Es la renuncia más cara del viaje y está contada donde toca: no fue un descuido, fue
  una compra.

  **Y falta responder a la pregunta que os van a hacer todos: ¿y la bahía de Hạ Long?** Queda fuera, y
  no por esnobismo. Son **dos de los dieciséis días** —tres horas y media de bus por sentido más un
  crucero de una noche— gastados en el sitio más masificado del país, con quinientos barcos casi
  idénticos vendiendo el mismo paquete. Pero el argumento que de verdad decide es el calendario: **en
  septiembre las autoridades de Quảng Ninh suspenden la navegación cada vez que entra un tifón**, y la
  bahía cierra. Reservarla en estas fechas es apostar dos días a que no haya temporal. Ninh Bình es
  **el mismo macizo kárstico** —la misma caliza, levantada del mismo mar— visto desde una barca de
  remos entre arrozales, y no se cancela por viento. Si alguien aun así quiere agua salada, la versión
  honesta no es Hạ Long sino **Lan Hạ, desde Cát Bà**: mismas rocas, una fracción de los barcos.

  **Y conviene decir en qué consiste exactamente el cambio, porque no es «no cabe»: cabe.** Un crucero
  de 2 días / 1 noche sale de Hanói a las ocho de la mañana y devuelve a media tarde del día siguiente,
  así que ocuparía **los días 4 y 5**. El precio es exacto y es **Ninh Bình entera**: Tràng An, Hang
  Múa, Bích Động, Hoa Lư y Vân Long, porque están en dirección contraria y no se pueden partir. Dos días
  de mar contra dos días y medio de tierra. La recomendación sigue siendo quedarse con Ninh Bình, y no
  solo por el riesgo de tifón: es que **sería la tercera ración del mismo karst** —después del de Ninh
  Bình y el de Đồng Văn— y la única que se puede cancelar por megafonía.

  **Las dos decisiones que se tomaron tarde y cambiaron el final: Saigón y Hoi An.**

  Saigón entró primero, y por dos argumentos que no se podían responder. El primero: en Hanói se visita
  [Hỏa Lò](#hoa-lo) y el [B-52 del lago](#lago-b52), que es **la guerra contada por quien la ganó**; el
  Museo de los Vestigios y el Palacio de la Reunificación son el otro lado del espejo, y sin ellos el
  viaje cuenta media guerra. El segundo: la guía lleva a **Graham Greene** cosido desde el primer día
  —el martini del [Metropole](#metropole), el campanario de [Phát Diệm](#phat-diem)— y *El americano
  impasible* **no transcurre en el norte: transcurre en la rue Catinat de Saigón**. Faltaba el tercer
  vértice.

  [**Hoi An**](#hoi-an) entró después, cuando el loop se acortó. Y aquí conviene ser honesto con lo que
  antes decía esta misma página: **el argumento del tifón, aplicado a Hoi An, estaba exagerado**. El
  centro se inunda de verdad **de mediados de octubre a mediados de noviembre**, cuando el Thu Bồn se
  desborda sobre el casco viejo; a finales de septiembre llueve —doscientos y pico milímetros al mes,
  casi siempre en chaparrón de tarde— pero la ciudad funciona. Lo que de verdad la dejaba fuera eran los
  setecientos kilómetros, y esos los resuelve un vuelo de hora y veinte. Lo que se gana es
  **el único sitio de Vietnam donde el siglo XVII sigue en pie**: mil edificios intactos porque el
  puerto se cegó, el comercio se fue a Đà Nẵng y no hubo dinero para derribar nada.

  Se paga con **Hanói, que baja a dos días enteros y un mordisco**. Es un precio real y está dicho en
  [el día 12](#dia-12-siem-reap): del último día en la capital solo queda un paso por el B-52 del lago y
  el memorial de McCain, de camino al aeropuerto — y aun eso, solo si el vuelo de Đà Nẵng llega en hora.
  Caen del plan la cena de phở cuốn en Ngũ Xã y el club de jazz, que pasan a ser alternativas de las dos
  primeras noches.

  Quedan en la lista del viaje siguiente, y no en la de los descuidos: **Cao Bằng, la catarata de Bản
  Giốc y el lago de Ba Bể**, que son el otro loop del norte —el del nordeste— y piden sus propios cuatro
  días; **Huế**, la capital imperial, a solo tres horas de Hoi An y aun así fuera; **Phong Nha**, con
  las cuevas más grandes del planeta; y **el tercer día de Angkor** —Beng Mealea, Koh Ker, los templos
  de Roluos—, que existiría si Camboya fuese el viaje y no su remate.

  **Y hay una forma de comprobar todo esto con números, porque la pregunta va a llegar.** Si se coge la
  lista de «las 20 mejores experiencias» de la guía Lonely Planet de Vietnam y se cruza con este
  itinerario, salen **nueve de veinte** —Ciudad Ho Chi Minh y Hoi An entraron los últimos— y suena a
  poco hasta que se mira dónde están las otras once. **Seis siguen en el sur** (Mui Ne, Nha Trang,
  Dalat, Phu Quoc, Con Dao, Cat Tien), a mil y pico kilómetros. **Dos están en el centro** (Huế y Phong
  Nha). O sea que **ocho de los veinte quedan fuera del recorrido**: no se dejan de ver, es que están a
  la distancia que separa Madrid de Varsovia.

  De los **doce que sí caen en el recorrido, el viaje hace nueve**: la comida, Angkor Wat, Ciudad Ho Chi
  Minh, el Barrio Antiguo de Hanói, la hora del café, la *bia hơi*, los mercados étnicos, el norte sobre
  ruedas y Hoi An. Los tres que faltan están argumentados aquí arriba — Sapa, Hạ Long y el lago de Ba
  Bể.

  Y conviene saber qué **no** contiene esa lista: ni el paso de **Mã Pí Lèng**, ni el cañón del **Nho
  Quế**, ni **Tràng An** —patrimonio mixto de la UNESCO, una categoría rarísima—, ni el **Trung Thu**.
  Este viaje hace los cuatro. Es una lista de lo *famoso*, no de lo bueno, y su propia guía se
  contradice: en el capítulo del norte llama a Hà Giang «la nueva frontera de los viajes por Vietnam» y
  le atribuye «algunos de los paisajes más espectaculares del Sudeste Asiático» — y aun así no la metió
  entre los veinte.

  Al final no importa cuánto Vietnam cabe en dieciséis días, sino cuánto se entiende de lo que se ve:
  **mejor pocos sitios hasta el tuétano que el país entero de pasada.**
