slug: dia-14-angkor-vuelta
navLabel: "Día 14 · Angkor → Saigón"
trip: vietnam
order: 14
eyebrow: El plan · Día 14 · jue 24 sep
title: La *joya rosa*, y el salto al sur
dek: >-
  El vuelo a Saigón sale a las 18:30, así que **el día es entero para Angkor**: la arenisca rosa de
  Banteay Srei a la apertura, dos templos que la selva no ha soltado y una tarde sin prisa antes del
  aeropuerto. Se cruza al sur de noche.
blocks:
  - block: Amanecer
    time: "05:45–08:30"
    title: Banteay Srei, la joya rosa
    body: >-
      Salida a las **5:45**: [**Banteay Srei**](#banteay-srei) está a 37 km del recinto central, y esa
      lejanía es justo la razón de ir primero. Se llega a su **apertura, a las 7:30**, al templo de **967
      d.C.** cuya arenisca rosada permite **la talla más fina y minuciosa de todo el arte jemer** — tan
      fina que durante décadas se dudó de que fuera obra jemer.

      Es pequeño y se ve en tres cuartos de hora. Fue aquí donde un joven **André Malraux** fue detenido
      en 1923 por arrancar y llevarse bajorrelieves, episodio que después noveló en *La Vía Real*.
    window:
      label: Ventana óptima
      body: >-
        **A la apertura, sin discusión.** Es un templo diminuto y con talla de orfebre: con veinte
        personas dentro ya no se ve nada. A las siete y media hay luz rasante sobre la arenisca rosa —que
        es cuando el rosa es rosa de verdad— y prácticamente nadie.
  - block: Mañana
    time: "09:30–11:30"
    title: La vuelta por el circuito norte
    body: >-
      De regreso quedan de camino los dos que más compensan de lo que falta:
      [**Preah Khan**](#preah-khan), que es como Ta Prohm pero sin gente —un templo-monasterio enorme y
      derrumbado que se cruza de punta a punta por un eje de puertas cada vez más pequeñas—, y
      [**Neak Pean**](#neak-pean), la islita en cruz de cinco estanques.
    window:
      label: Neak Pean solo existe ahora
      body: >-
        **Neak Pean solo tiene agua en la época húmeda**, y septiembre es su momento: los cinco estanques
        llenos, el baray desbordado y la pasarela cruzando por encima del agua. En seca es un barrizal
        agrietado que no dice nada. Si el tiempo aprieta y hay que elegir uno de los dos, **es este**.
  - block: Mediodía
    time: "12:00–15:30"
    title: Ducha, comida y una tarde regalada
    body: >-
      Vuelta al hotel, comida, ducha y equipaje — y **sobran tres horas**, porque el vuelo no sale hasta
      las 18:30. Es la primera tarde sin agenda desde el loop, y cae en la hora de más calor del día:
      lo sensato es **piscina y horizontal**, sobre todo con dos madrugones seguidos a la espalda.

      Si el cuerpo pide algo, la opción con aire acondicionado es el **Museo Nacional de Angkor**, en la
      ciudad: hora y media, y ordena de golpe todo lo que habéis visto suelto estos días.

      Y con eso se cierra Camboya: **un amanecer de equinoccio, el templo más grande del mundo,
      doscientas dieciséis caras, la selva sobre Ta Prohm y la talla más fina del arte jemer**. No está
      todo, pero está lo que importa.
    dim: true
  - block: Tarde
    time: "15:45–19:50"
    title: El K6 824 a Saigón
    body: >-
      Salida hacia **SAI** a las **15:45** —el aeropuerto está a unos 45 km al este y conviene el
      colchón— y **K6 824 de Air Cambodia: Siem Reap 18:30 → Saigón 19:50**, hora y veinticinco.

      Se aterriza en **Tân Sơn Nhất**, que —a diferencia del de Siem Reap— está **a siete kilómetros del
      centro**: media hora de taxi y estáis en el hotel sobre las **21:00**.
    window:
      label: Y aquí un trámite que se olvida
      body: >-
        Este vuelo os **devuelve a Vietnam**, así que es una **segunda entrada**: hace falta otra
        **Tarjeta de Llegada Digital**, rellenada en las 72 horas previas. La exención española permite
        entradas múltiples sin intervalo mínimo, pero el QR hay que sacarlo igual — ver
        [visados y entradas](#e-visa-camboya). Dejadlo hecho **antes de salir de Siem Reap**, no en la
        cola de inmigración.
  - block: Noche
    time: "~21:00"
    title: Llegar y poco más
    body: >-
      A las nueve de la noche en el hotel, y **hoy no da para más que cenar**. Lo bueno es que en el
      Distrito 1 eso no es un problema: Saigón cena tarde y la calle está viva. Si queréis estirar veinte
      minutos, **Nguyễn Huệ** —la avenida peatonal— queda a un paso, con el **Cafe Apartments** del
      número 42 enfrente: un bloque de viviendas de los sesenta donde cada apartamento es hoy una
      cafetería distinta, con los balcones encendidos como un panal.

      Y notad el cambio aunque sea de noche: **esto ya no es el norte**. Hace más calor, se habla más
      alto, hay más coches que motos y la calle huele distinto. Habéis cruzado a otro Vietnam.
    dim: true
dormir:
  lugar: "Saigón · Distrito 1"
  ref: '#saigon-hotel'
