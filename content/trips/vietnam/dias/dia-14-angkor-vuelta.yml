slug: dia-14-angkor-vuelta
navLabel: "Día 14 · Angkor → Saigón"
trip: vietnam
order: 14
eyebrow: El plan · Día 14 · jue 24 sep
title: La *joya rosa*, y el lago que volvió
dek: >-
  Air Cambodia canceló el vuelo de las tres y os pasó al de las **19:40**, y eso le da la vuelta al día:
  se pierde la primera noche de Saigón, pero se ganan **cuatro horas y media en Camboya**. Y con ellas
  vuelve lo que se había caído del plan — el **Tonlé Sap**, justo en el mes en que se puede navegar.
blocks:
  - block: Amanecer
    time: "05:45–08:30"
    title: Banteay Srei, la joya rosa
    body: >-
      Salida a las **5:45**: [**Banteay Srei**](#banteay-srei) está a 37 km del recinto central, y esa
      lejanía es justo la razón de ir primero. Se llega a su **apertura, a las 7:30**, al templo de **967
      d.C.** cuya arenisca rosada permite **la talla más fina y minuciosa de todo el arte jemer** — tan
      fina que durante décadas se dudó de que fuera obra jemer.

      Es pequeño y se ve en tres cuartos de hora. Fue aquí donde un joven **André Malraux** fue detenido
      en 1923 por arrancar y llevarse bajorrelieves, episodio que después noveló en *La Vía Real*.
    window:
      label: Ventana óptima
      body: >-
        **A la apertura, sin discusión.** Es un templo diminuto y con talla de orfebre: con veinte
        personas dentro ya no se ve nada. A las siete y media hay luz rasante sobre la arenisca rosa —que
        es cuando el rosa es rosa de verdad— y prácticamente nadie.
  - block: Mañana
    time: "09:30–11:30"
    title: La vuelta por el circuito norte
    body: >-
      De regreso quedan de camino los dos que más compensan de lo que falta:
      [**Preah Khan**](#preah-khan), que es como Ta Prohm pero sin gente —un templo-monasterio enorme y
      derrumbado que se cruza de punta a punta por un eje de puertas cada vez más pequeñas—, y
      [**Neak Pean**](#neak-pean), la islita en cruz de cinco estanques.
    window:
      label: Neak Pean solo existe ahora
      body: >-
        **Neak Pean solo tiene agua en la época húmeda**, y septiembre es su momento: los cinco estanques
        llenos, el baray desbordado y la pasarela cruzando por encima del agua. En seca es un barrizal
        agrietado que no dice nada. Si el tiempo aprieta y hay que elegir uno de los dos, **es este**.
  - block: Mediodía
    time: "11:30–13:15"
    title: Ducha, comida y equipaje
    dim: true
    body: >-
      Vuelta al [**Prana**](#siem-reap-hotel), ducha y comida sin prisa — hoy sobra tiempo, que es la
      novedad. **Pedid salida tardía o dejad las mochilas en consigna**: no volvéis a pasar por el
      hotel.
  - block: Tarde
    time: "13:30–16:15"
    title: El Tonlé Sap, que había quedado fuera
    body: >-
      **Y aquí está el regalo del cambio de vuelo.** [**Kampong Phluk**](#kampong-phluk) —el pueblo de
      casas sobre pilotes de seis metros del **Tonlé Sap**— se había caído del plan por falta de horas,
      y era la ausencia que más dolía: **el bosque inundado solo es navegable en la estación húmeda, y
      septiembre es justo su máximo**. Ahora cabe.

      Son unos 30 km al sureste, tres cuartos de hora de coche, y el paseo en barca lleva hora y media:
      se navega entre las casas con el agua a media altura de los pilotes y se entra remando en el
      **bosque inundado**, que en seca es un campo de árboles secos y ahora es un laberinto de agua.
    window:
      label: Las cuentas, que van justas pero salen
      body: >-
        Facturación **dos horas antes** del vuelo, o sea **a las 17:40**, y del lago al aeropuerto hay
        cerca de una hora. Saliendo del hotel a la una y media y volviendo a las cuatro y cuarto, queda
        margen — pero **hay que llevarlo hablado con el conductor desde por la mañana**, con las mochilas
        en el coche, y no improvisarlo.

        **Y si el cuerpo dice que no, no pasa nada.** Lleváis desde las 04:15 de ayer a este ritmo y hoy
        os acostáis en Saigón pasada la medianoche. La alternativa honesta es **piscina y siesta en el
        hotel hasta las cuatro** — que después de dos madrugones seguidos también es una decisión
        legítima.
  - block: Atardecer
    time: "16:30–21:10"
    title: El K6 828 a Saigón
    body: >-
      Salida hacia **SAI** —el aeropuerto nuevo está a unos 45 km al este— para estar allí a las
      **17:40**, y **K6 828 de Air Cambodia: Siem Reap 19:40 → Saigón 21:10**.

      Y con eso se cierra Camboya: **un amanecer de equinoccio, el templo más grande del mundo,
      doscientas dieciséis caras, la selva sobre Ta Prohm, la talla más fina del arte jemer** y, por un
      vuelo cancelado, **el lago que da de comer al país**.
    window:
      label: Y aquí un trámite que se olvida
      body: >-
        Este vuelo os **devuelve a Vietnam**, así que es una **segunda entrada**: hace falta otra
        **Tarjeta de Llegada Digital**, rellenada en las 72 horas previas. La exención española permite
        entradas múltiples sin intervalo mínimo, pero el QR hay que sacarlo igual — ver
        [visados y entradas](#e-visa-camboya). Dejadlo hecho **antes de salir de Siem Reap**, no en la
        cola de inmigración.
  - block: Noche
    time: "21:10 en adelante"
    title: Llegar tarde, y nada más
    dim: true
    body: >-
      Se aterriza en **Tân Sơn Nhất**, que está **a siete kilómetros del centro**: media hora de taxi y
      estáis en el [apartamento](#saigon-hotel) de Bến Thành sobre las **22:15**.

      **Y hoy no hay noche.** La tarde de Nguyễn Huệ y el Cafe Apartments, que era el plan de esta
      primera velada, **se cae** — se recupera mañana, al bajar del Caravelle, que están a cuatrocientos
      metros. Cenad algo por el barrio si queda hambre y a dormir: mañana se madruga para el museo.
