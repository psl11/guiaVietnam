trip: vietnam
order: 14
eyebrow: El plan · Día 14 · jue 24 sep
title: La *joya rosa* y el regreso
dek: >-
  El segundo día grande de [Angkor](#angkor) mira al norte: la arenisca rosa de Banteay Srei a la apertura y un
  circuito de templos que la selva no ha soltado. A mediodía se cierra el capítulo camboyano; al
  anochecer, de vuelta a Hanói.
blocks:
  - block: Amanecer
    time: "05:15"
    title: Banteay Srei, la joya rosa
    body: >-
      Salida a las **5:15**: [**Banteay Srei**](#banteay-srei) está a 37 km del recinto central, y esa lejanía es justo
      la razón de ir primero. Se llega a su **apertura, a las 7:30**, al templo de 967 d.C. cuya
      arenisca rosada permite la talla más fina y minuciosa de todo el arte jemer. Es pequeño —tres
      cuartos de hora— y se saborea despacio; fue aquí donde un joven **André Malraux** fue detenido en
      1923 por arrancar y llevarse bajorrelieves, episodio que noveló en *La Vía Real*. Mirad los
      dinteles con esos ojos.
    window:
      label: Ventana óptima
      body: >-
        Llegar a la apertura es la jugada entera. A las 9:30 descargan los autobuses; antes, los patios
        son casi vuestros. Y la piedra rosa **pide luz de primera hora**: rasante y suave, saca el relieve
        de cada dintel — a mediodía la misma talla se aplana y se apaga.
  - block: Mañana
    time: "hasta ~13:00"
    title: "El circuito grande: Preah Khan, Neak Pean, Ta Som"
    body: >-
      De vuelta hacia el sur, el **circuito grande** enhebra tres templos que la jungla sigue
      abrazando. [**Preah Khan**](#preah-khan), hermano de Ta Prohm pero sin sus multitudes: corredores de un
      kilómetro, la mejor relación piedra/silencio del parque. [**Neak Pean**](#neak-pean), la isla de cinco estanques
      en cruz sobre el gran baray de Jayatataka. Y **Ta Som**, cuya puerta oriental desaparece bajo las
      raíces de una higuera. Hacia las **13:00**, de vuelta al hotel.
    window:
      label: Ventana óptima
      body: >-
        **Neak Pean solo tiene agua en la época húmeda** — y septiembre es ese momento: los cinco
        estanques llenos, el baray desbordado, la pasarela cruzando sobre el agua. En seca es un barrizal
        agrietado que no dice nada. La estación que «estropea» otros viajes es aquí la que regala el templo.
  - block: Mediodía
    time: "12:30–14:30"
    title: Comida, ducha y cierre de Angkor
    body: >-
      Comida tranquila en el hotel, ducha y equipaje. Es la despedida de Angkor y de Camboya: **tres
      días** que han ido de las doscientas dieciséis caras del Bayon a media tarde al amanecer del
      equinoccio sobre Angkor Wat, y del crepúsculo sobre el Tonlé Sap a esta arenisca rosa. Un último
      café con calma antes de deshacer la habitación de Wat Bo.
    window:
      label: Por qué se cierra hoy y no mañana
      body: >-
        Porque mañana es **25 de septiembre y en Hanói es Trung Thu**, la noche de los farolillos, que
        tiene fecha fija y no se mueve. Un cuarto día en Angkor sonaba tentador —sería Beng Mealea, Koh
        Ker, los templos de Roluos—, pero se pagaría con el viernes entero en Hanói y con llegar a Hàng
        Mã a las nueve y media de la noche recién bajados de un avión. No compensa.
  - block: Tarde
    time: "14:30–19:50"
    title: El vuelo VN836 de vuelta a Hanói
    body: >-
      Salida del hotel hacia SAI a las **14:30** —el aeropuerto está a 45 km y conviene el colchón— y
      **vuelo VN836 (Vietnam Airlines): Siem Reap 18:05 → Hanói ~19:50**. Al casco viejo con la noche
      del jueves por delante, solo para descansar. Mañana no hay despertador.
    window:
      label: Por qué este vuelo y no el VJ914
      body: >-
        Porque **el VJ914 no vuela los jueves**: opera lunes, martes, miércoles, viernes y sábado, y por
        eso VietJet canceló el billete original y quiso empujarnos al miércoles 23 — lo que se habría
        llevado por delante este día entero. La salida fue cambiar de compañía: **Vietnam Airlines cubre
        la ruta a diario**. Cuesta más, pero incluye maleta facturada y mantiene el itinerario en pie.
        Sale una hora antes que el VJ914, así que hoy se sale del hotel a las 14:30 y no a las 15:30.
dormir:
  lugar: "Hanói · barrio francés"
  ref: '#hoa-binh'
