slug: dia-14-angkor-vuelta
navLabel: "Día 14 · Angkor → Saigón"
trip: vietnam
order: 14
eyebrow: El plan · Día 14 · jue 24 sep
title: La *joya rosa*, y el salto al sur
dek: >-
  La mañana se gasta en lo mejor que queda de Angkor: la arenisca rosa de Banteay Srei a la apertura y
  un par de templos que la selva no ha soltado, de vuelta por el circuito norte. Y por la tarde, el
  cambio de país y de mundo — de la piedra jemer al Vietnam del sur.
blocks:
  - block: Amanecer
    time: "05:45–08:30"
    title: Banteay Srei, la joya rosa
    body: >-
      Salida a las **5:45**: [**Banteay Srei**](#banteay-srei) está a 37 km del recinto central, y esa
      lejanía es justo la razón de ir primero. Se llega a su **apertura, a las 7:30**, al templo de **967
      d.C.** cuya arenisca rosada permite **la talla más fina y minuciosa de todo el arte jemer** — tan
      fina que durante décadas se dudó de que fuera obra jemer.

      Es pequeño y se ve en tres cuartos de hora. Fue aquí donde un joven **André Malraux** fue detenido
      en 1923 por arrancar y llevarse bajorrelieves, episodio que después noveló en *La Vía Real*.
    window:
      label: Ventana óptima
      body: >-
        **A la apertura, sin discusión.** Es un templo diminuto y con talla de orfebre: con veinte
        personas dentro ya no se ve nada. A las siete y media hay luz rasante sobre la arenisca rosa —que
        es cuando el rosa es rosa de verdad— y prácticamente nadie.
  - block: Mañana
    time: "09:30–11:30"
    title: La vuelta por el circuito norte
    body: >-
      De regreso quedan de camino los dos que más compensan de lo que falta:
      [**Preah Khan**](#preah-khan), que es como Ta Prohm pero sin gente —un templo-monasterio enorme y
      derrumbado que se cruza de punta a punta por un eje de puertas cada vez más pequeñas—, y
      [**Neak Pean**](#neak-pean), la islita en cruz de cinco estanques.
    window:
      label: Neak Pean solo existe ahora
      body: >-
        **Neak Pean solo tiene agua en la época húmeda**, y septiembre es su momento: los cinco estanques
        llenos, el baray desbordado y la pasarela cruzando por encima del agua. En seca es un barrizal
        agrietado que no dice nada. Si el tiempo aprieta y hay que elegir uno de los dos, **es este**.
  - block: Mediodía
    time: "12:00–13:30"
    title: Ducha, comida y cierre de Camboya
    body: >-
      Vuelta al hotel, comida, ducha y equipaje. Se cierra Angkor: **un amanecer de equinoccio, el templo
      más grande del mundo, doscientas dieciséis caras, la selva sobre Ta Prohm y la talla más fina del
      arte jemer** en poco más de dos días. No está todo, pero está lo que importa.
    dim: true
  - block: Tarde
    time: "13:30–18:00"
    title: El vuelo a Saigón
    body: >-
      Salida hacia **SAI** a las **13:30** —el aeropuerto está a unos 45 km al este y conviene el
      colchón— y **vuelo a Ciudad Ho Chi Minh**, hora y media. Hay **cuatro diarios** entre Vietnam
      Airlines y Air Cambodia; el primero sale a las 10:00, así que hay que coger **uno de los de la
      tarde** para no perder la mañana de Banteay Srei.

      Se aterriza en **Tân Sơn Nhất**, que —a diferencia del de Siem Reap— está **a siete kilómetros del
      centro**: media hora de taxi y estáis en el hotel.
    window:
      label: Lo que hay que mirar al comprarlo
      body: >-
        Que salga **entre las 15:00 y las 16:30**. Antes os come Banteay Srei; mucho después, llegáis de
        noche cerrada y perdéis la primera tarde de Saigón, que es cuando la ciudad se enciende.
  - block: Noche
    time: "~19:00"
    title: Primera noche en el sur
    body: >-
      Nada exigente: **Nguyễn Huệ**, la avenida peatonal, y el **Cafe Apartments** del número 42 — un
      bloque de viviendas de los sesenta donde cada apartamento es hoy una cafetería distinta, con los
      balcones encendidos como un panal. Cena por la zona y a dormir.

      Y notad el cambio: **esto ya no es el norte**. Hace más calor, se habla más alto, hay más coches
      que motos y la calle huele distinto. Habéis cruzado a otro Vietnam.
    dim: true
dormir:
  lugar: "Saigón · Distrito 1"
