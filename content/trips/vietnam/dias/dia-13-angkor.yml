slug: dia-13-angkor
navLabel: "Día 13 · Angkor"
trip: vietnam
order: 13
eyebrow: El plan · Día 13 · mié 23 sep
title: El día grande de *Angkor*
dek: >-
  El día alrededor del cual gira el viaje, y cae justo en el equinoccio. Va en dos mitades: la primera
  es vuestra —el sol naciendo alineado con la torre central y el templo más grande del mundo vacío por
  dentro—, y a partir de las ocho y media entra el guía. Ocho horas seguidas de piedra jemer, que es
  mucho: la mitad del trabajo de hoy es administrar el cuerpo.
blocks:
  - block: Amanecer
    time: "04:45–08:30"
    title: El sol del equinoccio, y el templo vacío
    body: >-
      Esta parte **no la lleva el guía y es la más importante del día**. Despertador a las 4:15,
      desayuno de caja pedido al hotel la víspera, tuk-tuk a oscuras y cruzáis el foso antes que nadie.
      Se espera frente al **estanque norte** —menos gentío que el sur y mejor reflejo—.

      Y salido el sol, **no os vayáis**: el gentío del amanecer se deshace hacia las siete y el templo
      se queda vacío. Esa es la hora de la **galería de bajorrelieves**, ochocientos metros de piedra
      narrada, y de la subida al **Bakan**, el santuario superior que es la cumbre del monte Meru.
      Volveréis luego con el guía, pero **verlo solos primero es lo que hace que lo de después se
      entienda**.
    window:
      label: Hoy es el equinoccio, y hay que pedir una cosa
      body: >-
        **En 2026 el equinoccio cae hoy, a las 07:06 hora de Camboya.** No es «cerca del equinoccio»:
        el sol nace **alineado con la torre central**, que es la razón de que el templo mire al oeste.
        En marzo esa alineación junta a decenas de miles de personas; en septiembre no lo sabe casi
        nadie. Ver [la geometría de Angkor Wat](#angkor-wat-geometria).

        **Y la petición al guía: que os recoja en Angkor Wat a las 08:30, no en el hotel.** Si no,
        tendríais que volver corriendo a Siem Reap a las siete y media, desayunar de pie y salir otra
        vez — cuarenta minutos de tuk-tuk tirados y la mejor hora del día perdida.
  - block: Mañana
    time: "08:30–11:30"
    title: Angkor Thom, con el guía
    body: >-
      Entra el guía y empieza la parte contada. Se accede a [**Angkor Thom**](#angkor-thom) por la
      **puerta sur**, con sus filas de **cincuenta y cuatro dioses y cincuenta y cuatro demonios**
      tirando de la serpiente a ambos lados de la calzada, y se va al [**Bayon**](#el-bayon):
      **doscientas dieciséis caras** sonriendo desde cincuenta y tantas torres.

      Después, las **terrazas reales**: la **de los Elefantes**, trescientos metros de plataforma
      tallada con una procesión de elefantes y sus *mahouts* desde la que el rey presidía los desfiles,
      y la **del Rey Leproso**, con su doble muro de figuras superpuestas.
    window:
      label: Pedidle que empiece por aquí y no por Angkor Wat
      body: >-
        Es el cambio que más rendimiento da a las ocho horas contratadas. **Vosotros ya habréis hecho
        Angkor Wat al amanecer**, así que repetirlo a las nueve es gastar la mejor luz dos veces. Y el
        Bayon **necesita justo esta hora**: las caras son relieve profundo y solo se leen con **luz
        lateral de mañana** — a mediodía se aplanan y desaparecen.
  - block: Mediodía
    time: "11:30–13:00"
    title: Comer pronto, y a la sombra
    dim: true
    body: >-
      **Confirmadle al guía que la pausa de comida es a las once y media y no a la una.** No es
      capricho: lleváis en pie desde las cuatro y cuarto, en septiembre en Camboya se juntan **treinta y
      tantos grados con humedad alta**, y comer en el peor momento del calor es lo que decide si la
      tarde se disfruta o se sufre.

      Hay restaurantes dentro del recinto, cerca de la puerta sur y junto a Ta Prohm. Y llevad **dos
      litros de agua por cabeza**, sales, gorra y protección: hoy no hay siesta.
  - block: Tarde
    time: "13:00–14:30"
    title: Angkor Wat leído
    body: >-
      Vuelta a **Angkor Wat**, esta vez con quien sabe leerlo — y a esta hora, además, porque
      **la galería de bajorrelieves está techada** y es de los pocos sitios donde se está fresco a
      mediodía.

      Lo que hay que pedirle que cuente, si no lo hace solo: el **Batido del Océano de Leche**
      —ochenta y ocho *asuras* y noventa y dos *devas* tirando de una serpiente durante mil años para
      sacar el elixir de la inmortalidad—, la batalla de **Kurukshetra** del *Mahabharata* y el desfile
      histórico de **Suryavarman II**, el rey que lo mandó construir. Está todo en
      [la ficha de los bajorrelieves](#bajorrelieves-angkor-wat).
  - block: Media tarde
    time: "14:45–16:30"
    title: Ta Prohm, el templo que la selva no soltó
    body: >-
      Y se cierra donde tenía que cerrarse. [**Ta Prohm**](#ta-prohm): los **spung** de raíces blancas
      derramadas sobre los muros, el patio donde rodó *Tomb Raider*, y esa sensación de ruina
      encontrada que la École française d'Extrême-Orient decidió **conservar a propósito** en vez de
      restaurar — se apuntaló lo justo para que no se cayera y se dejó el resto como estaba.
    window:
      label: Por qué al final y no a primera hora
      body: >-
        Por dos cosas. La **luz verde de la tarde entre las raíces** es su mejor momento y no se parece
        a nada. Y hacia las cuatro los grupos ya se han ido a buscar sitio para la puesta de sol, así
        que el patio de la ceiba grande se queda razonablemente tranquilo. Además está en **sombra de
        selva todo el rato**, que después de diez horas se agradece más de lo que parece.
  - block: Atardecer
    time: "16:30–18:15"
    title: El atardecer, si el cuerpo aguanta
    body: >-
      El guía termina a las **16:30** y a esa hora lleváis **doce horas en pie**. Así que esto va en
      condicional, y sin culpa si se cae.

      Si tiráis: **Srah Srang** está a cinco minutos de Ta Prohm — el estanque real del siglo X, con su
      embarcadero de laterita y leones, mirando al oeste. Es tranquilo, no cobra aforo y no exige
      moverse. La alternativa clásica es **Pre Rup**, un templo-montaña de laterita que se pone naranja
      con el sol bajo y domina la llanura, a un cuarto de hora — mejor vista y algo más de gente, pero
      **sin la aglomeración de Phnom Bakheng**, donde limitan el aforo y se hace cola.
    window:
      label: Decidlo por la mañana, no a las cuatro y media
      body: >-
        **Pedid al guía que os deje en Ta Prohm o en Srah Srang, no de vuelta en el hotel**, y tened el
        tuk-tuk avisado para recogeros a las seis y cuarto. Si a las cuatro y media ya estáis en Siem
        Reap, nadie va a volver a salir — y esa decisión se toma sin querer, por inercia, al subirse al
        coche.
  - block: Noche
    time: noche
    title: Cena jemer y a la cama
    dim: true
    body: >-
      Cena tranquila —es la noche de [**Cuisine Wat Damnak**](#cuisine-wat-damnak-reserva) si la
      reservasteis— y pronto a dormir: mañana el despertador vuelve a sonar de madrugada para Banteay
      Srei, y por la tarde se vuela a Saigón.
    window:
      label: Y la ausencia que hay que asumir
      body: >-
        Con un solo día completo en Angkor, **el Tonlé Sap se cae del plan**. Duele, porque el bosque
        inundado de [Kampong Phluk](#kampong-phluk) solo es navegable en la estación húmeda y septiembre
        es justo su máximo. Es el precio de haber metido Saigón, y conviene saberlo de antemano en vez
        de descubrirlo el jueves.
