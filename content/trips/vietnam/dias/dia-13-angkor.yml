slug: dia-13-angkor
navLabel: "Día 13 · Angkor"
trip: vietnam
order: 13
eyebrow: El plan · Día 13 · mié 23 sep
title: El día grande de *Angkor*
dek: >-
  El día que ordena todo el viaje, y cae justo en el equinoccio. Se persigue la luz de punta a punta:
  el sol naciendo alineado con la torre central y, doce horas después, el crepúsculo sobre el agua.
  Entre medias, Angkor Wat entero para vosotros y una siesta que no es pereza sino estrategia.
blocks:
  - block: Amanecer
    time: "04:45"
    title: Angkor Wat, el sol del equinoccio
    body: >-
      Despertador a las 4:15, tuk-tuk a oscuras y cruzáis el foso antes que nadie. Se espera frente
      al **estanque norte** (menos gentío que el sur y mejor reflejo). Después, los [bajorrelieves de la galería](#bajorrelieves-angkor-wat) con guía y la subida al **Bakan**, el santuario superior.
    window:
      label: Ventana óptima
      body: >-
        Estos días —y **solo** en torno al [equinoccio del 22-23 sep](#angkor-wat-geometria)— el sol nace **alineado con la
        torre central**. Además llegáis casi una hora antes que los buses de las excursiones.
  - block: Mañana
    time: "08:00–11:30"
    title: Angkor Wat por dentro, sin reloj
    body: >-
      Salido el sol, el gentío del amanecer se deshace y **el templo se queda vacío**. Es entonces cuando
      se ve de verdad: la **galería de bajorrelieves**, ochocientos metros de piedra narrada, con el
      *Batido del Océano de Leche* —ochenta y ocho asuras y noventa y dos devas tirando de una serpiente
      durante mil años para sacar el elixir de la inmortalidad— y la batalla de Kurukshetra. Y luego la
      subida al **Bakan**, el santuario superior, que es la cumbre del Meru.

      Con [la ficha de la geometría](#angkor-wat-geometria) en la mano, esta mañana deja de ser «ver un
      templo» y pasa a ser leerlo: por qué mira al oeste, por qué el recorrido va del mundo exterior al
      centro del universo, y por qué las medidas cuentan el tiempo.
    window:
      label: Lo que el plan viejo no permitía
      body: >-
        Antes había que salir corriendo de Angkor Wat a las ocho para meter Ta Prohm y el Bayon en la
        misma mañana. **Con el día de ayer, ya no**: los dos están hechos, y el templo más grande del
        mundo se queda con la mañana entera para él — que es lo mínimo que pide.
  - block: Mediodía · siesta
    time: "12:30–14:30"
    title: Piscina y horizontal
    dim: true
    body: >-
      Vuelta al hotel, comida tranquila y siesta larga. Aquí la piscina no es un lujo de folleto:
      es lo que hace **físicamente posible** encadenar los dos turnos de luz del día.
    window:
      label: Por qué ahora
      body: >-
        A mediodía el calor de Camboya aprieta y la luz cae **plana y dura** — la peor hora para la
        piedra y para las fotos. Se pierde poco y se recarga para lo que viene.
  - block: Tarde–crepúsculo
    time: "14:30–19:00"
    title: El bosque inundado del Tonlé Sap
    body: >-
      Barca por [**Kampong Phluk**](#kampong-phluk): un pueblo de casas sobre pilotes altísimos, el bosque anegado que
      se recorre remando entre los troncos, y la salida al **lago** para la última luz.
    window:
      label: Ventana óptima
      body: >-
        En **septiembre** el lago está en su máximo y el bosque anegado es navegable (en seco queda
        en tierra); y el **crepúsculo sobre el agua** desde la barca es la postal que cierra la jornada
        de luz.
  - block: Noche
    time: "noche"
    title: La cena jemer y el martini colonial
    body: >-
      De vuelta en la ciudad, la gran cena del viaje: [**Cuisine Wat Damnak**](#cuisine-wat-damnak), el
      menú degustación de temporada de Siem Reap —cocina jemer contemporánea, reservada y con el aviso
      vegetariano dado—. Y si aún queda cuerpo, la **coda colonial**: un cóctel en el [**Elephant
      Bar**](#elephant-bar) del Raffles de 1932, el gemelo camboyano del martini de Greene en Hanói.
    window:
      label: Por qué esta noche
      body: >-
        Es la única velada libre en Siem Reap —la de llegada fue el circo, y mañana se vuela—, así que
        aquí va la cena-evento. **Cuisine Wat Damnak** solo abre de martes a sábado: el miércoles 23
        entra justo.
