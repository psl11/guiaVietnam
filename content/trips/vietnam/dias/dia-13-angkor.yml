navLabel: "Día 13 · Angkor"
trip: vietnam
order: 13
eyebrow: El plan · Día 13 · mié 23 sep
title: El día grande de *Angkor*
dek: >-
  El día alrededor del cual gira el viaje, y cae justo en el equinoccio. Es la única jornada completa
  en Angkor, así que va cargada de punta a punta: el sol naciendo alineado con la torre central, el
  templo más grande del mundo por dentro, las doscientas dieciséis caras del Bayon y, al caer la
  tarde, la selva devorando Ta Prohm.
blocks:
  - block: Amanecer
    time: "04:45"
    title: Angkor Wat, el sol del equinoccio
    body: >-
      Despertador a las 4:15, tuk-tuk a oscuras y cruzáis el foso antes que nadie. Se espera frente al
      **estanque norte** —menos gentío que el sur y mejor reflejo—.
    window:
      label: Ventana óptima
      body: >-
        **En 2026 el equinoccio cae hoy, a las 07:06 hora de Camboya**: hora y media después de este
        amanecer. No es «cerca del equinoccio», es el equinoccio — y el sol nace **alineado con la torre
        central**, que es la razón de que el templo mire al oeste. En marzo esa misma alineación junta a
        decenas de miles de personas; en septiembre no lo sabe casi nadie. Ver [la ficha de la
        geometría](#angkor-wat-geometria).
  - block: Mañana
    time: "06:30–09:00"
    title: Angkor Wat por dentro, ya sin gente
    body: >-
      Salido el sol, el gentío del amanecer se deshace y **el templo se queda vacío**: es entonces cuando
      se ve. La **galería de bajorrelieves**, ochocientos metros de piedra narrada, con el *Batido del
      Océano de Leche* —ochenta y ocho asuras y noventa y dos devas tirando de una serpiente durante mil
      años para sacar el elixir de la inmortalidad— y la batalla de Kurukshetra. Y la subida al
      **Bakan**, el santuario superior, que es la cumbre del monte Meru.
    window:
      label: El error que comete todo el mundo
      body: >-
        Irse a desayunar en cuanto sale el sol. La hora siguiente al amanecer es **la mejor del día** en
        Angkor Wat: la luz entra baja por la galería oeste, los relieves cogen relieve de verdad y los
        autobuses todavía no han llegado.
  - block: Media mañana
    time: "09:30–11:30"
    title: Angkor Thom y las caras del Bayon
    body: >-
      Se entra en [**Angkor Thom**](#angkor-thom) por la **puerta sur**, con sus filas de dioses y demonios
      tirando de la serpiente a ambos lados de la calzada, y se va al [**Bayon**](#el-bayon): **doscientas
      dieciséis caras** sonriendo desde cincuenta y tantas torres. Después, la **Terraza de los Elefantes**
      y la **del Rey Leproso**, trescientos metros de bajorrelieve de desfile.
  - block: Mediodía · siesta
    time: "12:00–15:00"
    title: Piscina y horizontal
    dim: true
    body: >-
      Vuelta al hotel, comida tranquila y siesta larga. Aquí la piscina no es un lujo de folleto: es lo
      que hace **físicamente posible** volver a salir después de haberse levantado a las cuatro y cuarto.
    window:
      label: Por qué tanto rato
      body: >-
        A mediodía el calor de Camboya aprieta y la luz cae **plana y dura** — la peor hora para la
        piedra. En Angkor no se gana nada resistiendo al sol: se pierde la foto y se llega muerto a la
        hora buena.
  - block: Tarde
    time: "15:30–17:30"
    title: Ta Prohm, el templo que la selva no soltó
    body: >-
      [**Ta Prohm**](#ta-prohm) al final del día: los **spung** de raíces blancas derramadas sobre los
      muros, el patio donde rodó *Tomb Raider*, y esa sensación de ruina encontrada que la École
      française d'Extrême-Orient decidió **conservar a propósito** en vez de restaurar — se apuntaló lo
      justo para que no se cayera y se dejó el resto como estaba.
    window:
      label: Por qué a última hora y no a primera
      body: >-
        Porque a las siete y media de la mañana estabais en Angkor Wat, que es donde había que estar. Y
        porque Ta Prohm funciona igual de bien al final: **la luz verde de la tarde entre las raíces** es
        su mejor momento, y hacia las cinco los grupos ya se han ido a buscar sitio para la puesta de sol.
  - block: Atardecer
    time: "17:30–18:30"
    title: La última luz desde Pre Rup
    body: >-
      Para cerrar, **Pre Rup**: un templo-montaña de laterita del siglo X que se pone naranja con el sol
      bajo y desde cuyas terrazas se domina la llanura y los arrozales. Es el atardecer clásico de Angkor
      **sin la aglomeración de Phnom Bakheng**, donde limitan el aforo y se hace cola.
    window:
      label: Y la ausencia que hay que asumir
      body: >-
        Con un solo día completo en Angkor, **el Tonlé Sap se cae del plan**. Duele, porque el bosque
        inundado de [Kampong Phluk](#kampong-phluk) solo es navegable en la estación húmeda y septiembre
        es justo su máximo. Es el precio de meter Saigón, y conviene saberlo de antemano en vez de
        descubrirlo el jueves.
  - block: Noche
    time: noche
    title: Cena jemer en Wat Damnak
    body: >-
      Cena tranquila y pronto a la cama: mañana el despertador vuelve a sonar de madrugada para Banteay
      Srei, y por la tarde se vuela.
    dim: true
dormir:
  lugar: "Siem Reap · Wat Bo"
