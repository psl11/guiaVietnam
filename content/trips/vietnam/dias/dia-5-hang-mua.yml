slug: dia-5-hang-mua
navLabel: "Día 5 · Hang Múa"
trip: vietnam
order: 5
eyebrow: El plan · Día 5 · mar 15 sep
title: Del *dragón* al altiplano
dek: >-
  El día que el bus cama rescata. De madrugada, los quinientos escalones del dragón antes de que
  lleguen el sol y los autobuses; luego, en vez de meter la jornada entera en un coche, Ninh Bình
  entera: la primera capital del país y el humedal silencioso de Vân Long. El salto al norte se hace
  de noche y durmiendo, y el altiplano amanece por la ventanilla.
blocks:
  - block: Amanecer
    time: "06:30"
    title: Hang Múa, los 500 escalones del dragón
    body: >-
      Despertador de madrugada para [**Hang Múa**](#hang-mua) a las **06:30**. Son unos **500 escalones** de piedra
      —la entrada, 100.000 VND (~3,3 €)— que trepan por el flanco de la montaña hasta el **mirador del dragón**,
      una cresta coronada por la figura del animal. Arriba espera la vista que explica todo Ninh Bình
      mejor que cualquier texto: el río serpenteando entre agujas de roca y **Tam Cốc** a vuestros pies,
      en un mar de arrozales.
    window:
      label: Ventana óptima
      body: >-
        A las seis y media se sube en fresco y casi a solas: los tours que salen de Hanói no llegan
        **hasta pasadas las nueve**, y el calor de mediodía en estas escaleras al descubierto es serio.
        Y hoy no hay logística que resolver: **dormís al pie de la escalera**, así que esto es
        levantarse y andar. A
        esa hora, además, la niebla aún se deshilacha sobre los arrozales y la luz entra rasante — la
        montaña se gana de un tirón y con su mejor cara.
  - block: Mañana
    time: "~10:00"
    title: Hoa Lư, donde empezó el país
    body: >-
      Con el desayuno hecho, doce kilómetros al noroeste está [**Hoa Lư**](#ninh-binh-historia), capital de Vietnam
      entre **968 y 1010**. Queda poco en pie —los templos que se visitan son del XVII, dedicados a **Đinh
      Bộ Lĩnh** y a **Lê Hoàn**—, y por eso lo que importa aquí no es el monumento sino el emplazamiento:
      se entiende de un vistazo por qué se eligió este valle. Los farallones que lleváis dos días
      fotografiando **eran las murallas**. Bastaba tapiar los pasos entre agujas de roca para tener una
      ciudadela que la caballería china no podía tomar.
    window:
      label: Por qué ahora existe este hueco
      body: >-
        Porque el traslado al norte ya no se come el día. Hasta ahora esta mañana era carretera; con el
        bus cama, Ninh Bình pasa de día y medio a **dos días y medio**, y el hueco se llena con lo que
        antes se caía del plan. Hoa Lư es media mañana justa: se ve en hora y media y queda de camino al
        humedal.

        *La otra forma de gastar el día ganado*: cambiar Hoa Lư **y** Vân Long por la catedral de
        [**Phát Diệm**](#phat-diem), 26 km al sureste — media jornada, y el campanario desde el que
        Graham Greene miró la guerra antes de escribir *El americano impasible*. Es una u otra cosa, no
        las dos.
  - block: Tarde
    time: "~15:00–16:45"
    title: Vân Long, el karst en silencio
    body: >-
      La tarde es el mejor hallazgo del bloque: la reserva de [**Vân Long**](#van-long), un humedal de juncales
      veinte kilómetros al norte. Es el **mismo karst de Tràng An sin nada de lo que cansa de Tràng An**:
      **una barca de remo, dos pasajeros, hora y media** de agua quieta, sin cola de embarcaciones, sin
      motores —la reserva los prohíbe— y sin vendedores abordando a media travesía. Cuesta **20.000 ₫ de
      entrada y 60.000 ₫ la barca**: unos tres euros los dos.

      El premio, si hay suerte, trepa por la pared: el **langur de Delacour**, negro con los cuartos
      traseros blancos, **endémico de Vietnam y con menos de trescientos ejemplares vivos en el mundo**.
      Vân Long guarda la mayor colonia que queda.
    window:
      label: Ventana óptima
      body: >-
        Media tarde, y por dos razones que caen a la misma hora: es cuando **los langures bajan a comer**
        y cuando la luz entra rasante sobre el juncal. A mediodía el humedal es un espejo blanco sin nada
        que ver ni que fotografiar. Cierra a las **16:45**, así que la última barca sale antes — y aquí sí
        compensa cargar con el teleobjetivo.
  - block: Noche
    time: "17:30 → 20:30"
    title: El salto al norte, durmiendo
    body: >-
      Vuelta de Vân Long sobre las cinco y media, ducha con calma y **cena sin prisa** — es la última
      oportunidad del **dê núi**, la cabra de monte criada en las peñas calizas que es el plato de la
      provincia y no se encuentra bien fuera de aquí.

      Y a las ocho y media, el [**bus cama a Hà Giang**](#traslado-ha-giang), reservado con BiBi junto
      con el loop: **cabina VIP, salida a las 20:30 y llegada sobre las cuatro de la madrugada**,
      directo y sin pasar por Hanói. No es un asiento reclinable: es una cabina con puerta y colchón, y
      esta noche tiene que hacer de hotel.
    window:
      label: Dos cosas que hay que dejar listas
      body: >-
        **La primera, el traslado hasta el autobús.** Dormís en Tam Cốc y la estación de **Đồng Gừng
        está en la ciudad de Ninh Bình, a siete u ocho kilómetros** — veinte minutos de taxi. Si BiBi no
        recoge en el alojamiento, **dejadlo hablado la víspera** con el homestay, que a las ocho de la
        tarde encontrar coche desde Tam Cốc no es inmediato.

        **La segunda, partir el equipaje**: en la moto solo van cuatro días de ropa y el resto se queda
        en consigna en Hà Giang. Hacer ese reparto a las cuatro de la mañana con sueño es como se
        pierden las cosas.

        Y la buena noticia del horario: la **noche previa al tour va incluida** en el hotel de Hà Giang,
        con *check-in* a cualquier hora. Bajáis del bus a las cuatro y tenéis ducha y cama hasta las ocho.
dormir:
  lugar: "Bus cama Ninh Bình → Hà Giang"
  ref: '#traslado-ha-giang'
