slug: dia-10-meo-vac
navLabel: "Día 10 · Mèo Vạc"
trip: vietnam
order: 10
eyebrow: El plan · Día 10 · dom 20 sep
title: El domingo en *Mèo Vạc*
dek: >-
  La mañana alrededor de la cual se construyó todo el loop de cinco días: el gran mercado dominical de
  Mèo Vạc, el latido social del altiplano una vez por semana. Y luego el largo tirón de vuelta, cerrando
  el círculo de karst — y esa misma noche, el bus cama a Hanói: el que convierte mañana en un día de
  Angkor en vez de un día de autobús.
blocks:
  - block: Amanecer · el mercado
    time: "06:30–09:30"
    title: El mercado dominical de Mèo Vạc
    body: >-
      El corazón del viaje al norte cabe en tres horas. A las **05:00** ya hay movimiento en el
      [**mercado dominical**](#mercado-meo-vac); el pico llega entre las **07:00 y las 09:30** y hacia las
      diez se ha deshecho. Bajan andando desde las aldeas, con el traje bueno puesto, **hmong, dao y lô
      lô**: se cierra la venta de un búfalo con un apretón, alguien corta el pelo en plena calle, se bebe
      licor de maíz a las ocho de la mañana. Nada de esto está montado para nadie de fuera — y eso es
      exactamente lo que habéis venido a ver un domingo.
    window:
      label: Ventana óptima
      body: >-
        Esta mañana es la razón de que el loop **termine en domingo**: se diseñó hacia atrás desde aquí.
        Es un evento con fecha fija —solo domingos— y por eso lo que se cierra con el operador es el día
        de vuelta, no la duración del tour. Y dentro de la mañana, la ventana es estrecha: **luz rasante y
        gentío en su punto antes de las nueve**; a las once no queda mercado que fotografiar.
  - block: Mediodía · el regreso
    time: "~10:00–15:00"
    title: El regreso a la ciudad de Hà Giang
    body: >-
      Hacia las **10:00**, cuando el mercado se deshace, se emprende la vuelta: **unos 155 km, cerca de 5
      horas** por Mậu Duệ y Minh Ngọc de regreso a la **ciudad de Hà Giang**, con llegada sobre las
      **15:00–16:00**. Es el último tramo del loop —unos **350-384 km** de karst en total— y el paisaje se
      va destensando, de la piedra vertical del altiplano a valles más abiertos. La carretera (la DT182)
      arrastra alguna obra histórica y, tras la lluvia, gravilla; nada que un piloto local no conozca.
    window:
      label: Por qué el mercado primero
      body: >-
        Hacer el de Mèo Vạc en vez del de Đồng Văn evita retroceder 23 km de puerto de montaña, así que el
        regreso es una sola línea limpia en lugar de un rodeo. Saliendo a las diez se llega a Hà Giang
        sobre las tres, con **tarde de sobra antes del bus de las ocho** — que es lo que hoy hay que
        proteger, porque el sleeper es el que sostiene el día de Angkor que se ha ganado.
  - block: Tarde
    time: "15:00–19:30"
    title: Ducha, colada y despedir al piloto
    body: >-
      Se llega a Hà Giang sobre las tres, y hay cuatro horas antes del autobús. Son justo las que hacen
      falta: **habitación de día** para ducharse a fondo y meter la ropa en una lavandería exprés —bajáis
      con cinco días de polvo y humedad encima—, cena temprana, y la **propina al easy rider**, que se le
      da en đồng y en mano al despedirse (está en [la ficha del loop](#loop-reserva)).
    window:
      label: No os saltéis la habitación de día
      body: >-
        Es barata y es la diferencia entre subir limpio a una litera o pasar ocho horas de autobús con la
        ropa del altiplano puesta. Se pide al mismo hotel o al operador del loop, que suelen tenerla
        resuelta. Ver [Hà Giang ciudad](#ha-giang-ciudad).
  - block: Noche
    time: "~20:00"
    title: El bus cama de vuelta, y lo que compra
    body: >-
      Sleeper nocturno **Hà Giang → Hanói**: unos 300 km, 6-7 horas, con llegada entre las **03:30 y las
      05:00**. Cabina otra vez, no litera abierta. Se cierra el norte durmiendo y se amanece ya en la
      capital.
    dim: true
    window:
      label: Por qué la vuelta también es de noche
      body: >-
        Aquí está el cambio que reordenó el final del viaje. Antes se dormía en Hà Giang y se bajaba de
        día, porque el 21 era un colchón vacío y adelantar no servía de nada. **Ahora sí sirve**: bajando
        de noche se vuela a Camboya el mismo lunes 21 en vez del martes 22, y **Angkor pasa de día y
        medio a tres días**. Lo que se paga es que el colchón antitifón desaparece — ver
        [el día 11](#dia-11-hanoi-vuelta), donde está contado en qué consiste ese riesgo y cómo se cubre.
dormir:
  lugar: "Bus cama Hà Giang → Hanói"
  ref: '#traslado-ha-giang'
