title: Hoi An al *amanecer*, y la última noche en Hanói
dek: >-
  El casco viejo a las seis de la mañana no se parece en nada al de anoche: sin una sola tienda abierta,
  con el mercado despertándose y las barcas saliendo. Es la mejor hora que da esta ciudad y hay que
  cogerla. Después, arrozales en bici, y a media tarde el vuelo de vuelta al norte para cerrar Vietnam
  donde empezó.
blocks:
  - block: Amanecer
    time: "05:45–08:00"
    title: El casco viejo vacío
    body: >-
      Fuera de la cama a las cinco y media. **Entre las seis y las siete y media no hay nadie**: las
      casas de madera cerradas, los farolillos aún colgados y apagados, el río quieto y la luz entrando
      rasante por la calle Nguyễn Thái Học. Es literalmente la misma ciudad de anoche sin las cuatro mil
      personas de anoche.

      El **puente japonés** sin cola, el **mercado central** montándose sobre las seis y media —pescado
      del Thu Bồn, hierbas de Trà Quế, mujeres con el sombrero cónico de verdad y no de recuerdo— y las
      **barcas de remos** saliendo. Desayuno en un puesto del mercado.
    window:
      label: Por qué esta hora y no otra
      body: >-
        Porque **Hoi An tiene dos ciudades y comparten calles**. Los autobuses de Đà Nẵng empiezan a
        descargar sobre las nueve y hasta las cuatro de la tarde el casco viejo es un pasillo de gente.
        Antes de las ocho es un pueblo de pescadores del siglo XVIII. Si solo pudierais estar aquí dos
        horas, **son estas**.
  - block: Mañana
    time: "08:30–12:00"
    title: Trà Quế y los arrozales, en bicicleta
    body: >-
      Casi todos los hoteles prestan bici, y es la manera de ver lo que hay alrededor. Tres kilómetros
      al norte está la **aldea de Trà Quế**, cuatrocientos años cultivando hierbas aromáticas entre el
      río y una laguna, abonadas solo con **alga del agua** — de ahí sale el cilantro, la menta y la
      albahaca que lleva media cocina de la región. Se pasea entre los bancales y se puede desayunar
      allí mismo.

      Desde ahí, camino de tierra entre arrozales hasta la **playa de An Bàng**, cuatro kilómetros al
      este. Es la playa que le queda a Hoi An sin hormigón, con chiringuitos de madera. Baño y vuelta.
    window:
      label: La alternativa, si preferís templos a bicicleta
      body: >-
        A 45 km está [**Mỹ Sơn**](#my-son), el santuario **cham** — setenta templos de ladrillo entre
        los siglos IV y XIII, Patrimonio de la Humanidad, y el mejor prólogo posible a Angkor porque es
        la *otra* rama del hinduismo del sudeste asiático. Se hace en una mañana (08:00-12:30) y **cabe
        perfectamente después del amanecer en el casco viejo**. Aviso honesto: es un yacimiento abierto
        sin sombra, y a las once de la mañana de septiembre **pega de verdad**.
  - block: Mediodía
    time: "12:30–14:15"
    title: La última comida en el centro
    body: >-
      Antes de subir al norte, lo que no se repite: [**mì Quảng**](#mi-quang), el fideo a la cúrcuma de
      la provincia de Quảng Nam, que aquí es comida de diario y en Hanói es una imitación. Y para ella,
      [**Minh Hiền**](#minh-hien-chay), que lleva treinta años haciendo la versión *chay* de todo el
      recetario de Hoi An — incluido el cao lầu.
    dim: true
  - block: Tarde
    time: "14:15–19:00"
    title: De vuelta al norte
    body: >-
      Traslado a **Đà Nẵng** (45 min) y vuelo a **Hanói** a media tarde — la ventana buena es
      **entre las 16:00 y las 17:00**, ver [los vuelos a Hoi An](#vuelos-hoi-an). Se aterriza en Nội Bài
      sobre las 18:15 y con el Grab estáis en el hotel del barrio francés a las siete.

      Y aquí conviene el recordatorio práctico: **es la última noche en Vietnam continental antes de
      Camboya**. Mañana solo hay media mañana en Hanói, así que lo que quede por comprar o por lavar,
      esta noche.
    window:
      label: Y el encargo del sastre, si lo hicisteis
      body: >-
        Hoi An vive de la **sastrería a medida en 24 horas** y funciona de verdad. Si encargasteis algo
        ayer por la tarde, **se recoge esta mañana antes de las doce** — no lo dejéis para después de la
        bici. Si no encargasteis nada, ya no da tiempo: **no aceptéis un «lo mandamos al hotel»**, que
        es donde empiezan los problemas.
  - block: Noche
    time: "19:30 en adelante"
    title: Phở cuốn en Ngũ Xã, y jazz
    body: >-
      La cena en la península de [**Ngũ Xã**](#ngu-xa), metida en el lago **Trúc Bạch**: fue durante
      siglos el barrio de los **fundidores de bronce** del rey y hoy es donde se inventó el
      [**phở cuốn**](#pho-cuon) — la lámina de phở sin cortar, enrollada en crudo con ternera salteada
      y hierbas. Está en [**Ngũ Xã**](#ngu-xa-truc-bach) y es un plato de una sola calle del mundo.

      *(La alternativa, si os apetece algo con más historia que cocina, es
      [**Mậu Dịch 37**](#mau-dich-37), el restaurante que recrea un comedor del **período del
      subsidio** — cartillas de racionamiento, platos de aluminio y las paredes llenas de los años
      ochenta.)*

      Y para cerrar Vietnam, [**Bình Minh Jazz Club**](#binh-minh-jazz), a cuatro manzanas de la Ópera.
      Lo abrió **Quyền Văn Minh**, saxofonista que aprendió jazz de emisiones de onda corta cuando el
      género estaba mal visto y acabó siendo profesor del conservatorio. Toca con su hijo. Es el club de
      jazz más antiguo del país y **no es un local para turistas**.
