slug: dia-6-quan-ba
navLabel: "Día 6 · Quản Bạ"
trip: vietnam
order: 6
eyebrow: El plan · Día 6 · mié 16 sep
title: Arranca el *loop*
dek: >-
  El altiplano amanece por la ventanilla del bus cama. Un par de horas de ducha y siesta en Hà Giang, y
  [el loop](#el-loop) arranca a media mañana —cinco días en moto con conductor-guía—, con una primera
  etapa corta a propósito: hoy no se devoran kilómetros, se rueda el cuerpo y el ojo antes de exigirlo
  todo.
blocks:
  - block: Amanecer
    time: "04:00–09:00"
    title: Bajar del bus, ducha y siesta
    body: >-
      El [**bus cama**](#traslado-ha-giang) deja en **Hà Giang** entre las cuatro y las seis de la mañana, con el
      altiplano ya insinuado en la ventanilla. No se empieza a rodar de golpe: en la habitación que ha
      apartado el operador —**pedida por escrito al reservar**— se cae una ducha y un par de horas de
      sueño horizontal. Después, desayuno y ya sí lo bueno: se conoce al **easy rider** —el piloto local
      que será conductor y guía durante cinco días— y se revisa la moto antes de pagar. Con **dos
      mochilas de cabina** vais ligeros; a la moto sube solo lo del día, el chubasquero y las baterías
      cargadas.
    window:
      label: Por qué esto funciona
      body: >-
        Porque hoy es el único día del loop que puede absorberlo: **52 km y nada más**. Cruzar de noche
        le devuelve un día entero a Ninh Bình sin tocar el loop, y la etapa corta de hoy paga la factura
        del madrugón. La condición es no improvisar la mañana — sin la habitación apartada, la ducha se
        convierte en cinco horas sentados en una acera con las mochilas.
  - block: Mañana
    time: "~52 km"
    title: La primera etapa, corta a propósito
    body: >-
      Solo unos **52 km** separan Hà Giang de Quản Bạ, y se hacen sin prisa. La carretera trepa desde
      el valle hacia el altiplano de Đồng Văn y, a cada curva, el karst se va afilando: pináculos
      grises, maíz plantado entre las rocas, las primeras casas hmong. Es el rodaje del viaje —
      acostumbrar el cuerpo a la moto, al casco y al ritmo de parar cuando el paisaje lo pide.
    window:
      label: Ventana óptima
      body: >-
        Ir en **privado** —dos plazas y guía, no un grupo de diez motos— significa parar donde la luz
        manda y no donde el grupo decide. Con un fotógrafo a bordo eso no es un matiz, y hoy, sin
        kilómetros que devorar, sobra tiempo para hacerlo.
  - block: Media tarde
    time: "media tarde"
    title: La Puerta del Cielo y las montañas gemelas
    body: >-
      Antes de Tam Sơn se para en la [**Puerta del Cielo (Heaven's Gate)**](#quan-ba) de Quản Bạ: un tajo en la
      roca por el que se asoma el valle entero. Abajo, las célebres **montañas gemelas**, dos colinas
      idénticas que emergen redondas del arrozal. En septiembre las terrazas de Quản Bạ y **Nậm Đăm**
      están doradas o casi —una de las pocas bolsas de oro que da el loop, con Hoàng Su Phì descartado
      por falta de días.
    window:
      label: Ventana óptima
      body: >-
        Se llega a **media tarde** a propósito. La Puerta del Cielo es uno de los puntos que se
        masifican a la hora dorada; llegar antes deja la luz cayendo sobre las terrazas y las gemelas
        sin la aglomeración del ocaso, que es justo lo que busca la cámara.
  - block: Noche
    time: "noche"
    title: Homestay en Nậm Đăm
    body: >-
      Se duerme en un homestay de **Nậm Đăm / Quản Bạ**. La cena es en familia, alrededor de la misma
      mesa —eso es la autenticidad del homestay, no el colchón—, y cae pronto. Después, a cargar
      baterías (las de la cámara y las propias): el altiplano de noche sorprende con su frío, y conviene
      tener a mano el forro polar.
    window:
      label: Por qué ahora
      body: >-
        La primera noche de homestay cae pronto, y hoy se agradece el doble: se lleva una noche de bus a
        la espalda y quedan cuatro jornadas de moto por delante. No es solo cansancio — es el ritmo
        natural del norte rural, donde la vida sigue al sol y a las nueve ya no hay nadie despierto.
dormir:
  lugar: "Homestay en Nậm Đăm · lo pone el easy rider"
  ref: '#loop-reserva'
