eyebrow: El plan · Día 16 · sáb 26 sep
title: La mañana de *Greene*, y a casa
dek: >-
  El último día empieza con el único cabo que el viaje llevaba suelto desde Hanói: la calle donde
  transcurre *El americano impasible*, en la ciudad donde se escribió. Un kilómetro andando, un café en
  la terraza correcta, y al aeropuerto.
blocks:
  - block: Mañana
    time: "08:00–10:30"
    title: Đồng Khởi, la vieja rue Catinat
    body: >-
      Desayuno —el último phở del viaje está en [**Phở Minh**](#pho-minh), metido en un callejón de
      Pasteur a quinientos metros— y andando, que aquí todo cae junto. **Đồng Khởi** —«levantamiento de
      masas»— es el nombre
      actual de la **rue Catinat**, el kilómetro que baja de la catedral al río Saigón y por el que
      respira entera la novela de Greene.

      Café en la **terraza del [Hotel Continental](#saigon-hotel)** (1880), que los corresponsales de
      guerra apodaron
      **«Radio Catinat»** porque allí se cruzaban periodistas, mandos militares y espías. **Greene se
      alojaba en la habitación 214**, la de la esquina de la primera planta, elegida para dominar la
      plaza de la Ópera y la calle. Está justo encima de vuestra mesa.

      Enfrente, la **Ópera Municipal** (1897). Y arriba del todo, junto a la catedral, la **Oficina
      Central de Correos** (1891): nave de hierro y cristal como una estación de tren europea, con los
      mapas pintados de la Cochinchina y de las líneas telegráficas de Saigón todavía en las paredes, y
      un retrato enorme del Tío Ho al fondo. Sigue funcionando como oficina de correos.

      Y calle abajo, hasta el **Hotel Majestic**, en la orilla del río.
    window:
      label: Por qué esto cierra el viaje y no otra cosa
      body: >-
        Porque es el tercer vértice. En Hanói os bebisteis el martini de Greene en el
        [Bamboo Bar del Metropole](#metropole); en Ninh Bình pasasteis por
        [Phát Diệm](#phat-diem), desde cuyo campanario miró los combates en 1951. **Pero la novela no
        transcurre en el norte: transcurre aquí.** Y el movimiento es el mismo del Metropole — no dormir
        dentro del icono, sino pagar la consumición y quedarse con el relato.

        *(La **catedral de Notre-Dame sigue en obras hasta 2027** y con andamios. Se ve por fuera, pero no
        esperéis la postal.)*
  - block: Mediodía
    time: "10:45–15:35"
    title: Tân Sơn Nhất y el salto a Hanói
    body: >-
      Al aeropuerto sobre las **10:45** —está a siete kilómetros, pero el tráfico de Saigón es lo que
      es— y **VJ142: Saigón 13:25 → Hanói 15:35**, dos horas y diez.
    window:
      label: Por qué esta hora es la correcta
      body: >-
        Porque **Tân Sơn Nhất se atasca por las tardes** y estáis en temporada de lluvias: hay tardes en
        que a las cinco los paneles dan retrasos de **45 minutos a dos horas** en los vuelos a Hanói, y
        los retrasos se acumulan según avanza el día. Saliendo a mediodía se esquiva casi todo eso.

        Con la llegada a las 15:35 os sobran **más de cinco horas** antes del vuelo largo. Conviene
        saber que **el VJ142 acumula retrasos con frecuencia —unos 38 minutos de media—**, pero incluso
        con dos horas de retraso llegaríais. Y si en Saigón veis que se va de las manos, **cambiad al
        siguiente en el mostrador**: la ruta tiene salidas cada media hora.
  - block: Tarde
    time: "15:35–20:40"
    title: El enlace en Nội Bài, y el vuelo largo
    body: >-
      El VJ142 aterriza en **T1** (nacional) y salís por **T2** (internacional). Los une una **lanzadera
      eléctrica gratuita cada quince minutos**, con **cuatro o cinco minutos** de trayecto; se coge en la
      zona A de la planta baja de T1. Como **voláis solo con cabina**, no hay maletas que recoger: de
      pisar la pasarela a estar en el mostrador de T2 son unos cuarenta minutos.

      En la terminal internacional sobre las **16:20**, y el vuelo largo a casa a las **20:40**.
    window:
      label: El único riesgo del día
      body: >-
        Son **billetes separados**: si el VJ142 se retrasa, la aerolínea de casa no responde por
        vosotros. Por eso el margen no es un lujo — y por eso el vuelo es el de mediodía y no uno de la
        tarde. Llevad el localizador del vuelo largo a mano.
  - block: Noche
    time: "20:40"
    title: Se acabó
    dim: true
    body: >-
      Dieciséis días desde el casco viejo de Hanói hasta aquí, con el altiplano de Đồng Văn, el karst de
      Ninh Bình, el equinoccio sobre Angkor Wat y una calle de farolillos en Chợ Lớn por el camino. Se
      duerme en el avión.
