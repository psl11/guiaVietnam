navLabel: "Día 11 · Hanói"
trip: vietnam
order: 11
eyebrow: El plan · Día 11 · lun 21 sep
title: El *último* día en Hanói
dek: >-
  Con Saigón en el plan, este deja de ser un día colchón sin agenda y pasa a ser **la última vez que
  pisáis la capital**. Sigue siendo el airbag antitifón —esa función no se pierde—, pero si el loop
  salió bien hay que exprimirlo: el circuito del Lago del Oeste, que antes vivía en el día 15, se ha
  mudado aquí.
blocks:
  - block: Cómo llegar, y la decisión del domingo
    time: "según el bus"
    title: De Hà Giang a Hanói
    body: >-
      Hay dos formas, y **se decide el domingo por la tarde, no antes**:

      **Si el loop terminó en hora**, coged el **bus cama la noche del 20** (salidas de 20:15 a 22:00,
      6-7 h): llegáis entre las cuatro y las seis de la mañana, dormís unas horas más en el hotel y
      **tenéis el lunes entero**. Reservad la habitación desde la noche del 20 para poder entrar de
      madrugada.

      **Si el loop se retrasó** por lluvia o carretera cortada, dormid en Hà Giang y bajad en el **bus
      diurno** del lunes (6-7 h, salida de mañana, llegada a media tarde). Perdéis media jornada de
      Hanói, pero **no perdéis el vuelo de mañana**, que es lo que importa.
    window:
      label: Por qué esto sigue siendo el airbag
      body: >-
        Porque **el vuelo a Camboya es el martes 22 y no se mueve**. Este lunes es lo único que separa el
        final del loop de un vuelo internacional: si un temporal os retrasa un día, se come este día y no
        el viaje. Por eso el bus nocturno es **un premio si todo fue bien**, no una obligación.
  - block: Mediodía
    time: "si llegasteis de madrugada"
    title: El Templo de la Literatura, que abre los lunes
    body: >-
      El **lunes** juega en contra: cierran casi todos los museos —Etnología, Hỏa Lò, Bellas Artes—. Pero
      el [**Templo de la Literatura**](#van-mieu) **no** (8:00–17:00): Văn Miếu, de **1070**, la primera
      universidad de Vietnam, cincuenta y cuatro mil metros cuadrados en cinco patios sucesivos con las
      estelas de los doctores sobre tortugas de piedra. Es el gran monumento que absorbe bien un lunes
      sin prisa.
    window:
      label: Solo si bajasteis de noche
      body: >-
        Si llegáis a media tarde en el bus diurno, esto se cae y el día empieza directamente en el Lago
        del Oeste. No pasa nada: **Văn Miếu también cabe la mañana del domingo 13**.
  - block: Tarde
    time: "15:30–18:30"
    title: El circuito del Lago del Oeste
    body: >-
      La tarde se va al noroeste, y es el mejor paseo que le queda a Hanói. La
      [**pagoda Trấn Quốc**](#pagoda-tran-quoc): **la más antigua de la ciudad**, unos **mil
      cuatrocientos cincuenta años**, con su estupa roja de once pisos sobre una península del **Hồ Tây**.
      Al lado, el [**Phủ Tây Hồ**](#phu-tay-ho), templo del culto a las diosas madre.

      Y entre las callejas, dos cosas que no se buscan solas: el
      [**B-52 caído en el lago Hữu Tiệp**](#lago-b52), derribado en 1972 y todavía medio sumergido entre
      las casas, y el [**memorial de McCain**](#memorial-mccain) a la orilla del Trúc Bạch, donde cayó su
      avión.
    window:
      label: Ventana óptima
      body: >-
        **Al caer la tarde.** El Lago del Oeste mira al poniente y la estupa de Trấn Quốc se pone de
        color con el sol bajo; a mediodía es una postal plana. Y en septiembre el chubasco suele venir a
        media tarde: si cae, se espera en un café y se sale después, que es cuando mejor queda.
  - block: Noche
    time: "19:00 en adelante"
    title: Trúc Bạch, y una última copa
    body: >-
      Se cena donde acaba el paseo. En la isla de [**Ngũ Xã**](#ngu-xa) nació el ***phở cuốn*** —el phở
      convertido en rollito fresco— y hay una calle entera dedicada a él. Al lado, dos opciones muy
      distintas: [**Aummee**](#aummee), chay budista en cuatro plantas, o el
      [**Mậu Dịch Số 37**](#mau-dich-37), que reconstruye una tienda estatal de racionamiento de 1980 —
      con cartilla en la mesa y cupones para pagar.

      Y si queda cuerpo, el [**Bình Minh Jazz Club**](#binh-minh-jazz), a cien metros de la Ópera:
      directo a las 21:00 todas las noches, sin reserva, en el club que fundó el primer jazzman del país.
    window:
      label: Lo que hay que aceptar
      body: >-
        Que Hanói se queda en **el 12, el 13 y hoy**. Con Saigón dentro, la capital pierde el viernes y
        el sábado que tenía, y cosas como el **Museo de Bellas Artes** o la **Ciudadela de Thăng Long**
        solo entran si les hacéis hueco el domingo 13. Es el precio del cambio, y conviene tenerlo en la
        cabeza al planificar los dos primeros días — no al descubrirlo hoy.
