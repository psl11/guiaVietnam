slug: dia-11-hanoi-vuelta
navLabel: "Día 11 · a Camboya"
trip: vietnam
order: 11
eyebrow: El plan · Día 11 · lun 21 sep
title: Del altiplano a *Angkor* en un día
dek: >-
  El día que el bus cama convierte en puente. Se amanece bajando de la montaña en literas, se cae en
  una cama de Hanói a las cuatro de la mañana, y a media tarde se vuela a Camboya. No es un día de
  ver cosas: es el día que le regala **una jornada entera a Angkor**, que era la pieza peor tratada
  del viaje.
blocks:
  - block: Madrugada
    time: "~04:00"
    title: Llegar a Hanói dormidos
    body: >-
      El sleeper de Hà Giang deja en Hanói entre las **03:30 y las 05:00**. Por eso la habitación del
      [Hòa Bình](#hoa-binh) está reservada **desde la noche del 20**, aunque esa noche se pase en el
      autobús: es la única forma de entrar de madrugada, ducharse y dormir tres o cuatro horas más en
      horizontal en vez de esperar a las dos de la tarde con las mochilas a cuestas.
    dim: true
    window:
      label: Por qué se paga una noche que no se duerme
      body: >-
        Porque cuesta unos sesenta euros y compra lo único que hoy no se puede improvisar: **una ducha y
        una cama a las cuatro de la mañana** después de cinco días de moto. Sin eso, este día se convierte
        en diez horas de deambular por el casco viejo esperando un vuelo.
  - block: Mañana
    time: "hasta ~13:00"
    title: Recuperar, y nada más
    body: >-
      Dormir, la colada —que después del loop no es un capricho—, y cargar del todo las baterías, las de
      la cámara y las vuestras. Si queda cuerpo, el casco viejo está en la puerta y hay un
      [egg coffee](#cafe-giang) esperando; si no, la mejor decisión del día es no hacer nada.

      Las mochilas, ligeras: a Camboya se va **solo con cabina**.
    dim: true
    window:
      label: El único día del viaje que se defiende vacío a propósito
      body: >-
        Antes era el colchón antitifón y se guardaba en blanco por si el loop se retrasaba. Ahora ese
        colchón ya no existe —se ha gastado en ganar un día de Angkor— y este espacio pasa a tener otro
        trabajo, igual de importante: **que no lleguéis a Camboya reventados**. Mañana el despertador
        suena de madrugada.
  - block: Tarde
    time: "16:20–19:15"
    title: El vuelo VJ913 a Siem Reap
    body: >-
      Traslado a Nội Bài y **vuelo VJ913 (VietJet): Hanói 16:20 → Siem Reap 18:05**, directo, hora y
      media escasa rumbo al suroeste sobre Laos — el rato justo para llegar a Camboya con
      [los deberes hechos](#camboya-cine-libros): las películas y los libros que la piedra de Angkor no
      os va a contar. Se aterriza en **SAI**, el aeropuerto nuevo, a unos 45 km al este de la ciudad:
      transfer del hotel, casi una hora entre campos, y a la habitación de **Wat Bo** hacia las 19:15.
    window:
      label: Lo que hay que asegurar al comprarlo
      body: >-
        Este billete es el que absorbe todo el riesgo del plan nuevo, porque **entre el final del loop y
        este despegue no queda ni un día de margen**. Cómpralo en **tarifa modificable**, no en la
        básica: la diferencia de precio es exactamente el seguro que se ha quitado del itinerario. El
        VJ913 vuela **a diario**, así que si algo se tuerce, hay vuelo al día siguiente — pero solo si la
        tarifa deja moverlo.
  - block: Noche
    time: "~20:00"
    title: Primera cena jemer
    body: >-
      Cena tranquila en la zona de **Wat Bo** y a la cama pronto: lleváis un bus nocturno y un vuelo a
      la espalda y mañana empieza Angkor de verdad. El [circo Phare](#phare-circo) se ha movido a
      **mañana por la noche**, que es donde ahora encaja sin apretar.
    dim: true
    window:
      label: Por qué el circo ya no es hoy
      body: >-
        Antes el Phare iba en la noche de llegada porque era la única velada sin madrugón al día
        siguiente. Con un día más en Camboya eso deja de ser cierto: **hoy llegáis molidos de verdad** y
        mañana no hay amanecer que preparar. El circo gana y vosotros también.
dormir:
  lugar: "Siem Reap · Wat Bo"
  ref: '#siem-reap-hotel'
