navLabel: "Día 15 · Saigón"
trip: vietnam
order: 15
eyebrow: El plan · Día 15 · vie 25 sep
title: Saigón, y la *otra mitad* de la guerra
dek: >-
  El único día completo en el sur, y va cargado a propósito. Por la mañana, la guerra contada desde el
  bando contrario al que la habéis venido oyendo. Por la tarde, un barrio chino que es una ciudad
  dentro de la ciudad. Y de noche, Trung Thu — porque hoy es la fiesta y aquí también tienen su calle
  de farolillos.
blocks:
  - block: Mañana
    time: "07:30–10:00"
    title: El Museo de los Vestigios de la Guerra
    body: >-
      A la apertura, en el 28 de Võ Văn Tần, antes del calor y de los autobuses. Dos horas y media
      largas, y no son fáciles: las salas de crímenes de guerra, la del **agente naranja** —dura de
      verdad— y, arriba, la que justifica el viaje entero.

      Se llama ***Requiem***. Es la colección que montaron **Tim Page y Horst Faas** con el trabajo de
      **134 fotógrafos de todos los bandos que murieron cubriendo Indochina entre 1945 y 1975**. Las
      copias van impresas en grande y con la luz muy baja, colocadas para que se camine despacio. Es la
      planta donde la gente deja de hablar.
    window:
      label: Por qué esto es el corazón del día
      body: >-
        Porque en Hanói habréis visto [**Hỏa Lò**](#hoa-lo), el «Hanoi Hilton», y el
        [**B-52 caído en el lago Hữu Tiệp**](#lago-b52). Eso es la guerra contada desde el norte, desde
        quien la ganó. Esto es el otro lado del espejo. **El viaje pasa de contar media guerra a
        contarla entera** — y ese es, más que Saigón, el motivo real de estar aquí.
  - block: Media mañana
    time: "10:15–11:45"
    title: El Palacio de la Reunificación
    body: >-
      A diez minutos andando. Es, literalmente, **donde se acabó la guerra**: el **30 de abril de 1975**
      un tanque del ejército del norte derribó la verja y entró en el jardín, y esa fotografía dio la
      vuelta al mundo. En el césped hay dos tanques de aquel día.

      Por dentro está **congelado en los sesenta** —moqueta, teléfonos de baquelita, salas de recepción
      de estado, la sala de mapas— y abajo se bajan **los búnkeres**: pasillos estrechos, radios de
      campaña y los mapas todavía colgados en las paredes.
  - block: Mediodía · siesta
    time: "12:00–15:00"
    title: Comer y desaparecer del sol
    dim: true
    body: >-
      Comida por la zona y siesta. No es opcional: finales de septiembre en Saigón son **treinta y
      tantos grados con humedad alta y chaparrón casi diario por la tarde**, y lleváis quince días de
      viaje encima.
  - block: Tarde
    time: "15:30–18:00"
    title: Chợ Lớn, la ciudad dentro de la ciudad
    body: >-
      Veinte minutos al oeste está **Chợ Lớn**, que no es un barrio chino: es **el barrio chino más
      grande de Vietnam** y lleva ahí desde el siglo XVIII. La parada obligatoria es la **pagoda Thiên
      Hậu**, dedicada a la diosa del mar que protegía a los que cruzaban desde Fujian: dentro cuelgan del
      techo **espirales de incienso enormes que arden durante días**, y la luz entra por el patio central
      entre el humo. Al lado, el mercado de **Bình Tây**, con su torre del reloj afrancesada.
    window:
      label: Ojo con la hora
      body: >-
        **Thiên Hậu cierra a media tarde** —sobre las 16:30—, así que es lo primero al llegar. El mercado
        aguanta más. Y conviene quedarse por la zona en vez de volver al centro: lo de esta noche es aquí
        mismo.
  - block: Noche
    time: "19:00–23:00"
    title: Trung Thu en la calle de los farolillos
    body: >-
      Y aquí está el remate del viaje. **Lương Nhữ Học**, a diez minutos de la pagoda: **trescientos
      metros de calle con miles de farolillos**, más de **cincuenta años** de tradición ligada a la
      comunidad china del barrio, con faroles de carpa, estrella y mariposa **hechos a mano en bambú y
      celofán** junto a los modernos de led y música.

      Y hoy no es una noche cualquiera: **hoy es Trung Thu**, el día 15 de la octava luna. La fiesta de
      los niños. Familias enteras con los críos y la linterna, danzas del león, pasteles de luna.

      Y para cerrar el viaje, de vuelta al Distrito 1: el **Saigon Saigon Bar**, la azotea del
      **Caravelle** (1959), que abre hasta tarde. Ahí tuvieron oficina las delegaciones de **NBC, ABC y
      CBS**, y desde la **décima planta** los corresponsales veían el frente **con la cerveza en la
      mano** — en la ofensiva del Tet del 68 y en el asalto final de 1975. Apenas ha cambiado.

      Es el otro extremo del hilo que mañana se cierra en la terraza del **Continental**: allí es el
      Saigón de Greene y los años cincuenta; aquí, el de los reporteros de la guerra americana. Dos
      barras y dos guerras, a cuatro manzanas.
    window:
      label: La hora buena, y por qué aquí y no en Hanói
      body: >-
        **De siete a nueve**, que es cuando la calle está llena y todavía se puede andar. Y sí: en Hanói
        habríais tenido Hàng Mã, que es la otra gran calle de farolillos del país. Pero Hàng Mã está
        decorada **desde principios de septiembre** y Lương Nhữ Học es **la tradición más antigua de las
        dos**. No habéis cambiado la fiesta por una ciudad — habéis cambiado de calle, y en la noche que
        toca.
dormir:
  lugar: "Saigón · Distrito 1"
  ref: '#saigon-hotel'
