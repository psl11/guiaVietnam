slug: dia-12-siem-reap
navLabel: "Día 12 · Hoi An → Siem Reap"
trip: vietnam
order: 12
eyebrow: El plan · Día 12 · mar 22 sep
title: Hoi An al *amanecer*, y el salto a Camboya
dek: >-
  El día con más piezas del viaje, y todas cortas. Empieza con el casco viejo de Hoi An vacío a las
  seis de la mañana —que es la mejor hora que da esta ciudad—, sigue con un vuelo al norte y, si el
  reloj acompaña, un último mordisco de Hanói camino del aeropuerto. Al caer la tarde ya estáis al
  otro lado del mapa de Indochina.
blocks:
  - block: Amanecer
    time: "05:45–07:45"
    title: El casco viejo, sin nadie
    body: >-
      Fuera de la cama a las cinco y media, y esta es la razón de haber dormido dos noches aquí.
      **Entre las seis y las siete y media no hay nadie**: las casas de madera cerradas, los farolillos
      colgados y apagados, el río quieto y la luz entrando rasante por Nguyễn Thái Học. Es literalmente
      la misma ciudad de anoche sin las cuatro mil personas de anoche.

      El **puente japonés** sin cola, el **mercado central** montándose sobre las seis y media —pescado
      del Thu Bồn, hierbas de Trà Quế, sombreros cónicos de trabajar y no de recuerdo— y las barcas
      saliendo a remo. Desayuno en un puesto del mercado y a por las mochilas.
    window:
      label: Por qué esta hora y no otra
      body: >-
        Porque **Hoi An tiene dos ciudades y comparten calles**. Los autobuses de Đà Nẵng empiezan a
        descargar sobre las nueve y hasta las cuatro de la tarde el casco viejo es un pasillo de gente.
        Antes de las ocho es un pueblo de pescadores del siglo XVIII. Si solo pudierais estar aquí dos
        horas, **son estas** — y por eso caen el último día, cuando ya sabéis dónde mirar.
  - block: Mañana
    time: "08:00–11:20"
    title: A Đà Nẵng y vuelta al norte
    body: >-
      Coche a **Đà Nẵng** (45 min, 30 km) y vuelo a **Hanói**, hora y veinte. La ventana buena es
      **entre las nueve y las diez y media** — el porqué, con todos los números, está en
      [los vuelos a Hoi An](#vuelos-hoi-an), y no es un detalle menor: es la única costura del viaje
      donde dos billetes separados se tocan.
    window:
      label: La regla de hoy, y es una sola
      body: >-
        **Todo lo que viene después de aterrizar es opcional; el VJ913 de las 16:20 no.** Si el vuelo
        de Đà Nẵng sale con retraso, se cancela el paseo por Hanói y se va directo a la terminal
        internacional. No se improvisa sobre la marcha: la decisión se toma **al embarcar en Đà Nẵng**,
        mirando la hora real de salida.
  - block: Mediodía
    time: "11:45–14:40"
    title: El último mordisco de Hanói
    body: >-
      Si habéis aterrizado en hora, queda tiempo para lo mejor que le quedaba a la ciudad — y encima
      **cae de camino al aeropuerto**, al norte, cruzando después el puente **Nhật Tân**.

      El [**B-52 caído en el lago Hữu Tiệp**](#lago-b52): derribado en la Navidad de **1972** y todavía
      medio sumergido en un estanque de barrio, entre casas y tendederos. A la orilla del Trúc Bạch, el
      [**memorial de McCain**](#memorial-mccain), donde cayó su avión en 1967 — el mismo hombre que
      acabaría empujando la normalización con Vietnam. Y para cerrar, la
      [**pagoda Trấn Quốc**](#pagoda-tran-quoc), **la más antigua de Hanói**, con su estupa roja de once
      pisos sobre una península del **Hồ Tây**.

      Comida rápida junto al lago y a **Nội Bài**, terminal internacional, sobre las **14:40**.
    dim: true
    window:
      label: Qué se cae si vais justos
      body: >-
        **Por este orden: primero el [Phủ Tây Hồ](#phu-tay-ho), después Trấn Quốc.** Lo que no se toca
        es el B-52 y el memorial, y no por bonitos: con ellos habréis visto **la guerra contada por
        quien la ganó**, y el viernes en Saigón veréis el otro lado del espejo. Sin esa mitad, el
        Museo de los Vestigios pierde la mitad de su fuerza.
  - block: Tarde
    time: "16:20–19:15"
    title: El vuelo VJ913 a Siem Reap
    body: >-
      Traslado a Nội Bài y **vuelo VJ913 (VietJet), ya reservado: Hanói 16:20 → Siem Reap 18:05**,
      directo, hora y media escasa rumbo al suroeste sobre Laos —el rato justo para llegar a Camboya con
      [los deberes hechos](#camboya-cine-libros): las películas y los libros que la piedra de Angkor no os
      va a contar—. Se aterriza en **SAI**, el aeropuerto
      nuevo (inaugurado a finales de 2023, a unos 45 km al este de la ciudad): transfer del hotel, casi
      una hora entre campos, y a la habitación de la zona de **Wat Bo** hacia las 19:15.
    window:
      label: Por qué este vuelo
      body: >-
        De los dos únicos directos —los dos de tarde— este es el barato, y llega con margen de sobra: da
        tiempo a dejar las mochilas, cenar algo y sentarse en el circo. El colchón contra un retraso se guarda
        para lo que de verdad importa —el amanecer de mañana—; esta noche, si VietJet se demora, no se
        pierde nada irremplazable.
  - block: Noche
    time: "~20:00"
    title: Cena en Wat Bo y el circo Phare
    body: >-
      Cena rápida en la zona de **Wat Bo** y, a las **20:00**, [**Phare, el circo camboyano**](#phare-circo):
      teatro-circo narrativo, sin animales, unos setenta minutos bajo una carpa pequeña. No es solo un
      espectáculo. Phare nació de **Phare Ponleu Selpak**, la escuela de artes que nueve jóvenes
      ex-refugiados fundaron en Battambang en 1994 —habían aprendido a dibujar como terapia en un campo
      tras los jemeres rojos—, y los artistas de la pista son sus alumnos becados: cada entrada financia
      la escuela. La manera de que la primera noche en Camboya no sea solo un traslado.
    window:
      label: Ventana óptima
      body: >-
        **Ojo con el reloj, que va justo**: aterrizáis a las 18:05, el transfer desde SAI es casi una
        hora y el circo empieza a las 20:00. Sale, pero sin margen — y mañana el despertador suena a las
        4:15. **Si el vuelo se retrasa, dejadlo caer sin pena**: es lo más prescindible del bloque
        camboyano y lo único que se puede soltar sin romper nada.

        Aun así se mete **en la noche de llegada** a propósito: es la única velada en que aún no
        madrugáis. Las dos tardes de templos que vienen se reservan para el crepúsculo sobre el agua, y
        esta noche —sin amanecer todavía que preparar— es la que sobra para sentarse bajo la carpa. Eso
        sí: el despertador suena a las **4:15**, así que a la cama pronto.
