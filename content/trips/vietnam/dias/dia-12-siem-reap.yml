eyebrow: El plan · Día 12 · mar 22 sep
title: "*Llegada* a Siem Reap"
dek: >-
  Un día partido entre dos países. La mañana es el último Hanói, y no una mañana muerta de espera —es el
  circuito del Lago del Oeste, que cierra el hilo de la guerra del norte y encima va camino del
  aeropuerto—. Al caer la tarde, un vuelo de hora y media os deja al otro lado del mapa de Indochina, en
  la ciudad de los templos. Y la noche se abre con un circo que es, en realidad, una escuela.
blocks:
  - block: Mañana
    time: "08:00–12:00"
    title: El circuito del Lago del Oeste
    body: >-
      No hay vuelo matinal a Siem Reap —solo dos al día y los dos vespertinos—, así que la mañana del 22
      es de Hanói. Y hay una forma de gastarla que no es matar el tiempo, porque **todo el circuito va
      en línea recta hacia el norte, que es hacia el aeropuerto**. Se sale del hotel con las mochilas y
      no se vuelve.

      Primero, el [**B-52 caído en el lago Hữu Tiệp**](#lago-b52): derribado en la Navidad de **1972**,
      todavía medio sumergido en un estanque de barrio, entre casas y tendederos. Después, a la orilla
      del Trúc Bạch, el [**memorial de McCain**](#memorial-mccain), donde cayó su avión en 1967 — el
      mismo hombre que acabaría siendo candidato a la presidencia de Estados Unidos y empujando la
      normalización con Vietnam.

      Y luego lo tranquilo: la [**pagoda Trấn Quốc**](#pagoda-tran-quoc), **la más antigua de Hanói**
      —unos mil cuatrocientos cincuenta años— con su estupa roja de once pisos sobre una península del
      **Hồ Tây**; y arriba del todo, el [**Phủ Tây Hồ**](#phu-tay-ho), el templo del culto a las diosas
      madre, el *đạo Mẫu* que la UNESCO reconoció como patrimonio inmaterial. Comida junto al lago y a
      Nội Bài por el **puente Nhật Tân**, que sale justo de ahí.
    window:
      label: Lo que se gana y lo que se pierde por hacerlo de mañana
      body: >-
        **Se pierde la luz.** El Hồ Tây mira al poniente y la estupa de Trấn Quốc con el sol bajo es la
        postal clásica de Hanói; de mañana es correcta y poco más. **Y se gana el sitio vacío**: al
        atardecer esa península es el punto más fotografiado de la ciudad y a las diez de la mañana no
        hay nadie. Es un intercambio consciente — el precio de haber estado ayer en Hoi An.

        Lo que no depende de la hora es el otro hilo, y es el que importa: con el B-52 y el memorial de
        McCain habréis visto **la guerra contada por quien la ganó**. El viernes, en Saigón, veréis el
        otro lado del espejo.
  - block: Tarde
    time: "16:20–19:15"
    title: El vuelo VJ913 a Siem Reap
    body: >-
      Traslado a Nội Bài y **vuelo VJ913 (VietJet), ya reservado: Hanói 16:20 → Siem Reap 18:05**,
      directo, hora y media escasa rumbo al suroeste sobre Laos —el rato justo para llegar a Camboya con
      [los deberes hechos](#camboya-cine-libros): las películas y los libros que la piedra de Angkor no os
      va a contar—. Se aterriza en **SAI**, el aeropuerto
      nuevo (inaugurado a finales de 2023, a unos 45 km al este de la ciudad): transfer del hotel, casi
      una hora entre campos, y a la habitación de la zona de **Wat Bo** hacia las 19:15.
    window:
      label: Por qué este vuelo
      body: >-
        De los dos únicos directos —los dos de tarde— este es el barato, y llega con margen de sobra: da
        tiempo a dejar las mochilas, cenar algo y sentarse en el circo. El colchón contra un retraso se guarda
        para lo que de verdad importa —el amanecer de mañana—; esta noche, si VietJet se demora, no se
        pierde nada irremplazable.
  - block: Noche
    time: "~20:00"
    title: Cena en Wat Bo y el circo Phare
    body: >-
      Cena rápida en la zona de **Wat Bo** y, a las **20:00**, [**Phare, el circo camboyano**](#phare-circo):
      teatro-circo narrativo, sin animales, unos setenta minutos bajo una carpa pequeña. No es solo un
      espectáculo. Phare nació de **Phare Ponleu Selpak**, la escuela de artes que nueve jóvenes
      ex-refugiados fundaron en Battambang en 1994 —habían aprendido a dibujar como terapia en un campo
      tras los jemeres rojos—, y los artistas de la pista son sus alumnos becados: cada entrada financia
      la escuela. La manera de que la primera noche en Camboya no sea solo un traslado.
    window:
      label: Ventana óptima
      body: >-
        **Ojo con el reloj, que va justo**: aterrizáis a las 18:05, el transfer desde SAI es casi una
        hora y el circo empieza a las 20:00. Sale, pero sin margen — y mañana el despertador suena a las
        4:15. **Si el vuelo se retrasa, dejadlo caer sin pena**: es lo más prescindible del bloque
        camboyano y lo único que se puede soltar sin romper nada.

        Aun así se mete **en la noche de llegada** a propósito: es la única velada en que aún no
        madrugáis. Las dos tardes de templos que vienen se reservan para el crepúsculo sobre el agua, y
        esta noche —sin amanecer todavía que preparar— es la que sobra para sentarse bajo la carpa. Eso
        sí: el despertador suena a las **4:15**, así que a la cama pronto.
