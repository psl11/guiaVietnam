quePedir: >-
  Un ***cà phê sữa đá*** en cualquiera de las plantas altas, en un balcón que dé a Nguyễn Huệ. Lo que se
  paga es la vista, y son dos euros.
body: >-
  **No es una cafetería: es un edificio entero de cafeterías.** Un bloque de viviendas de los años
  sesenta en plena avenida peatonal de Nguyễn Huệ donde **cada apartamento se ha convertido en un local
  distinto** — café de especialidad, librerías, tiendas de ropa, heladerías— repartidos por nueve
  plantas, con los balcones encendidos como un panal cuando cae la luz.

  Es la primera imagen que vais a tener del sur y resume bien la diferencia con Hanói: **donde el norte
  conserva, el sur recicla**. El mismo hormigón que en otra ciudad sería una ruina aquí es lo más
  fotografiado del centro.

  **Práctico:** hay **un ascensor y cobra 3.000 ₫** por subida; la escalera es gratis y son nueve pisos.
  Y la hora buena es **entre las seis y las siete**, cuando se encienden los balcones y todavía queda
  cielo. Los locales cambian cada temporada, así que **no vale la pena fijar uno**: se sube, se mira y se
  elige balcón.
