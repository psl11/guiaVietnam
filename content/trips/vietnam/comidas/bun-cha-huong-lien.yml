body: >-
  Donde **Obama y Anthony Bourdain** cenaron por seis dólares en *Parts Unknown* (2016) — hay una
  mesa-vitrina que lo conmemora. Bún chả honesto y barato: cerdo a la brasa con fideos de arroz y
  hierbas. El valor es tanto el plato como la peregrinación cinéfila.


  **Y aquí se separa la mesa, veinticinco minutos.** Esto es cerdo a la brasa nadando en *nước mắm*:
  no hay versión que valga, y fingir lo contrario sería engañarla. Pero
  [**Cơm Chay Nàng Tấm**](#com-chay-nang-tam) está **dos manzanas al norte**, en Trần Hưng Đạo, y
  sirve de 10:00 a 14:00. Así que él baja a Lê Văn Hưu a por el Combo Obama —que se come en veinte
  minutos de pie— y ella sube al *chay* más antiguo de Hanói, donde el tofu y la seta imitan
  precisamente esa misma carne. Se juntan a las 13:00 y se van juntos al
  [Museo de Bellas Artes](#museo-bellas-artes). **Nadie renuncia a nada.**
