body: >-
  El **chay del Lago del Oeste**: cuatro plantas serenas junto al lago de Trúc Bạch, con una carta
  larguísima de cocina budista vegetal, cuidada de sabor y de plato. Cae **al lado de Ngũ Xã**, en Trúc Bạch, o sea en
  la parada del día 2 a las 14:00 — buena para tenerlo fichado, lejos para cenar: son tres kilómetros
  de vuelta al casco viejo con función a las 20:00. Uno de los *chay* mejor valorados por la comunidad vegetariana de la ciudad.
