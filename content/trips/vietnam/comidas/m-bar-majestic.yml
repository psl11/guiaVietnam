body: >-
  **La otra azotea histórica, y la que mira al agua.** El **Majestic** es de **1925**, art déco de
  arriba abajo, y está plantado donde Đồng Khởi —la vieja **rue Catinat**— muere en el **río Saigón**.
  Desde su octava planta se ve el río entero con los cargueros subiendo, que es una vista que el
  [Caravelle](#saigon-saigon-bar) no tiene.

  Durante la guerra fue el otro puesto de observación de la prensa: más discreto que el Caravelle, con
  vistas al puerto y a los movimientos de barcos. Hoy es tranquilo y bastante más barato que su vecino.

  **Aviso: con el vuelo del 24 movido a las 19:40, esta se ha quedado sin hueco.** Llegáis a Saigón a
  las 22:15 el jueves, el viernes al atardecer estáis en Chợ Lớn y el sábado voláis a mediodía. Queda
  como lo que es — la azotea que se visita si algún plan se cae y aparece una tarde libre.


  **Cuál de los dos, si solo da tiempo a uno.** El **Caravelle** si queréis la ciudad, los neones y el
  peso de la historia —y lo tenéis ya en el plan de la noche del 15—. El **Majestic** si queréis el río
  y el atardecer, que cae mejor **la primera tarde, el día 14**, cuando llegáis a las cinco y no hay nada
  programado. Está en el arranque del paseo del día 16, así que también sirve de última parada.
