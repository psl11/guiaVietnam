body: >-
  El **mercado viejo** de Siem Reap: laberinto de souvenirs y, en el centro, un **mercado húmedo** real
  —fruta, pescado, *prahok*— con una **zona de puestos de comida** a precio de calle. Valen aquí **las
  mismas cuatro señales que en [Tạ Hiện](#casco-viejo-ta-hien)**, con un matiz jemer: el puesto bueno
  suele tener **la olla al fuego y no en caliente**, y se pide señalando la cazuela y no la foto del
  cartel — que en Siem Reap suele estar en cuatro idiomas y no querer decir nada. La mesa vegetariana
  rasca poco (casi todo lleva cerdo o pescado), pero los **batidos de fruta** y el ambiente valen la visita.
