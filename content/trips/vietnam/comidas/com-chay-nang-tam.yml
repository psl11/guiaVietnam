quePedir: >-
  La cocina *chay giả mặn* —vegetal que **imita** a la carne—: «pollo» de tofu a la citronela,
  «cerdo» de seta, *nem* vegetales. El menú cerrado es la vía cómoda para probar de todo.
body: >-
  El **abuelo de los vegetarianos de Hanói**: abierto en **1995**, fue el primer restaurante *chay*
  de la ciudad, y sigue en sus trece —tofu y fruto del pan convertidos en «carnes» con una destreza
  que desarma—. Escondido entre embajadas en Trần Hưng Đạo, es una **cena vegetariana con solera**, a
  un paseo del casco viejo. La casa donde el *chay* de Hanói empezó a tomarse en serio.


  **Es la respuesta al único agujero del plan.** El domingo se come en
  [**Bún chả Hương Liên**](#bun-cha-huong-lien) —cerdo a la brasa y salsa de pescado, la peregrinación
  de Obama y Bourdain—, y ahí ella no tiene nada. Nàng Tấm está **dos manzanas al norte**, abre de
  **10:00 a 14:00** y hace justo el chiste contrario: *chay giả mặn*, tofu y seta disfrazados de la
  misma carne que él está comiendo a trescientos metros. Veinticinco minutos separados y a las 13:00
  juntos otra vez.
