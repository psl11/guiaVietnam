body: >-
  El **fichaje del año**: abrió junto al **Lago del Oeste** a finales de 2024 y en siete meses se llevó
  el **Campari One To Watch** de Asia's 50 Best Bars 2025, debutando en el puesto 83. Fusiona
  **ingredientes vietnamitas** y técnica de vanguardia —destilación molecular, redestilados al vacío—
  en un espacio donde la artesanía tradicional se cruza con el diseño contemporáneo. Y ahí está su pega: **su ubicación lo ataba al día del Lago del Oeste, y ese día ya no existe**.
  Al entrar Hoi An en el viaje, Hanói se quedó en dos jornadas y el Tây Hồ se redujo al paso de veinte
  minutos del día 2. Queda anotado como lo que es —**la mejor coctelería nueva de la ciudad**— para
  quien tenga una tarde suelta, no como parada del plan.
