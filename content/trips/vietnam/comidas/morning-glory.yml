  ahumada, ensaladas de hierbas del huerto, verduras salteadas. Aun así hay que decir *«không nước mắm»*
  para la salsa de pescado.
badge: "Lonely Planet · top pick"
quePedir: >-
  Los **calamares rellenos de cerdo** y la **mousse de gamba a la brasa sobre caña de azúcar**, que son
  los platos por los que existe la casa. Y la **berenjena ahumada**, que es lo que se pide para ella.
body: >-
  El sitio que **Lonely Planet pone el primero de todo Hoi An**, y con razón. Lo lleva **Trịnh Diễm Vy**,
  que es a la cocina de esta ciudad lo que una matriarca: empezó con un puesto en el mercado, montó el
  **Mermaid** en el número 2 de Trần Phú —eligió esa esquina por estar pegada al mercado, para tener el
  género a mano— y de ahí salió esta casa.

  Lo que hace, y es la diferencia con los cincuenta restaurantes de la misma calle, es **coger la cocina
  de puesto callejero del centro de Vietnam y hacerla bien** en un edificio antiguo, sin convertirla en
  fusión. Sale barato para lo que es.

  Y da la casualidad de que **la cocina del centro es probablemente la más compleja del país**: siglos de
  contacto con China, Japón y Europa, y hierbas de los huertos de [Trà Quế](#dia-11-hoi-an) que veréis al
  día siguiente.
