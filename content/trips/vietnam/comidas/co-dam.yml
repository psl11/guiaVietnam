quePedir: >-
  No hay carta: se elige entre el **menú corto y el largo**. Clásicos vietnamitas reinterpretados y
  emplatados con oficio de casa de estrella, servidos como un relato de principio a fin.
body: >-
  **Antes de reservar conviene saber que es hermano de [Ưu Đàm](#uu-dam-chay)**: los dos son de la
  misma casa —Hà Đỗ, que además lleva el buffet Sadhu—, así que no son dos hallazgos sino uno con dos
  formatos. Ưu Đàm es el **Bib Gourmand** y se come a la carta en una hora; **Cồ Đàm es la versión de
  alta cocina y solo sirve menú cerrado**, en un edificio de ladrillo con arcos de inspiración chăm y
  budista, cuatro plantas y un estanque con un Buda de terracota en la baja. Entró en la **selección**
  de la Michelin en junio de 2023 —selección, no Bib ni estrella— y ahí sigue.


  **El problema no es el restaurante: es el calendario.** Un menú degustación son dos horas largas, y
  las dos noches de Hanói tienen función a las 20:00 — las [marionetas](#teatro-thang-long) el sábado
  y el [ca trù](#ca-tru-hang-bac) el domingo. Cồ Đàm solo entra **sacrificando la del sábado**, que es
  exactamente la renuncia que ya pide [Gia](#gia): **una estrella Michelin**, doce pases, y **menú
  vegetariano completo avisando al reservar**.


  **¿Y a mediodía?** Abre a las **10:30**, así que la idea es buena y evita el choque con la función —
  pero choca con otra cosa. Hanói son **cuatro comidas contadas**: el sábado, [Luk Lak](#luk-lak) y la
  siesta que sostiene el día del aterrizaje; el domingo, el [bún chả de Obama](#bun-cha-huong-lien) a
  las 11:30 con el [Museo de Bellas Artes](#museo-bellas-artes) a las 13:30 detrás. Dos horas de menú
  cerrado no caben en ninguna de las dos sin llevarse por delante la siesta o el museo.


  Puesta así, la decisión se ordena sola: **si vais a gastar una de las dos noches de Hanói en una
  cena larga, gastadla en la estrella**. Cồ Đàm es el plan B de esa misma jugada — y se convierte en
  plan A solo si preferís una casa **100% chay**, sin carne en la sala, por la mitad de precio. Está
  en el **68A de Trần Hưng Đạo**, o sea entre el [De Syloia](#de-syloia) (17A) y
  [Nàng Tấm](#com-chay-nang-tam) (79A): los tres en la misma acera larga.
