quePedir: >-
  El ***bánh xèo***: la crepe de arroz y cúrcuma, crujiente y del tamaño de un plato, que se rompe
  con la mano, se envuelve en hoja de arroz con lechuga y hierbas y se moja. Y los *nem* de cangrejo.
body: >-
  **Lo que este sitio arregla es un agujero del mapa, no del día.** El *bánh xèo* es uno de los grandes
  platos de Vietnam y es **del sur profundo**, del delta del Mekong — que es exactamente la parte del
  país a la que este viaje **no baja**. Se oye chisporrotear (*xèo* es la onomatopeya del chorro de
  masa en la sartén), sale del tamaño de un plato y se come con las manos.


  Mr Bảy lleva **más de una década** haciéndolo en el casco viejo y entró en el **Bib Gourmand** en
  2025 — con polémica local incluida, porque a más de un hanoiense le pareció raro que la Michelin
  premiara comida del delta en Hanói. Esa polémica es justo la razón de venir: **es la ventana al sur
  que el itinerario no os da**, a ocho minutos andando del [De Syloia](#de-syloia).


  **Ojo con el reparto**: el relleno clásico es cerdo y gamba y el mojo es *nước mắm*, así que esto
  entra en la lista de él. Hay casas que hacen *bánh xèo chay* con seta y brote de soja, pero aquí no
  está anunciado — habría que preguntar y no contar con ello.
