quePedir: >-
  El ***cao lầu chay*** —con seta en vez de cerdo— y las ***bánh vạc***, las «rosas blancas» de masa de
  arroz. Y el ***mì Quảng chay***, que aquí sale con tofu y cacahuete.
body: >-
  **Es la solución al problema de Hoi An para ella**, y por eso está aquí. El recetario de esta ciudad
  —cao lầu, rosas blancas, *hoành thánh*, cơm gà— es de cerdo, gamba y pollo de arriba abajo, y en el
  casco viejo cada segunda carta lleva salsa de pescado escondida. Minh Hiền lleva **más de treinta
  años** haciendo **todo ese repertorio en versión *chay***, y no como concesión: es lo único que
  hacen.

  Es una casa de barrio, sin decoración de farolillos ni carta plastificada, a diez minutos andando del
  puente japonés. Cocina budista de verdad — la que se come en los templos los días 1 y 15 del mes
  lunar.

  Y viene bien justo el día 11, porque es **la última comida en Vietnam antes de Camboya** y os pilla de
  camino al aeropuerto de Đà Nẵng.
