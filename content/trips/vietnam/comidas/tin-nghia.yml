veg: >-
  **100 % vegetariano, y del tipo bueno: sin carne falsa.** Nada de tofu disfrazado de pollo — verdura,
  setas, arroz y legumbre, cocinados como lo que son. Es la casa *chay* más honesta de la ciudad.
quePedir: >-
  El **menú de bandeja** del día, que es lo que come todo el mundo: arroz, tres o cuatro guisos y sopa.
body: >-
  Un comedor **minúsculo** en Trần Hưng Đạo que lleva abierto desde los años sesenta, regentado por una
  familia **cao dai** — la religión sincrética del sur de Vietnam, que junta budismo, taoísmo,
  confucianismo y catolicismo, y cuyos fieles son vegetarianos varios días al mes.

  Lo que lo distingue de los cincuenta vegetarianos de Saigón lo dice Lonely Planet en cinco palabras:
  **«sin recurrir a la carne falsa»**. Aquí no hay *«pato» de gluten* ni *«gambas» de konjac*. Hay
  verdura cocinada por gente que lleva sesenta años cocinándola.

  **Y hay que mirar el calendario antes de ir, porque cierra por luna:** no abre **el día 2 ni el día 16
  del mes lunar** — y el **16 cae el sábado 26**, que es justo vuestra última mañana. Para ese día, no
  contéis con él.
