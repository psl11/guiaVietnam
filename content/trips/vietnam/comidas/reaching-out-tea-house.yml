body: >-
  **Aquí no se habla, y esa es toda la propuesta.** El personal es sordo o con discapacidad auditiva, así
  que se pide **escribiendo en una libreta** o moviendo unas fichas de madera que hay en cada mesa: *agua
  caliente*, *hielo*, *gracias*, *la cuenta*. No hay música. No hay conversación.

  El efecto es difícil de explicar hasta que estás dentro: en mitad del casco viejo —con cuatro mil
  personas al otro lado de la puerta, motos, altavoces y regateo— hay una casa antigua de Trần Phú donde
  de golpe **solo se oye la porcelana**. Es la mejor tregua que da esta ciudad y va a caeros bien
  justamente el día 11 o el 12, cuando ya llevéis dos jornadas de calle.

  Es una **empresa social**: nació para dar formación y empleo estable a personas con discapacidad, y al
  lado tiene un taller de artesanía donde trabajan los mismos artesanos. Lo que se compra allí no es un
  souvenir.
