navLabel: "Mậu Dịch 37 (bao cấp)"
tipo: Comedor temático del *bao cấp* · se paga con cartilla de racionamiento
area: 37 Nam Tràng, isla de Trúc Bạch
cuando: "Sin hueco cómodo — está en Trúc Bạch y las dos cenas de Hanói acaban en el casco viejo"
badge: Guía Michelin (recomendado)
