colas: "No"
veg: >-
  Opciones razonables — la cocina del *bao cấp* es de verdura, tofu y encurtidos **por escasez**, no
  por elección. Ojo igualmente al *nước mắm* y a los caldos de hueso: hay que pedirlo explícito.
quePedir: >-
  La carta de la carestía, que es el sentido del sitio: **rau muống xào** (espinaca de agua salteada),
  **đậu phụ** (tofu frito), **cà pháo muối** (berenjenita encurtida), **canh** clara y arroz. Platos
  humildes servidos en **loza esmaltada** y bandejas de aluminio de la época.
body: >-
  El único restaurante del viaje donde **la comida es lo de menos**. Mậu Dịch Số 37 reconstruye una
  *cửa hàng mậu dịch* —una **tienda estatal de racionamiento**— de hacia 1980: carteles de propaganda,
  bicicletas Thống Nhất, radios de baquelita y la colección de antigüedades del dueño. En la mesa hay
  una **cartilla**; se cambia por **cupones** (*tem phiếu*) y con ellos se paga al final. No es un
  disfraz gracioso: es exactamente cómo se comía en Hanói.


  El **bao cấp** («subsidio») fue el periodo entre la reunificación de 1976 y las reformas del **Đổi
  Mới de 1986**: una década de economía planificada en la que el arroz, la carne y hasta el
  queroseno se conseguían con cupón, había que hacer cola de madrugada y la carne aparecía un par de
  veces al mes. Los padres de cualquier hanoiense de cuarenta años lo vivieron. Cenar aquí después
  de haber visto Hỏa Lò y el Museo de Etnología cierra el arco: **la historia de Vietnam que no es
  guerra ni templos, sino la cola del arroz**.


  **Y aquí está el problema, dicho para que sea una decisión y no un descuido.** Cae en **Trúc Bạch**,
  a un paso de [Ngũ Xã](#ngu-xa-truc-bach) y de [Aummee](#aummee) — es decir, a tres kilómetros de
  donde acaban las dos noches de Hanói, que terminan en el casco viejo con la
  [Train Street](#train-street) o el [ca trù](#ca-tru-hang-bac). Por ahí solo pasáis **veinte minutos
  el día 2, a las 14:00**, y a esa hora ya habréis comido. Entra si renunciáis a la función de una de
  las dos noches; si no, queda como la pena de este viaje.
