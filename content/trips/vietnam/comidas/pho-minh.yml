body: >-
  **Hay que encontrarlo, y esa es media gracia.** No da a la calle: está metido en un **callejón que sale
  del 63 de Pasteur**, y desde fuera no se ve nada. Lo lleva la misma familia desde los años cincuenta,
  en el zaguán de su propia casa, y tiene **Bib Gourmand**.

  Está a **unos quinientos metros del [Continental](#saigon-hotel)**, así que es exactamente el desayuno
  del día 16: se sale del hotel, se desayuna aquí y se empieza el paseo de Đồng Khởi con el cuerpo
  caliente. Abre temprano, que es lo que hace falta un día que termina en un avión.

  Y es el último phở del viaje. El primero fue en Hanói el día que aterrizasteis — **conviene tener eso
  presente al probarlo**, porque no es el mismo plato.
