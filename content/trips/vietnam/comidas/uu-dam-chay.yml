body: >-
  El **chay de referencia** de la ciudad, con **Bib Gourmand** y cocina *zero-waste* (los restos van
  a encurtidos; el arroz sobrante, a pasteles crujientes). Producto de primera y ambiente sereno de
  arte budista: una **cena excelente sin renuncias**, y la mejor respuesta a que buena parte de los
  clásicos de Hanói no sean aptos para vegetarianos.


  Fue **el primer vegetariano de Hanói en entrar en la Michelin**, y sigue siendo el único de la
  ciudad con Bib Gourmand. Su casa hermana, [**Cồ Đàm**](#co-dam), juega en otra liga —menú
  degustación cerrado, dos horas— y por eso no cabe en estas dos noches; esta sí, porque **se come a
  la carta y se sale a tiempo** para la función de las 20:00.
seenIn:
