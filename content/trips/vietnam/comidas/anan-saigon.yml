body: >-
  **Una estrella Michelin, y montada dentro de un mercado húmedo.** Ănăn ocupa un local del viejo mercado
  de **Chợ Cũ**, en Tôn Thất Đạm — una calle de puestos de fruta y pescado a cuatrocientos metros de
  Nguyễn Huệ—, y el chef es **Peter Cường Franklin**, vietnamita evacuado de niño en 1975, formado
  después en la alta cocina y vuelto a Saigón para hacer esto.

  Y «esto» es lo que hace que encaje en este viaje y no sea un capricho suelto: **coge recetas de comida
  callejera y las rehace con técnica de restaurante de alta cocina**. Es literalmente la tesis de la
  guía —que lo bueno de Vietnam está en la calle— defendida desde el otro lado. Michelin le dio la
  estrella en **2023** y la mantiene desde entonces.

  **Y aquí va el veredicto honesto, que ha cambiado.** Tenía un único hueco —la noche del jueves 24— y
  **ese hueco ya no existe**: Air Cambodia movió el vuelo de las 15:00 al de las 19:40 y esa noche
  llegáis a Saigón a las diez y cuarto. El viernes 25 es Trung Thu en Chợ Lớn y no se toca, y el sábado
  26 voláis a mediodía. **Así que en este viaje no cabe**, y queda apuntado para el siguiente.

  Si aun así quisierais forzarlo, la única forma sería sacrificar la noche de los farolillos. No lo
  recomiendo. Si os apetece un capricho de despedida, este
  es el que tiene argumento. Si no, hay una versión intermedia que sale mucho mejor de precio: su azotea,
  el **Nhậu Nhậu**, sirve cócteles y platos sueltos de la misma cocina **sin menú degustación** — y desde
  ahí se ve el mercado desde arriba.
